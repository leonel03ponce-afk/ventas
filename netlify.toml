# Netlify: publica la carpeta app/ y arma las funciones de cobro automático.
# Con "Deploy manually" (arrastrar la carpeta) las funciones no se arman:
# hay que conectar este repositorio (ver COBRO-AUTOMATICO.md).
[build]
  publish = "app"
  functions = "netlify/functions"
  # Solo publica si cambió algo del sitio. Los cambios de videos, textos o
  # documentos no gastan créditos de Netlify.
  # (si la comparación falla por cualquier motivo, publica igual)
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- app netlify netlify.toml package.json package-lock.json && exit 0 || exit 1"

[functions]
  node_bundler = "esbuild"
