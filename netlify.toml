# Netlify: publica la carpeta app/ y arma las funciones de cobro automático.
# Con "Deploy manually" (arrastrar la carpeta) las funciones no se arman:
# hay que conectar este repositorio (ver COBRO-AUTOMATICO.md).
[build]
  publish = "app"
  functions = "netlify/functions"
  # (04/11) Se sacó el "ignore": comparaba mal y cancelaba TODAS las publicaciones desde
  # GitHub desde el 25/10 ("Canceled build due to no content change"). Ahora cada push publica.
  # Para no gastar créditos: no subir cambios sueltos de documentos; juntarlos con un cambio del sitio.

[functions]
  node_bundler = "esbuild"
