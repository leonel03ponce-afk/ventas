<script>/* respaldo por si config.js no carga (se actualiza con sincronizar-config.py) */
if (!window.CONFIG || !window.CONFIG.planes) window.CONFIG = /*CFG*/{
  producto: "SISTEMA",                              /* nombre que ve el cliente */
  marca: "Brian Ponce",                             /* quién lo entrena */
  tel: "11 7115-8427",                              /* teléfono visible */
  whatsapp: "https://wa.me/5491171158427",          /* link de WhatsApp */
  acento: "#E9B75B",                                /* color de la marca */
  sitio: "https://brian-ponce.netlify.app/",        /* dirección de la app, para los links de recomendación */
  sistema: "#sistema",
  lanzamiento: true,                                /* muestra "Precio de lanzamiento" en la venta. Cuando subas los precios, ponelo en false */

  acceso: {
    libre: false,                                   /* true = sin código, entra cualquiera */
    secreto: "ponce-2026-xK7m",                     /* firma de los códigos: cambialo y los viejos dejan de servir */
    admin: "PONCE-2026",                            /* escribilo en la pantalla de acceso para abrir el panel */
    bloqueados: [],                                 /* seriales dados de baja, ej: ["AB", "AC"] */
    prueba: 0,                                      /* días de prueba gratis (0 = sin prueba) */
    pruebaPorWhatsApp: true,                        /* true = para activarla te escriben y les pasás la palabra */
    palabraPrueba: "ARRANCO"                        /* la palabra que mandás por WhatsApp para activar la prueba */
  },

  /* Precios en pesos. Tienen que coincidir con lo que cobra cada link de
     Mercado Pago. "incluye" es la lista que se ve en la tarjeta del plan. */
  planes: [
    { id: "trimestral", nombre: "3 meses",      precio: 24900,  meses: 3,  detalle: "sale $8.300 por mes · 3 meses de acceso", pago: "https://mpago.la/2SDK5Ty",
      incluye: ["Rutina personalizada armada por Brian", "Tu día en una lista: entreno, comida, hábitos y plata", "Resumen semanal con puntaje y rango", "Récords, rangos y rachas para compartir", "Finanzas: cuentas a pagar, gastos y ahorro", "Plan de calorías y proteína", "Consultas por WhatsApp"] },
    { id: "anual",      nombre: "Anual",        precio: 69900,  meses: 12, detalle: "sale $5.825 por mes · ahorrás 30%",              pago: "https://mpago.la/2cdoPet", destacado: "Más elegido",
      incluye: ["Todo lo del plan de 3 meses", "Rutina nueva cada 3 meses", "Revisión de tu progreso cada mes", "Prioridad en WhatsApp"] },
    { id: "vida",       nombre: "Para siempre", precio: 119900, meses: 0,  detalle: "un solo pago · acceso de por vida",              pago: "https://mpago.la/28ED6Ht",
      incluye: ["Todo lo del plan anual", "Sin cuotas, nunca más", "Todas las funciones nuevas que salgan"] }
  ],

  /* Clientes de afuera de Argentina: ven estos precios en dólares.
     "pago" es un link de cobro internacional (Hotmart, PayPal, etc.);
     vacío = el botón abre WhatsApp para coordinar el pago. */
  internacional: {
    activo: true,
    moneda: "US$",
    metodos: "PayPal, USDT (Binance) o Zinli",
    /* Hotmart (cobro automático afuera): código de cada oferta → plan.
       Ej: { "a1b2c3d4": "trimestral", "e5f6g7h8": "anual", "i9j0k1l2": "vida" }.
       Vacío = se reconoce el plan por el precio. Los links de pago van en "pago". */
    hotmart: { ofertas: {} },
    planes: [
      { id: "trimestral", nombre: "3 meses",      precio: 19, meses: 3,  detalle: "sale US$6,33 por mes", pago: "" },
      { id: "anual",      nombre: "Anual",        precio: 49, meses: 12, detalle: "sale US$4,08 por mes · ahorrás 35%", pago: "", destacado: "Más elegido" },
      { id: "vida",       nombre: "Para siempre", precio: 89, meses: 0,  detalle: "un solo pago · acceso de por vida", pago: "" }
    ]
  },

  /* Vendedores: se llevan "comision" % del primer pago de cada cliente
     que traen, y "renovacion" % de cada renovación de ese cliente
     (0 = las renovaciones no pagan comisión). */
  recomendados: {
    activo: true,
    comision: 43,
    renovacion: 15,
    cuandoPago: "a fin de cada mes",
    premio: "",                                                        /* premio del mes para el n.º 1 del ranking, ej: "$50.000 extra". Vacío = no se muestra */                                   /* se lo muestra a los vendedores */
    comoPago: "En Argentina por Mercado Pago o transferencia. Afuera, por USDT (Binance), PayPal o Zinli."
  }
}/*FIN-CFG*/;</script>
<style>
:root { --void: #0B0715; --panel: #150E24; --panel2: #1E1433; --line: #332248; --bone: #F3EDE4; --dim: #9C8AB8; --dimmer: #645279; --gold: #E9B75B; --jade: #4BD489; --silver: #C9D1E4; --bronze: #D49A6A;
  --bevel: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); --bevel-s: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(90% 40% at 50% 0%, rgba(233,183,91,.16), transparent 70%), var(--void); color: var(--bone); font: 400 16px/1.5 Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: 30px 16px 50px; }
.k { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 10px 0 0; font: 700 clamp(40px, 11vw, 58px)/1 "Chakra Petch", sans-serif; }
h1 span { color: var(--gold); }
p { margin: 0; }
.sub { margin-top: 10px; color: var(--dim); }
.premio { margin-top: 16px; padding: 14px 16px; background: rgba(233,183,91,.1); border-left: 4px solid var(--gold); font-weight: 600; }
.tabs { display: flex; gap: 6px; margin-top: 22px; }
.tabs button { flex: 1; height: 44px; font: 600 15px/1 Archivo, sans-serif; color: var(--dim); background: var(--panel); border: 0; clip-path: var(--bevel-s); cursor: pointer; }
.tabs button.on { color: var(--void); background: var(--gold); }
.podio { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; margin-top: 26px; }
.podio div { min-width: 0; padding: 16px 8px 14px; text-align: center; background: var(--panel); clip-path: var(--bevel-s); }
.podio .p1 { padding-top: 26px; background: linear-gradient(180deg, rgba(233,183,91,.25), var(--panel)); }
.podio i { display: block; font: 700 30px/1 "Chakra Petch", sans-serif; font-style: normal; }
.podio .p1 i { color: var(--gold); font-size: 40px; } .podio .p2 i { color: var(--silver); } .podio .p3 i { color: var(--bronze); }
.podio b { display: block; margin-top: 8px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podio span { display: block; margin-top: 2px; font-size: 13px; color: var(--dim); }
.lista { margin-top: 10px; display: grid; gap: 6px; }
.fila { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--panel); clip-path: var(--bevel-s); }
.fila i { font: 700 17px/1 "Chakra Petch", sans-serif; font-style: normal; color: var(--dimmer); }
.fila b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.fila span { color: var(--dim); font-size: 14px; }
.yo { box-shadow: inset 0 0 0 2px var(--jade); }
.podio .yo { box-shadow: inset 0 0 0 2px var(--jade); }
.vacio { margin-top: 26px; padding: 26px 18px; text-align: center; color: var(--dim); background: var(--panel); clip-path: var(--bevel); }
.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 22px; padding: 0 20px; font: 700 16px/1 Archivo, sans-serif; color: var(--void); background: var(--jade); clip-path: var(--bevel-s); text-decoration: none; }
.nota { margin-top: 14px; font-size: 13px; color: var(--dimmer); text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <p class="k">Ranking de vendedores</p>
  <h1>¿Quién vende <span>más?</span></h1>
  <p class="sub" id="sub">Las ventas de <span data-c="producto">SISTEMA</span> de cada vendedor. Se actualiza solo.</p>
  <p class="premio" id="premio" hidden></p>
  <div class="tabs"><button type="button" class="on" data-r="esteMes" id="t-mes">Este mes</button><button type="button" data-r="historico">Histórico</button></div>
  <div id="podio" class="podio"></div>
  <div id="lista" class="lista"></div>
  <p class="vacio" id="vacio" hidden></p>
  <a class="btn" href="vendedores.html" id="cta">Quiero estar en el ranking</a>
  <p class="nota"><a href="guia-vendedores.html" style="color:var(--jade)">Guía para vender más →</a></p>
</div>
<script>
(function () {
  "use strict";
  var C = window.CONFIG || {}, R = C.recomendados || {};
  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  document.querySelectorAll("[data-c=producto]").forEach(function (e) { e.textContent = C.producto || "SISTEMA"; });
  if (R.premio) { var pr = document.getElementById("premio"); pr.textContent = "🏆 Premio del mes para el n.º 1: " + R.premio; pr.hidden = false; }
  var yo = "";
  try { var n = localStorage.getItem("vendedor:nombre"); if (n) { yo = String(n).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30); document.getElementById("cta").textContent = "Sacá tu link y los textos"; } } catch (e) {}
  var D = null, vista = "esteMes";
  var ventas = function (n) { return n + (n === 1 ? " venta" : " ventas"); };
  function pintar() {
    var l = (D && D[vista]) || [];
    var top = l.slice(0, 3), resto = l.slice(3);
    var orden = [top[1], top[0], top[2]];
    document.getElementById("podio").innerHTML = top.length ? orden.map(function (x, i) {
      if (!x) return "<div style=\"visibility:hidden\"></div>";
      var p = [2, 1, 3][i];
      return '<div class="p' + p + (x.ref === yo ? " yo" : "") + '"><i>' + ["", "🥇", "🥈", "🥉"][p] + '</i><b>' + esc(x.nombre) + "</b><span>" + ventas(x.ventas) + "</span></div>";
    }).join("") : "";
    document.getElementById("lista").innerHTML = resto.map(function (x, i) {
      return '<div class="fila' + (x.ref === yo ? " yo" : "") + '"><i>' + (i + 4) + "</i><b>" + esc(x.nombre) + "</b><span>" + ventas(x.ventas) + "</span></div>";
    }).join("");
    var v = document.getElementById("vacio");
    v.hidden = !!l.length;
    v.textContent = vista === "esteMes" ? "Todavía nadie vendió este mes. La primera venta te pone arriba de todo. 🔥" : "Todavía no hay ventas. ¡Sé el primero!";
  }
  document.querySelector(".tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-r]"); if (!b) return;
    vista = b.getAttribute("data-r");
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
    pintar();
  });
  fetch("/api/ranking", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) {
    D = d;
    document.getElementById("t-mes").textContent = MESES[+d.mes.slice(5) - 1].replace(/^./, function (c) { return c.toUpperCase(); });
    pintar();
  }).catch(function () {
    var v = document.getElementById("vacio"); v.hidden = false; v.textContent = "El ranking todavía no está disponible.";
  });
})();
</script>
</body>
</html>
