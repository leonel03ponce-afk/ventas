    if (ev.target.id === "rt-auto") {
      autoRest = ev.target.checked;
      try { localStorage.setItem("rutina-cliente-auto", autoRest ? "1" : "0"); } catch (err) { /* sin almacenamiento */ }
      return;
    }
    if (ev.target.id === "rt-hora") {
      horaEntreno = minutosDe(ev.target.value) >= 0 ? ev.target.value : "";
      try { localStorage.setItem(KEY_HORA, horaEntreno); } catch (err) { /* sin almacenamiento */ }
      programarRecordatorio();
      const nota = document.getElementById("rt-bkn");
      if (nota) {
        nota.textContent = horaEntreno
          ? "Listo. Si a las " + horaEntreno + " no entrenaste, te avisamos."
          : "Recordatorio apagado.";
      }
      return;
    }
    if (ev.target.id === "rt-noti") {
      const casilla = ev.target;
      if (!casilla.checked) {
        aviso = false;
        try { localStorage.setItem(KEY_NOTI, "0"); } catch (err) { /* sin almacenamiento */ }
        return;
      }
      /* el permiso lo tiene que dar el navegador, y solo dentro de un toque */
      casilla.checked = false;
      pedirAviso().then((ok) => {
        aviso = ok;
        try { localStorage.setItem(KEY_NOTI, ok ? "1" : "0"); } catch (err) { /* sin almacenamiento */ }
        casilla.checked = ok;
        const nota = document.getElementById("rt-bkn");
        if (nota) {
          nota.textContent = ok
            ? "Listo. Te vamos a avisar cuando termine el descanso."
            : "El navegador no dio permiso. Activalo desde el candado de la barra de direcciones.";
        }
        if (ok) sfx("listo");
      });
      return;
    }
    if (ev.target.id !== "rt-snd") return;
    sound = ev.target.checked;
    try { localStorage.setItem(KEY_SOUND, sound ? "1" : "0"); } catch (err) { /* sin almacenamiento */ }
    if (sound) { audioOn(); setTimeout(() => sfx("record"), 60); }
  });

  footEl.addEventListener("input", (ev) => {
    const t = ev.target;
    if (!t.dataset || !t.dataset.q) return;
    answers[t.dataset.q] = t.value;
    try { localStorage.setItem(KEY_FORM, JSON.stringify(answers)); } catch (err) { /* sin almacenamiento */ }
    const send = document.getElementById("rt-send");
    if (send) send.href = waUrl(waText());
  });

  welEl.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    if (b.dataset.act === "welok") {
      try { localStorage.setItem(KEY_WEL, "1"); } catch (err) { /* sin almacenamiento */ }
      renderWel();
    }
    if (b.dataset.act === "form") openPanel("form");
  });

  /* La burbuja se aparta mientras scrolleás para no tapar los números */
  const waEl = PANE.querySelector(".wa");
  let waTimer;
  window.addEventListener("scroll", () => {
    if (!waEl) return;
    waEl.classList.add("off");
    clearTimeout(waTimer);
    waTimer = setTimeout(() => waEl.classList.remove("off"), 600);
  }, { passive: true });

  /* ---------- Cronómetro de descanso ---------- */
  /* ───── Avisos del celular ─────
     Sirven para lo que más molesta: el descanso termina con el teléfono
     guardado y no te enterás. Solo avisa si la app NO está en pantalla.
     En iPhone funciona únicamente con la app instalada en la pantalla de
     inicio (iOS 16.4 en adelante); en Android anda siempre. */
  const KEY_NOTI = "rutina-cliente-aviso";
  let aviso = false;
  try { aviso = localStorage.getItem(KEY_NOTI) === "1"; } catch (err) { /* sin almacenamiento */ }

  const hayAvisos = () => typeof Notification !== "undefined";
  const permiso = () => (hayAvisos() ? Notification.permission : "denied");

  function pedirAviso() {
    if (!hayAvisos()) return Promise.resolve(false);
    if (Notification.permission === "granted") return Promise.resolve(true);
    if (Notification.permission === "denied") return Promise.resolve(false);
    try {
      const r = Notification.requestPermission();
      return (r && r.then ? r : Promise.resolve(r)).then((p) => p === "granted");
    } catch (err) { return Promise.resolve(false); }
  }

  function avisar(titulo, cuerpo, etiqueta) {
    if (!aviso || permiso() !== "granted") return;
    if (!document.hidden) return;          /* si la está mirando, no molestamos */
    const opciones = {
      body: cuerpo, icon: "icono-192.png", badge: "icono-192.png",
      tag: etiqueta || "sistema", renotify: true, vibrate: [180, 90, 180],
    };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready
          .then((reg) => reg.showNotification(titulo, opciones))
          .catch(() => { try { new Notification(titulo, opciones); } catch (e) { /* nada */ } });
      } else {
        new Notification(titulo, opciones);
      }
    } catch (err) { /* el navegador no quiere: no pasa nada */ }
  }

  /* ───── Recordatorio a tu hora ─────
     Si llega tu hora de entrenar y todavía no registraste nada, te avisa.
     Sin servidor no se puede despertar una app cerrada: el aviso sale si
     la app quedó abierta o en segundo plano, y si no, al abrirla te
     encontrás el cartel. Por eso también está el cartel, no solo el aviso. */
  const KEY_HORA = "rutina-cliente-hora";
  const KEY_ULT_REC = "rutina-cliente-ultrec";
  let horaEntreno = "";
  try { horaEntreno = localStorage.getItem(KEY_HORA) || ""; } catch (err) { /* sin almacenamiento */ }

  function entrenoHoy() {
    const k = todayKey();
    return state.days.some((d) => flat(d).some((it) =>
      (it.hist || []).some((s) => s.d === k && s.sets.some(hasVal))));
  }

  function minutosDe(hhmm) {
    const p = String(hhmm || "").split(":");
    if (p.length !== 2) return -1;
    const h = Number(p[0]), m = Number(p[1]);
    if (!(h >= 0 && h < 24 && m >= 0 && m < 60)) return -1;
    return h * 60 + m;
  }

  let recTm = null;
  function programarRecordatorio() {
    clearTimeout(recTm);
    const obj = minutosDe(horaEntreno);
    if (obj < 0) return;
    const t = new Date();
    const ahora = t.getHours() * 60 + t.getMinutes();
    let faltan = obj - ahora;
    if (faltan <= 0) faltan += 24 * 60;                 /* es para mañana */
    recTm = setTimeout(() => {
      if (!entrenoHoy() && yaRecordado() !== todayKey()) {
        marcarRecordado();
        avisar("Te toca entrenar", "Todavía no registraste nada hoy. Son 40 minutos.", "recordatorio");
      }
      programarRecordatorio();
    }, Math.min(faltan * 60000, 6 * 3600000));          /* nunca más de 6 h de un saque */
  }
  function yaRecordado() {
    try { return localStorage.getItem(KEY_ULT_REC) || ""; } catch (err) { return ""; }
  }
  function marcarRecordado() {
    try { localStorage.setItem(KEY_ULT_REC, todayKey()); } catch (err) { /* sin almacenamiento */ }
  }

  /* ¿Mostrar el cartel al abrir la app? */
  function tocaRecordar() {
    const obj = minutosDe(horaEntreno);
    if (obj < 0 || entrenoHoy()) return false;
    const t = new Date();
    return t.getHours() * 60 + t.getMinutes() >= obj;
  }

  const KEY_SOUND = "rutina-cliente-sonido";
  let sound = true;
  try { sound = localStorage.getItem(KEY_SOUND) !== "0"; } catch (err) { /* sin almacenamiento */ }
  const tmEl = document.getElementById("rt-timer");
  let tm = null, tmTick = null, ac = null;

  let maestro = null;
  function audioOn() {
    if (!sound) return;
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        /* Salida maestra: el limitador deja subir el volumen sin que
           los sonidos se empasten ni distorsionen cuando se superponen. */
        const lim = ac.createDynamicsCompressor();
        lim.threshold.value = -8;
        lim.knee.value = 6;
        lim.ratio.value = 12;
        lim.attack.value = 0.003;
        lim.release.value = 0.12;
        maestro = ac.createGain();
        maestro.gain.value = 3.8;
        maestro.connect(lim);
        lim.connect(ac.destination);
      }
      if (ac.state === "suspended") ac.resume();
    } catch (err) { ac = null; maestro = null; }
  }
  const salida = () => maestro || (ac && ac.destination);

  /* ───── Sonidos de la app ─────
     Todo sintetizado: no hay archivos, no pesa y anda sin señal. */
  const NOTA_HZ = { do: 523.25, re: 587.33, mi: 659.25, fa: 698.46, sol: 783.99,
                    la: 880.00, si: 987.77, do2: 1046.5, re2: 1174.7, mi2: 1318.5, sol2: 1568.0 };

  function tono(freq, inicio, dur, vol, tipo, curva) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || "sine";
    const t = ac.currentTime + inicio;
    if (curva) {
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, curva), t + dur);
    } else {
      o.frequency.value = freq;
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(salida());
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  /* Golpe de cuerpo: el "tum" que hace que un sonido se sienta sólido
     y no un pitido de microondas. */
  function golpe(inicio, freq, dur, vol) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    const t = ac.currentTime + inicio;
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.4), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(salida());
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  /* Click seco y filtrado: la sensación de tecla mecánica. */
  function click(inicio, vol, brillo) {
    if (!ac) return;
    const n = Math.max(1, Math.floor(ac.sampleRate * 0.03));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 14);
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = buf;
    f.type = "bandpass";
    f.frequency.value = brillo || 2600;
    f.Q.value = 1.1;
    g.gain.value = vol;
    s.connect(f);
    f.connect(g);
    g.connect(salida());
    s.start(ac.currentTime + inicio);
  }

  function ruidito(inicio, dur, vol) {
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf;
    g.gain.value = vol;
    s.connect(g);
    g.connect(salida());
    s.start(ac.currentTime + inicio);
  }

  const VIBRA = { toque: 8, serie: 18, guardar: 22, record: [30, 50, 30, 50, 70], dia: [40, 60, 40, 60, 120], error: [60, 40, 60] };

  function sfx(tipo) {
    if (!sound) return;
    audioOn();
    if (navigator.vibrate && VIBRA[tipo]) {
      vibraPropia = true;
      try { navigator.vibrate(VIBRA[tipo]); } catch (e) { /* sin vibración */ }
      vibraPropia = false;
    }
    if (!ac) return;
    try {
      switch (tipo) {
        case "tecla":                                      /* cada número que escribís */
          click(0, 0.09, 3200);
          tono(NOTA_HZ.do2 * 2, 0, 0.018, 0.035, "sine");
          break;
        case "toque":                                      /* al abrir un ejercicio */
          click(0, 0.10, 2400);
          tono(NOTA_HZ.sol2, 0, 0.05, 0.06, "sine");
          break;
        case "serie":                                      /* completaste repes + kilos */
          click(0, 0.16, 2800);
          golpe(0, 150, 0.14, 0.26);
          tono(NOTA_HZ.mi2, 0.01, 0.11, 0.20, "triangle");
          tono(NOTA_HZ.sol2, 0.07, 0.15, 0.15, "triangle");
          tono(NOTA_HZ.do2 * 2, 0.07, 0.13, 0.05, "sine");
          break;
        case "guardar":                                    /* quedó guardado */
          golpe(0, 130, 0.16, 0.24);
          tono(NOTA_HZ.do2, 0, 0.12, 0.19, "sine");
          tono(NOTA_HZ.sol2, 0.09, 0.2, 0.14, "sine");
          break;
        case "mision":                                     /* misión del Sistema completada */
          click(0, 0.18, 3000);
          golpe(0, 160, 0.18, 0.3);
          [NOTA_HZ.do2, NOTA_HZ.mi2, NOTA_HZ.sol2].forEach((f, i) => {
            tono(f, i * 0.055, 0.26, 0.2 - i * 0.03, "triangle");
          });
          tono(NOTA_HZ.do2 * 2, 0.16, 0.3, 0.07, "sine");
          ruidito(0.01, 0.1, 0.045);
          break;
        case "aporte":                                     /* sumaste un aporte */
          click(0, 0.13, 2200);
          golpe(0, 120, 0.13, 0.2);
          tono(NOTA_HZ.sol, 0, 0.1, 0.16, "sine");
          tono(NOTA_HZ.re2, 0.06, 0.16, 0.12, "sine");
          break;
        case "record":                                     /* récord personal */
          click(0, 0.2, 3400);
          golpe(0, 170, 0.22, 0.34);
          [NOTA_HZ.do2, NOTA_HZ.mi2, NOTA_HZ.sol2, NOTA_HZ.do2 * 2].forEach((f, i) => {
            tono(f, i * 0.085, 0.34, 0.24 - i * 0.025, "triangle");
          });
          golpe(0.26, 90, 0.4, 0.22);
          ruidito(0.02, 0.22, 0.07);
          break;
        case "dia":                                        /* cerraste el día */
          golpe(0, 180, 0.3, 0.3);
          [[NOTA_HZ.do, 0], [NOTA_HZ.mi, 0.1], [NOTA_HZ.sol, 0.2], [NOTA_HZ.do2, 0.3],
           [NOTA_HZ.mi2, 0.4], [NOTA_HZ.sol2, 0.5]].forEach((p) => {
            tono(p[0], p[1], 0.55, 0.22, "triangle");
          });
          tono(NOTA_HZ.do / 2, 0.5, 1.3, 0.28, "sine");
          golpe(0.5, 110, 0.7, 0.3);
          ruidito(0.5, 0.7, 0.09);
          break;
        case "tic":                                        /* últimos segundos del descanso */
          click(0, 0.12, 2000);
          tono(NOTA_HZ.la, 0, 0.06, 0.17, "square");
          break;
        case "error":
          golpe(0, 110, 0.14, 0.18);
          tono(220, 0, 0.18, 0.17, "sawtooth", 140);
          break;
        case "quitar":
          click(0, 0.08, 1600);
          tono(330, 0, 0.1, 0.11, "sine", 180);
          break;
        case "listo":                                      /* hábito o paso completado */
          click(0, 0.11, 2600);
          tono(NOTA_HZ.sol, 0, 0.08, 0.16, "sine");
          tono(NOTA_HZ.do2, 0.05, 0.16, 0.13, "sine");
          break;
      }
    } catch (err) { /* sin audio */ }
  }

  function ring() {
    if (sound && navigator.vibrate) {
      vibraPropia = true;
      try { navigator.vibrate([180, 90, 180]); } catch (err) { /* sin vibración */ }
      vibraPropia = false;
    }
    if (!sound || !ac) return;
    try {
      [0, 0.32, 0.64].forEach((off) => {
        golpe(off, 190, 0.2, 0.34);
        tono(NOTA_HZ.la, off, 0.3, 0.42, "sine");
        tono(NOTA_HZ.mi2, off + 0.01, 0.24, 0.2, "sine");
        tono(NOTA_HZ.la * 2, off + 0.01, 0.16, 0.07, "sine");
      });
    } catch (err) { /* sin audio */ }
  }

  /* En el celular (sobre todo en iPhone) el audio solo se desbloquea
     dentro de un toque real. No damos el desbloqueo por hecho: seguimos
     intentando en cada toque hasta que el contexto quede en "running".
     Si no, al prender el sonido más tarde el iPhone nunca suena. */
  document.addEventListener("pointerdown", () => {
    if (ac && ac.state === "running") return;
    audioOn();
  }, { once: false, capture: true, passive: true });

  /* ───── Sonido en el panel de Sistema ─────
     Sistema viene compilado y no se puede editar, pero avisa cada acción
     con una vibración de largo distinto: 14 al completar una misión y 18
     al sumar un aporte. Nos colgamos de ahí y le ponemos el sonido.
     En iPhone navigator.vibrate no existe, así que lo definimos nosotros:
     no vibra (no se puede), pero suena. */
  let vibraPropia = false;
  (function engancharSistema() {
    const real = navigator.vibrate ? navigator.vibrate.bind(navigator) : null;
    const puente = function (patron) {
      if (!vibraPropia) {
        const ms = Array.isArray(patron) ? patron[0] : patron;
        if (ms === 14) sfx("mision");
        else if (ms === 18) sfx("aporte");
        else sfx("listo");
      }
      if (real) { try { return real(patron); } catch (err) { return false; } }
      return false;
    };
    try {
      Object.defineProperty(navigator, "vibrate", {
        value: puente, writable: true, configurable: true,
      });
    } catch (err) { /* el navegador no deja: Sistema queda sin sonido */ }
  })();

  let avisoTm = null;
  function programarAviso(secs, label) {
    clearTimeout(avisoTm);
    if (!aviso || permiso() !== "granted") return;
    /* Dos caminos para el mismo aviso: este temporizador, que llega aunque
       la app esté en segundo plano, y el del cronómetro cuando volvés.
       El "tag" hace que sea una sola notificación y no dos. */
    avisoTm = setTimeout(() => {
      if (tm && !tm.avisado) {
        tm.avisado = true;
        avisar("Se terminó el descanso", label ? "Volvé a " + label : "Dale, otra serie.", "descanso");
      }
    }, Math.max(1000, secs * 1000));
  }

  /* El descanso queda guardado: si el sistema cierra la app mientras
     estás en WhatsApp, al volver sigue donde iba (o te dice hace cuánto
     terminó). Y mientras corre, la pantalla no se apaga sola. */
  const KEY_TM = "rutina-cliente-descanso";
  let wake = null;
  function guardarTm() {
    try {
      if (tm && !tm.done) localStorage.setItem(KEY_TM, JSON.stringify({ total: tm.total, endAt: tm.endAt, label: tm.label, paused: tm.paused, left: tm.left }));
      else localStorage.removeItem(KEY_TM);
    } catch (err) { /* sin almacenamiento */ }
  }
  function pantallaPrendida(si) {
    try {
      if (si && !wake && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then((w) => { wake = w; w.addEventListener("release", () => { wake = null; }); }).catch(() => {});
      } else if (!si && wake) { wake.release().catch(() => {}); wake = null; }
    } catch (err) { /* sin wake lock */ }
  }
  function tmStart(secs, label) {
    audioOn();
    programarAviso(secs, label);
    tm = { total: secs, left: secs, endAt: Date.now() + secs * 1000, paused: false, label: label || "", done: false };
    PANE.classList.add("with-timer");
    tmRender();
    clearInterval(tmTick);
    tmTick = setInterval(tmLoop, 250);
    guardarTm();
    pantallaPrendida(true);
  }
  function tmStop() {
    try { localStorage.removeItem(KEY_TM); } catch (err) { /* sin almacenamiento */ }
    pantallaPrendida(false);
    tm = null;
    clearTimeout(avisoTm);
    clearInterval(tmTick);
    PANE.classList.remove("with-timer");
    tmEstado = "";
    tmEl.innerHTML = "";
  }
  function tmLoop() {
    if (!tm) return;
    if (!tm.paused) tm.left = Math.max(0, Math.round((tm.endAt - Date.now()) / 1000));
    if (!tm.done && tm.left > 0 && tm.left <= 3 && tm.tic !== tm.left) { tm.tic = tm.left; sfx("tic"); }
    if (!tm.left && !tm.done) {
      tm.done = true;
      /* Si el celu estuvo en el bolsillo o en otra app, el reloj se congela
         y recién volvemos acá al rato. En ese caso no sirve que suene tarde:
         le decimos cuánto hace que terminó el descanso. */
      const atraso = Math.round((Date.now() - tm.endAt) / 1000);
      if (atraso > 4) { tm.tarde = atraso; } else { ring(); }
      if (!tm.avisado) {
        tm.avisado = true;
        avisar("Se terminó el descanso", tm.label ? "Volvé a " + tm.label : "Dale, otra serie.", "descanso");
      }
      if (navigator.vibrate) { try { navigator.vibrate([220, 120, 220, 120, 420]); } catch (err) { /* sin vibración */ } }
      guardarTm();
      pantallaPrendida(false);
    }
    if (tm.done && Date.now() - tm.endAt > (tm.tarde ? 20000 + tm.tarde * 1000 : 15000)) return tmStop();
    tmRender();
  }
  let tmEstado = "";
  function tmRender() {
    if (!tm) return;
    const frac = tm.total ? Math.max(0, Math.min(1, tm.left / tm.total)) : 0;
    const r = 20, c = 2 * Math.PI * r;
    const ultimos = !tm.done && tm.left <= 5 && tm.left > 0;
    const clave = [tm.done, tm.paused, ultimos, tm.label, !!tm.tarde].join("|");

    /* Solo se rehace el HTML cuando cambia el estado: si no, parpadea */
    if (clave !== tmEstado || !tmEl.firstChild) {
      tmEstado = clave;
      tmEl.innerHTML = '<div class="tm-in' + (tm.done ? " tm-done" : "") + (ultimos ? " tm-ya" : "") + '">' +
        '<button type="button" class="tm-dial" data-act="tm-pause" aria-label="' + (tm.paused ? "Seguir" : "Pausar") + '">' +
          '<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="d-bg" cx="24" cy="24" r="' + r + '"/>' +
          '<circle class="d-v" cx="24" cy="24" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="0"/></svg>' +
          '<span class="tm-time"></span></button>' +
        '<div class="tm-mid"><p class="tm-l"></p>' +
        (tm.label ? '<p class="tm-e">' + esc(tm.label) + "</p>" : "") + "</div>" +

  /* Los números suben contando */
  function contar(el) {
    const fin = parseFloat(el.dataset.n || "0");
    if (!fin || quieto()) { el.textContent = el.dataset.fin || String(fin); return; }
    el.textContent = "0";
    const t0 = performance.now(), dur = 850, txt = el.dataset.fin || String(fin);
    const dec = txt.indexOf(",") > -1;
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      const v = fin * e;
      el.textContent = dec ? v.toFixed(1).replace(".", ",") : Math.round(v).toLocaleString("es-AR");
      if (k < 1) requestAnimationFrame(paso); else el.textContent = txt;
    };
    requestAnimationFrame(paso);
  }

  function animar(raiz) {
    const nodos = raiz.querySelectorAll(".ring-v, [data-n], .rise");
    if (quieto()) {
      nodos.forEach((el) => {
        if (el.dataset.n) el.textContent = el.dataset.fin || el.dataset.n;
        if (el.classList.contains("ring-v")) el.style.strokeDashoffset = el.dataset.off;
        el.classList.add("vis");
      });
      return;
    }
    if (!obs) {
      obs = new IntersectionObserver((ents) => {
        ents.forEach((en) => {
          if (!en.isIntersecting) return;
          const el = en.target;
          obs.unobserve(el);
          if (el.classList.contains("ring-v")) el.style.strokeDashoffset = el.dataset.off;
          else if (el.dataset.n) contar(el);
          el.classList.add("vis");
        });
      }, { threshold: 0.25 });
    }
    nodos.forEach((el, i) => {
      if (el.classList.contains("rise")) el.style.animationDelay = Math.min(i * 55, 400) + "ms";

    });

  /* Festejo: dos chorros de chispas */
  function festejo(fuerte) {
    if (quieto()) return;
    const cv = document.getElementById("rt-fx");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const w = cv.width = cv.offsetWidth, h = cv.height = cv.offsetHeight;
    const cols = ["#E9B75B", "#FF6F4E", "#4BD489", "#7C9CFF", "#F3EDE4"];
    const n = fuerte ? 150 : 70;
    const ps = [];
    for (let i = 0; i < n; i++) {
      const izq = i % 2 === 0;
      const ang = (izq ? -62 : -118) * Math.PI / 180 + (Math.random() - 0.5) * 0.85;
      const vel = 16 + Math.random() * 15;
      ps.push({
        x: izq ? w * 0.08 : w * 0.92, y: h * 0.96,
        vx: Math.cos(ang) * vel * (izq ? 1 : -1) * -1, vy: Math.sin(ang) * vel,
        s: 9 + Math.random() * 11, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4,
        c: cols[(Math.random() * cols.length) | 0], largo: 0.45 + Math.random() * 0.4
      });
    }
    cv.classList.add("on");
    const t0 = performance.now(), vida = 3200;
    const paso = (t) => {
      const k = (t - t0) / vida;
      ctx.clearRect(0, 0, w, h);
      let vivo = 0;
      ps.forEach((p) => {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.62; p.vx *= 0.992; p.r += p.vr;
        if (p.y < h + 60) vivo++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.max(0, Math.min(1, (1 - k) * 2.4));
        ctx.fillRect(-p.s / 2, -p.s * p.largo / 2, p.s, p.s * p.largo);
        ctx.restore();
      });
      if (vivo && k < 1) requestAnimationFrame(paso);
      else { ctx.clearRect(0, 0, w, h); cv.classList.remove("on"); }
    };
    requestAnimationFrame(paso);
  }

  const KEY_PEND = "rutina-cliente-pendiente";
  const b64u = (bytes) => { let s = ""; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const deb64u = (s) => { const t = atob(s.replace(/-/g, "+").replace(/_/g, "/")); const a = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) a[i] = t.charCodeAt(i); return a; };
  async function codificarRutina(dias) {
    const json = new TextEncoder().encode(JSON.stringify(dias));
    if (window.CompressionStream) {
      const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "z" + b64u(new Uint8Array(buf));
    }
    return "j" + b64u(json);
  }
  async function decodificarRutina(cod) {
    const bytes = deb64u(cod.slice(1));
    if (cod.charAt(0) === "z") {
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  /* "12.500", "12500", "1.234,50" y "12,5" son todos montos válidos */
  function numPlata(v) {
    let s = String(v || "").trim().replace(/[^\d.,]/g, "");
    if (!s) return null;
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* Lo que pasó con la plata entre dos fechas (incluidas) */
  function plataStats(desde, hasta) {
    const p = plataData();
    const r = { gasto: 0, fijos: 0, ingreso: 0, porCat: {}, aportes: 0, habPct: null, hayDatos: false, pres: p.pres.total || 0 };
    p.mov.forEach((m) => {
      if (m.d < desde || m.d > hasta) return;
      r.hayDatos = true;
      if (m.t === "i") r.ingreso += m.m;
      else { r.gasto += m.m; r.porCat[m.cat] = (r.porCat[m.cat] || 0) + m.m; if (m.cuenta) r.fijos += m.m; }
    });
    p.metas.forEach((mt) => (mt.aportes || []).forEach((a) => { if (a.d >= desde && a.d <= hasta) r.aportes += a.m; }));
    const hs = habitosPlata(p);
    const ini = Object.keys(p.habLog || {}).sort()[0];
    if (ini && hs.length) {
      const fin = hasta < todayKey() ? hasta : todayKey();
      const dias = diasEntre(desde > ini ? desde : ini, fin);
      if (dias.length) {
        let hechos = 0;
        dias.forEach((k) => { const l = p.habLog[k] || {}; hs.forEach((h) => { if (l[h.id]) hechos++; }); });
        r.habPct = hechos / (dias.length * hs.length);
        r.hayDatos = true;
      }
    }
    r.ahorro = r.ingreso - r.gasto;
    return r;
  }
  /* Puntaje de plata (0 a 1): hábitos de plata y, si hay presupuesto,
     qué tan adentro del presupuesto vas para esta altura del período */
  function puntajePlata(desde, hasta) {
    const s = plataStats(desde, hasta);
    if (!s.hayDatos) return null;
    const partes = [];
    if (s.habPct != null) partes.push(s.habPct);
    if (s.pres) {
      const fin = hasta < todayKey() ? hasta : todayKey();
      const dias = diasEntre(desde, fin).length;
      const tope = (s.pres / 30.4) * dias;
      const diario = s.gasto - s.fijos;   /* el presupuesto es para el día a día; las cuentas fijas van aparte */
      partes.push(diario <= tope ? 1 : Math.max(0, tope / diario));
    }
    if (!partes.length) return null;
    return partes.reduce((a, b) => a + b, 0) / partes.length;
  }
  function rachaPlata(p) {
    const hs = habitosPlata(p);
    if (!hs.length) return 0;
    let n = 0;
    for (let k = todayKey(), i = 0; i < 400; i++, k = masDias(k, -1)) {
      const l = (p.habLog || {})[k] || {};
      const hechos = hs.filter((h) => l[h.id]).length;
      if (hechos >= Math.ceil(hs.length * 0.66)) n++;
      else if (i > 0) break;
    }
    return n;
  }

  /* ───── Cuentas a pagar: fijas de todos los meses, en cuotas o de una vez ─────
     Se anotan una sola vez. Cada mes la app muestra qué vence, qué ya se
     pagó y cuánto queda libre después de pagar todo. */
  const ultimoDia = (ym) => { const q = ym.split("-").map(Number); return new Date(q[0], q[1], 0).getDate(); };
  const sumarMeses = (ym, n) => { const q = ym.split("-").map(Number); const f = new Date(q[0], q[1] - 1 + n, 1); return f.getFullYear() + "-" + pad2(f.getMonth() + 1); };
  const mesesEntre = (a, b) => { const x = a.split("-").map(Number), y = b.split("-").map(Number); return (y[0] - x[0]) * 12 + y[1] - x[1]; };
  const NOMBRES_CTA = ["Alquiler", "Expensas", "Luz", "Gas", "Agua", "Internet", "Celular", "Tarjeta", "Gimnasio", "Seguro"];
  function cuentasDelMes(p, ym) {
    const hoy = todayKey();
    return (p.cuentas || []).map((c) => {
      let vence = "", cuota = 0;
      if (c.tipo === "unica") {
        if (!c.fecha || c.fecha.slice(0, 7) !== ym) return null;
        vence = c.fecha;
      } else {
        const n = mesesEntre(c.desde, ym);
        if (n < 0) return null;
        if (c.tipo === "cuotas") { if (n >= c.total) return null; cuota = n + 1; }
        vence = ym + "-" + pad2(Math.min(c.dia || 1, ultimoDia(ym)));
      }
      const pago = (c.pagos || {})[ym] || null;
      return { c: c, vence: vence, cuota: cuota, pago: pago, m: pago ? pago.m : c.m || 0, dias: Math.round((fechaDe(vence) - fechaDe(hoy)) / 86400000) };
    }).filter(Boolean).sort((a, b) => (!!a.pago - !!b.pago) || (a.vence < b.vence ? -1 : a.vence > b.vence ? 1 : 0));
  }
  function pagarCuenta(id, ym, monto) {
    const p = plataData(), c = (p.cuentas || []).filter((x) => x.id === id)[0];
    if (!c) return;
    const m = monto || c.m;
    const este = todayKey().slice(0, 7);
    const d = ym === este ? todayKey() : ym < este ? mesRango(ym)[1] : ym + "-01";
    const mov = { id: uid(), d: d, t: "g", m: m, cat: c.cat || "casa", nota: c.n, cuenta: id };
    p.mov.push(mov);
    (c.pagos = c.pagos || {})[ym] = { m: m, d: d, mov: mov.id };
    plataGuardar(p);
  }
  function despagarCuenta(id, ym) {
    const p = plataData(), c = (p.cuentas || []).filter((x) => x.id === id)[0];
    if (!c || !c.pagos || !c.pagos[ym]) return;
    p.mov = p.mov.filter((m) => m.id !== c.pagos[ym].mov);
    delete c.pagos[ym];
    plataGuardar(p);
  }
  const venceTxt = (x) => x.pago ? "Pagada el " + fmtDay(x.pago.d)
    : x.dias < -1 ? "Venció hace " + -x.dias + " días" : x.dias === -1 ? "Venció ayer" : x.dias === 0 ? "Vence hoy" : x.dias === 1 ? "Vence mañana" : "Vence el " + fmtDay(x.vence);
  const estadoCta = (x) => (x.pago ? "ok" : x.dias < 0 ? "venc" : x.dias <= 3 ? "pronto" : "pend");

  let plataCtaForm = false, plataCtaEdit = false, ctaTipo = "fija";
  function cardCuentas(p, ym) {
    const cs = cuentasDelMes(p, ym);
    const falta = cs.filter((x) => !x.pago), pagado = cs.filter((x) => x.pago);
    const sum = (l) => l.reduce((a, x) => a + x.m, 0);
    let h = '<section class="card rise cuentas" style="--c:' + (falta.some((x) => x.dias < 0) ? "#FF6F4E" : "#FF8F5E") + '"><p class="card-k">Cuentas del mes</p>';
    if (cs.length) {
      h += '<p class="card-t">' + (falta.length ? "Te falta pagar " + money(sum(falta)) : "Todo pagado ✓") + "</p>" +
        '<p class="hero-s">' + (pagado.length ? "Pagaste " + money(sum(pagado)) + " de " + money(sum(cs)) : falta.length + (falta.length === 1 ? " cuenta" : " cuentas") + " este mes") + "</p>" +
        '<ul class="ct-l">' + cs.map((x) => '<li class="' + estadoCta(x) + '"><i class="ct-e"></i><span class="ct-x"><b>' + esc(x.c.n) + "</b><small>" +
          (x.cuota ? "Cuota " + x.cuota + " de " + x.c.total + " · " : "") + venceTxt(x) + "</small></span>" +
          "<b class=\"ct-m\">" + (x.m ? money(x.m) : "—") + "</b>" +
          (plataCtaEdit ? '<button type="button" class="btn dng" data-pa="cta-del" data-id="' + x.c.id + '" aria-label="Borrar">' + XIC + "</button>"
            : x.pago ? '<button type="button" class="btn sm alt ct-b" data-pa="cta-no" data-id="' + x.c.id + '" aria-label="Marcar como no pagada">' + CHECK + "</button>"
            : '<button type="button" class="btn sm pri ct-b" data-pa="cta-pagar" data-id="' + x.c.id + '">Pagar</button>') + "</li>").join("") + "</ul>";
    } else {
      h += '<p class="card-t">Tus cuentas fijas</p><p class="card-s">Alquiler, luz, internet, la tarjeta, las cuotas: anotalas una vez y cada mes ves qué vence, qué pagaste y cuánto te queda libre.</p>';
    }
    if (plataCtaForm) {
      const tipos = [["fija", "Todos los meses"], ["cuotas", "En cuotas"], ["unica", "Una sola vez"]];
      h += '<div class="ct-form"><div class="seg">' + tipos.map((t) => '<button type="button" data-pa="cta-tipo" data-t="' + t[0] + '" aria-pressed="' + (ctaTipo === t[0]) + '">' + t[1] + "</button>").join("") + "</div>" +
        '<div class="pl-chips">' + NOMBRES_CTA.map((n) => '<button type="button" class="chip" style="--k:#FF8F5E" data-pa="cta-nom" data-nom="' + n + '">' + n + "</button>").join("") + "</div>" +
        '<div class="two"><label class="fld"><span class="fl">Nombre</span><input class="in" id="ct-n" maxlength="30" placeholder="ej. Alquiler"></label>' +
        '<label class="fld"><span class="fl">' + (ctaTipo === "cuotas" ? "Valor de la cuota" : "Monto") + '</span><input class="in" id="ct-m" inputmode="decimal" placeholder="' + (ctaTipo === "fija" ? "si cambia, dejalo vacío" : "ej. 25.000") + '"></label></div>' +
        (ctaTipo === "unica"
          ? '<label class="fld"><span class="fl">Vence el</span><input class="in" id="ct-f" type="date" value="' + todayKey() + '"></label>'
          : '<div class="two"><label class="fld"><span class="fl">Vence el día</span><input class="in" id="ct-d" inputmode="numeric" placeholder="10"></label>' +
            (ctaTipo === "cuotas" ? '<label class="fld"><span class="fl">Cuotas (total)</span><input class="in" id="ct-t" inputmode="numeric" placeholder="12"></label></div>' +
              '<label class="fld"><span class="fl">¿Cuántas ya pagaste antes de este mes?</span><input class="in" id="ct-p" inputmode="numeric" placeholder="0"></label>' : "</div>")) +
        '<div class="pan-b"><button type="button" class="btn pri" data-pa="cta-ok">Guardar cuenta</button> <button type="button" class="btn alt" data-pa="cta-x">Cancelar</button></div><p class="arr-n" id="ct-nota"></p></div>';
    } else {
      h += '<div class="pan-b"><button type="button" class="btn alt" data-pa="cta-form">+ Agregar cuenta</button>' +
        (cs.length ? ' <button type="button" class="btn lnk" data-pa="cta-edit">' + (plataCtaEdit ? "Listo" : "Editar") + "</button>" : "") + "</div>";
    }
    return h + "</section>";
  }

  let plataMes = todayKey().slice(0, 7);
  let plataPresEdit = false, plataVerTodo = false, plataHabEdit = false;
  const plataAbre = {};
  const mesRango = (ym) => {
    const p = ym.split("-").map(Number);
    const ult = new Date(p[0], p[1], 0).getDate();
    return [ym + "-01", ym + "-" + pad2(ult)];
  };
  const nombreMes = (ym) => { const p = ym.split("-").map(Number); return MESES[p[1] - 1] + " " + p[0]; };

  function renderPlata() {
    if (!PLATA_BODY) return;
    const p = plataData();
    const [desde, hasta] = mesRango(plataMes);
    const s = plataStats(desde, hasta);
    const esEste = plataMes === todayKey().slice(0, 7);
    let h = '<header class="hoy-h"><p class="hoy-k">Gastos, cuentas y ahorro</p><h1 class="hoy-t">Tus <em>finanzas</em></h1>' +
      '<div class="mes-nav"><button type="button" class="ib" data-pa="mes" data-d="-1" aria-label="Mes anterior">‹</button>' +
      "<span>" + nombreMes(plataMes) + "</span>" +
      '<button type="button" class="ib" data-pa="mes" data-d="1" aria-label="Mes siguiente"' + (esEste ? " disabled" : "") + ">›</button></div></header>";

    /* Cuánto te queda libre: lo que entró, menos lo gastado, menos lo que falta pagar */
    const cs = cuentasDelMes(p, plataMes);
    const porPagar = cs.filter((x) => !x.pago).reduce((a, x) => a + x.m, 0);
    const libre = s.ingreso - s.gasto - porPagar;
    const diario = s.gasto - s.fijos;
    const pres = p.pres.total || 0;
    let bajada = "";
    if (pres && esEste) {
      const queda = pres - diario;
      const diasRest = Number(hasta.slice(8)) - new Date().getDate() + 1;
      bajada = queda >= 0 ? "Te quedan " + money(queda) + ": " + money(queda / diasRest) + " por día." : "Te pasaste " + money(-queda) + ". Desde hoy, solo lo necesario.";
    } else if (pres) {
      bajada = diario <= pres ? "Cerraste adentro del presupuesto." : "Te pasaste " + money(diario - pres) + ".";
    }
    const pctP = pres ? Math.min(100, Math.round((diario / pres) * 100)) : 0;
    h += '<section class="card rise hero pl-hero" style="--c:' + (s.ingreso && libre < 0 ? "#FF6F4E" : "#4BD489") + '"><p class="card-k">' + (esEste ? "Este mes" : nombreMes(plataMes)) + "</p>" +
      (s.ingreso
        ? '<p class="card-t pl-libre ' + (libre >= 0 ? "ok" : "mal") + '">' + money(libre) + '</p><p class="hero-s">' + (libre >= 0 ? "te queda libre" : "te falta") + (porPagar ? " después de pagar lo pendiente" : "") + "</p>"
        : '<p class="card-t">' + money(s.gasto) + '</p><p class="hero-s">gastado</p><p class="card-s">Anotá lo que te entra (sueldo, ventas, changas) y te digo cuánto te queda libre.</p>') +
      '<div class="pl-tri"><div><span>Entró</span><b class="ok">' + money(s.ingreso) + "</b></div><div><span>Gastado</span><b>" + money(s.gasto) + "</b></div>" +
      '<div><span>Por pagar</span><b class="' + (porPagar ? "mal" : "") + '">' + money(porPagar) + "</b></div></div>" +
      (pres ? '<div class="pl-pres"><div class="pl-ph"><span>Día a día</span><b>' + money(diario) + " de " + money(pres) + '</b></div><div class="pl-mb"><i style="width:' + pctP + "%" + (diario > pres ? ";background:#FF6F4E" : "") + '"></i></div>' +
        (bajada ? "<p>" + bajada + "</p>" : "") + "</div>" : "") +
      '<div class="pl-acc"><button type="button" class="btn pri" style="--c:#FF6F4E" data-pa="sh" data-t="g">− Gasto</button><button type="button" class="btn pri" style="--c:#4BD489" data-pa="sh" data-t="i">+ Ingreso</button></div>' +
      '<div class="pan-b"><button type="button" class="btn lnk" data-pa="pres">' + (pres ? "Cambiar presupuesto" : "Poner un presupuesto para el día a día") + "</button></div></section>";

    h += cardCuentas(p, plataMes);

    if (plataPresEdit) {
      h += '<section class="card rise" style="--c:#E9B75B"><p class="card-k">Presupuesto mensual</p><p class="card-t">¿Cuánto querés gastar por mes?</p>' +
        '<label class="fld"><span class="fl">Total del mes</span><input class="in pl-in" id="pl-pres" inputmode="decimal" placeholder="ej. 400.000" value="' + (pres || "") + '"></label>' +
        '<p class="card-s">Si querés, ponele un tope a cada categoría (si no, dejalas vacías).</p><div class="pl-cats-g">' +
        CATS.map((c) => '<label class="fld"><span class="fl"><i class="pl-dot" style="--k:' + c[2] + '"></i>' + c[1] + '</span><input class="in" data-pc="' + c[0] + '" inputmode="decimal" value="' + (p.pres.cats[c[0]] || "") + '"></label>').join("") +
        '</div><div class="pan-b"><button type="button" class="btn pri" data-pa="pres-ok">Guardar</button> <button type="button" class="btn alt" data-pa="pres-x">Cancelar</button></div></section>';
    }

    /* Lo de abajo va plegado: una línea con lo importante, se abre con un toque */
    const plegado = (id, color, titulo, resumen, cuerpo) => {
      const ab = !!plataAbre[id];
      return '<section class="card rise acc' + (ab ? " abierta" : "") + '" style="--c:' + color + '"><button type="button" class="acc-h" data-pa="acc" data-id="' + id + '" aria-expanded="' + ab + '">' +
        '<span class="acc-x"><span class="card-k">' + titulo + "</span><b>" + resumen + '</b></span><i class="acc-f" aria-hidden="true">›</i></button>' +
        (ab ? '<div class="acc-b">' + cuerpo + "</div>" : "") + "</section>";
    };

    /* En qué se fue: las 4 categorías más grandes, el resto con un toque */
    const cats = Object.keys(s.porCat).sort((a, b) => s.porCat[b] - s.porCat[a]);
    if (cats.length) {
      const tope = Math.max.apply(null, cats.map((c) => Math.max(s.porCat[c], p.pres.cats[c] || 0)));
      const verCats = plataAbre.cats ? cats : cats.slice(0, 4);
      h += '<section class="card rise" style="--c:#C98BFF"><p class="card-k">En qué se fue</p><ul class="pl-bars">' + verCats.map((c) => {
        const k = catDe(c), v = s.porCat[c], lim = p.pres.cats[c] || 0;
        return '<li style="--k:' + k[2] + '"><span class="pl-bn"><i class="pl-dot"></i>' + k[1] + "</span><b>" + money(v) +
          (lim ? "<small> / " + money(lim) + "</small>" : "") + '</b><span class="pl-bt"><i class="' + (lim && v > lim ? "pasado" : "") + '" style="width:' + Math.max(3, Math.round((v / tope) * 100)) + '%"></i>' +
          (lim ? '<u style="left:' + Math.round((lim / tope) * 100) + '%"></u>' : "") + "</span></li>";
      }).join("") + "</ul>" +
        (cats.length > 4 ? '<button type="button" class="btn lnk" data-pa="acc" data-id="cats">' + (plataAbre.cats ? "Ver menos" : "Ver las " + cats.length + " categorías") + "</button>" : "") + "</section>";
    }

    /* Ahorro */
    let ah = "";
    p.metas.forEach((mt) => {
      const junto = (mt.aportes || []).reduce((a, x) => a + x.m, 0);
      const pc = mt.obj ? Math.min(100, Math.round((junto / mt.obj) * 100)) : 0;
      ah += '<div class="pl-meta' + (pc >= 100 ? " lista" : "") + '"><div class="pl-mh"><b>' + esc(mt.n) + "</b><span>" + money(junto) + " de " + money(mt.obj) + "</span></div>" +
        '<div class="pl-mb"><i style="width:' + pc + '%"></i></div>' +
        '<div class="pl-ma"><input class="in" data-ap="' + mt.id + '" inputmode="decimal" placeholder="Sumar $"><button type="button" class="btn alt sm" data-pa="aportar" data-id="' + mt.id + '">+ Sumar</button>' +
        '<button type="button" class="btn dng" data-pa="meta-del" data-id="' + mt.id + '" aria-label="Borrar meta">' + XIC + "</button></div></div>";
    });
    ah += (p.metas.length ? "" : '<p class="card-s">Una meta con nombre (un viaje, el fondo de emergencia, la moto) se cumple más que "ahorrar".</p>') +
      '<div class="two"><label class="fld"><span class="fl">Nueva meta</span><input class="in" id="pl-mn" maxlength="30" placeholder="ej. Vacaciones"></label>' +
      '<label class="fld"><span class="fl">¿Cuánto?</span><input class="in" id="pl-mo" inputmode="decimal" placeholder="ej. 500.000"></label></div>' +
      '<div class="pan-b"><button type="button" class="btn alt" data-pa="meta-add">Crear meta</button></div>';
    const meta1 = p.metas[0];
    const junto1 = meta1 ? (meta1.aportes || []).reduce((a, x) => a + x.m, 0) : 0;
    h += plegado("ahorro", "#7C9CFF", "Ahorro", meta1 ? esc(meta1.n) + " · " + (meta1.obj ? Math.min(100, Math.round((junto1 / meta1.obj) * 100)) : 0) + "%" + (p.metas.length > 1 ? " y " + (p.metas.length - 1) + " más" : "") : "Creá una meta", ah);

    /* Movimientos */
    const movs = p.mov.filter((m) => m.d >= desde && m.d <= hasta).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
    if (movs.length) {
      const ver = plataVerTodo ? movs.length : 10;
      const mv = '<ul class="pl-mov">' + movs.slice(0, ver).map((m) => {
        const k = catDe(m.cat);
        return '<li style="--k:' + (m.t === "i" ? "#4BD489" : k[2]) + '"><i class="pl-dot"></i><span class="pl-mt">' + esc(m.nota || (m.t === "i" ? "Ingreso" : k[1])) +
          "<small>" + fmtDay(m.d) + (m.nota && m.t !== "i" ? " · " + k[1] : "") + "</small></span><b class=\"" + (m.t === "i" ? "ok" : "") + '">' + (m.t === "i" ? "+" : "−") + money(m.m) +
          '</b><button type="button" class="btn dng" data-pa="del" data-id="' + m.id + '" aria-label="Borrar">' + XIC + "</button></li>";
      }).join("") + "</ul>" +
        (movs.length > 10 ? '<button type="button" class="btn alt" data-pa="vertodo">' + (plataVerTodo ? "Ver menos" : "Ver los " + movs.length) + "</button>" : "");
      h += plegado("movs", "#9C8AB8", "Movimientos", movs.length + (movs.length === 1 ? " este mes" : " este mes") + " · último: " + esc(movs[0].nota || (movs[0].t === "i" ? "Ingreso" : catDe(movs[0].cat)[1])), mv);
    }

    /* Hábitos de plata */
    if (esEste) {
      const hs = habitosPlata(p), hoyL = (p.habLog || {})[todayKey()] || {};
      const racha = rachaPlata(p);
      const hb = (racha > 1 ? '<p class="racha"><span class="llama">▲</span> ' + racha + " días seguidos</p>" : "") +
        '<ul class="pl-hab">' + hs.map((x) => '<li><button type="button" class="pl-hb' + (hoyL[x.id] ? " si" : "") + '" data-pa="hab" data-h="' + esc(x.id) + '" aria-pressed="' + !!hoyL[x.id] + '">' +
          '<span class="pl-ck">' + CHECK + "</span><span>" + esc(x.n) + "</span></button>" +
          (plataHabEdit ? '<button type="button" class="btn dng" data-pa="hab-del" data-h="' + esc(x.id) + '" aria-label="Sacar">' + XIC + "</button>" : "") + "</li>").join("") + "</ul>" +
        (plataHabEdit ? '<div class="two"><label class="fld"><span class="fl">Nuevo hábito</span><input class="in" id="pl-hn" maxlength="40" placeholder="ej. Cociné en casa"></label>' +

        '<div class="pan-b"><button type="button" class="btn lnk" data-pa="hab-edit">' + (plataHabEdit ? "Listo" : "Cambiar mis hábitos") + "</button></div>";
      h += plegado("habs", "#4BD489", "Hábitos de plata", hs.filter((x) => hoyL[x.id]).length + " de " + hs.length + " hoy" + (racha > 1 ? " · " + racha + " días seguidos" : ""), hb);
    }

    /* El año */
    const anio = plataMes.slice(0, 4);
    const meses = [];
    for (let i = 1; i <= 12; i++) { const r = mesRango(anio + "-" + pad2(i)); meses.push(plataStats(r[0], r[1])); }
    const tope = Math.max.apply(null, [1].concat(meses.map((m) => Math.max(m.gasto, m.ingreso))));
    const totG = meses.reduce((a, m) => a + m.gasto, 0), totI = meses.reduce((a, m) => a + m.ingreso, 0);
    if (totG || totI) {
      const an = '<div class="pl-tri"><div><span>Entró</span><b class="ok">' + money(totI) + "</b></div><div><span>Salió</span><b>" + money(totG) + "</b></div>" +
        '<div><span>Te quedó</span><b class="' + (totI - totG >= 0 ? "ok" : "mal") + '">' + money(totI - totG) + "</b></div></div>" +
        '<div class="pl-anio">' + meses.map((m, i) => '<button type="button" class="pl-am' + (anio + "-" + pad2(i + 1) === plataMes ? " on" : "") + '" data-pa="ir-mes" data-m="' + anio + "-" + pad2(i + 1) + '">' +
          '<span class="pl-ab"><i class="ent" style="height:' + Math.round((m.ingreso / tope) * 100) + '%"></i><i class="sal" style="height:' + Math.round((m.gasto / tope) * 100) + '%"></i></span>' + MESES_C[i].slice(0, 1).toUpperCase() + "</button>").join("") +
        '</div><p class="pl-ley"><i class="ent"></i> entró <i class="sal"></i> salió · tocá un mes para verlo</p>';

  }

  /* ═══════════ Resumen: semana, mes y año de los cuatro pilares ═══════════ */
  const RES_BODY = document.getElementById("resumen-body");
  let resModo = "semana", resOff = 0;
  const PILARES = {
    entreno: { n: "Entreno", c: "#E9B75B" },
    habitos: { n: "Hábitos", c: "#A98BFF" },
    nutri: { n: "Nutrición", c: "#4BD489" },
    plata: { n: "Finanzas", c: "#5FD6E0" },
    racha: { n: "Racha", c: "#FF6F4E" },
  };

  function rangoRes(modo, off) {
    const t = new Date();
    if (modo === "semana") {
      const desde = masDias(weekStart(), -7 * off);
      const hasta = masDias(desde, 6);
      const a = fechaDe(desde), b = fechaDe(hasta);
      const nom = a.getMonth() === b.getMonth()
        ? a.getDate() + " al " + b.getDate() + " de " + MESES[b.getMonth()]
        : a.getDate() + " de " + MESES_C[a.getMonth()] + " al " + b.getDate() + " de " + MESES_C[b.getMonth()];
      return { desde: desde, hasta: hasta, nom: nom, quien: off === 0 ? "esta semana" : off === 1 ? "la semana pasada" : "esa semana", ant: "la semana anterior" };
    }
    if (modo === "mes") {
      const f = new Date(t.getFullYear(), t.getMonth() - off, 1);
      const r = mesRango(f.getFullYear() + "-" + pad2(f.getMonth() + 1));
      return { desde: r[0], hasta: r[1], nom: MESES[f.getMonth()] + " " + f.getFullYear(), quien: off === 0 ? "este mes" : "ese mes", ant: "el mes anterior" };
    }
    const y = t.getFullYear() - off;
    return { desde: y + "-01-01", hasta: y + "-12-31", nom: String(y), quien: off === 0 ? "este año" : "ese año", ant: "el año anterior" };
  }
  /* Los cortes de la barra: días en la semana y el mes, meses en el año */
  function cortesRes(modo, r) {
    if (modo === "anio") {
      const y = r.desde.slice(0, 4);
      return MESES_C.map((m, i) => { const q = mesRango(y + "-" + pad2(i + 1)); return { desde: q[0], hasta: q[1], et: m.slice(0, 1).toUpperCase() }; });
    }
    return diasEntre(r.desde, r.hasta).map((k, i) => ({
      desde: k, hasta: k,
      et: modo === "semana" ? DIAS_C[fechaDe(k).getDay()] : (i === 0 || (i + 1) % 5 === 0 ? String(i + 1) : ""),
    }));
  }

  function entrenoPorDia() {
    const dias = {};
    state.days.forEach((d) => flat(d).forEach((it) => (it.hist || []).forEach((s) => {
      if (!s.d) return;
      const hechas = s.sets.filter(hasVal);
      if (!hechas.length) return;
      const e = dias[s.d] || (dias[s.d] = { kg: 0, series: 0 });
      e.kg += volumen(hechas);
      e.series += hechas.length;
    })));
    return dias;
  }

  function statsRes(desde, hasta, ctx) {
    const hoy = todayKey();
    const fin = hasta < hoy ? hasta : hoy;
    const corridos = desde > hoy ? [] : diasEntre(desde, fin);
    const o = { entreno: null, habitos: null, nutri: null, plata: null };

    /* Entreno: días, kilos y series. El objetivo son los días de la rutina por semana */
    let dias = 0, kg = 0, series = 0;
    Object.keys(ctx.ent).forEach((k) => { if (k >= desde && k <= hasta) { dias++; kg += ctx.ent[k].kg; series += ctx.ent[k].series; } });
    if (ctx.hayEnt) {
      /* lo esperado se cuenta desde que empezó a usar la app, no desde enero */
      const desdeUso = corridos.filter((k) => !ctx.inicio || k >= ctx.inicio);
      const porSemana = state.days.filter((d) => d.kind === "train").length || 3;
      const espera = Math.max(1, Math.round((porSemana * desdeUso.length) / 7));
      o.entreno = { dias: dias, kg: kg, series: series, score: desdeUso.length ? Math.min(1, dias / espera) : 0, espera: espera };
    }

    /* Hábitos del Sistema: promedio de cumplimiento de los días con misiones */
    if (ctx.sis) {
      const ini = Object.keys(ctx.sis.log || {}).sort()[0];
      if (ini) {
        let suma = 0, n = 0, buenos = 0;
        corridos.forEach((k) => {
          if (k < ini) return;
          const r = pctDia(ctx.sis, k);
          if (!r.n) return;
          n++; suma += r.pct; if (r.pct >= 0.8) buenos++;
        });
        if (n) o.habitos = { pct: suma / n, buenos: buenos, dias: n, score: suma / n };
      }
    }

    /* Nutrición: días que llegó a la proteína, y cómo se movió el peso */
    const nc = nutriCfg();
    const pl = pesos().filter((x) => x.d >= desde && x.d <= hasta);
    if (nc) {
      const m = metas(nc), l = protLog();
      const ini = Object.keys(l).sort()[0];
      const cuenta = corridos.filter((k) => ini && k >= ini);
      const ok = cuenta.filter((k) => (l[k] || 0) >= m.prot).length;
      o.nutri = { ok: ok, dias: cuenta.length, score: cuenta.length ? ok / cuenta.length : null };
    }
    if (pl.length) {
      o.nutri = o.nutri || { ok: 0, dias: 0, score: null };
      o.nutri.peso = pl[pl.length - 1].kg;
      o.nutri.dif = pl.length > 1 ? pl[pl.length - 1].kg - pl[0].kg : 0;
    }

    const ps = plataStats(desde, hasta);
    if (ps.hayDatos && finOn()) o.plata = Object.assign(ps, { score: puntajePlata(desde, hasta) });

    const sc = ["entreno", "habitos", "nutri", "plata"].map((k) => o[k] && o[k].score).filter((v) => v != null);
    o.puntaje = sc.length ? Math.round((sc.reduce((a, b) => a + b, 0) / sc.length) * 100) : null;
    return o;
  }
  function ctxRes() {
    const ent = entrenoPorDia();
    const sis = sistemaData(), p = plataData();
    /* el primer día con algo anotado, en cualquier pilar */
    const primeros = [Object.keys(ent).sort()[0], sis && Object.keys(sis.log || {}).sort()[0], Object.keys(protLog()).sort()[0],
      (pesos()[0] || {}).d, p.inicio, p.mov.map((m) => m.d).sort()[0]].filter(Boolean).sort();
    return { ent: ent, hayEnt: Object.keys(ent).length > 0, sis: sis, inicio: primeros[0] || todayKey() };
  }

  /* Barras simples: una por corte */
  function barrasRes(vals, cortes, color) {
    const tope = Math.max.apply(null, [0.0001].concat(vals));
    return '<div class="rb' + (cortes.length > 12 ? " fino" : "") + '" style="--k:' + color + '">' + vals.map((v, i) =>
      '<span><i style="--h:' + (v ? Math.max(6, Math.round((v / tope) * 100)) : 3) + '%"' + (v ? ' class="si"' : "") + "></i><em>" + cortes[i].et + "</em></span>").join("") + "</div>";
  }
  function compara(a, b, txt, ant, inverso) {
    if (a == null || b == null) return "";
    const d = a - b;
    if (!d) return '<p class="rc">Igual que ' + ant + "</p>";
    const bien = inverso ? d < 0 : d > 0;
    return '<p class="rc ' + (bien ? "up" : "down") + '">' + (d > 0 ? "▲ " : "▼ ") + txt(Math.abs(d)) + (d > 0 ? " más" : " menos") + " que " + ant + "</p>";
  }

  function resumenDatos() {
    const r = rangoRes(resModo, resOff);
    const ctx = ctxRes();
    const s = statsRes(r.desde, r.hasta, ctx);
    const ra = rangoRes(resModo, resOff + 1);
    /* antes de que empezara no hay con qué comparar */
    const sa = ra.hasta < ctx.inicio ? { entreno: null, habitos: null, nutri: null, plata: null, puntaje: null } : statsRes(ra.desde, ra.hasta, ctx);
    return { r: r, s: s, sa: sa, ctx: ctx, recs: recordsEntre(r.desde, r.hasta) };
  }

  const prom = (l) => (l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0);
  const pc = (v) => Math.round(v * 100);

  /* Lo que dicen tus datos: patrones que uno solo no ve */
  function datosDicen(D) {
    const r = D.r, s = D.s, out = [];
    const dias = r.desde > todayKey() ? [] : diasEntre(r.desde, r.hasta < todayKey() ? r.hasta : todayKey());
    const ent = D.ctx.ent;
    if (D.ctx.sis) {
      const con = [], sin = [];
      dias.forEach((k) => { const q = pctDia(D.ctx.sis, k); if (!q.n) return; (ent[k] ? con : sin).push(q.pct); });
      if (con.length >= 2 && sin.length >= 2) {
        const d = pc(prom(con) - prom(sin));
        if (d >= 10) out.push("Los días que entrenás cumplís un " + d + "% más de tus misiones. Entrenar ordena todo lo demás.");
        else if (d <= -10) out.push("Los días que entrenás se te caen las misiones (" + -d + "% menos). Dejá las más cortas para esos días.");
      }
    }
    const nc = nutriCfg();
    if (nc) {
      const l = protLog(), m = metas(nc).prot, fin = [], sem = [];
      const ini = Object.keys(l).sort()[0];
      dias.forEach((k) => { if (!ini || k < ini) return; const w = fechaDe(k).getDay(); (w === 0 || w === 6 ? fin : sem).push((l[k] || 0) >= m ? 1 : 0); });
      if (fin.length >= 2 && sem.length >= 3 && prom(sem) - prom(fin) >= 0.25) {
        out.push("La proteína se te cae el finde: la cumplís el " + pc(prom(fin)) + "% de esos días contra el " + pc(prom(sem)) + "% en la semana. Dejá algo listo el viernes.");
      }
    }
    if (s.plata && s.plata.gasto) {
      const cats = Object.keys(s.plata.porCat).sort((a, b) => s.plata.porCat[b] - s.plata.porCat[a]);
      const parte = cats.length > 1 ? s.plata.porCat[cats[0]] / s.plata.gasto : 0;
      if (parte >= 0.3) out.push("El " + pc(parte) + "% de lo que gastaste se fue en " + catDe(cats[0])[1].toLowerCase() + ". Si lo bajás un poco, ahí está tu ahorro.");
      if (resModo !== "semana") {
        const porDia = [0, 0, 0, 0, 0, 0, 0], cuenta = [0, 0, 0, 0, 0, 0, 0];
        const p = plataData();
        dias.forEach((k) => { cuenta[fechaDe(k).getDay()]++; });
        p.mov.forEach((m) => { if (m.t === "g" && m.d >= r.desde && m.d <= r.hasta) porDia[fechaDe(m.d).getDay()] += m.m; });
        const medias = porDia.map((v, i) => (cuenta[i] ? v / cuenta[i] : 0));
        const media = prom(medias.filter((v, i) => cuenta[i]));
        const top = medias.indexOf(Math.max.apply(null, medias));
        if (media && medias[top] / media >= 1.5) out.push("Los " + DIAS_L[top] + (top === 0 || top === 6 ? "s" : "") + " gastás " + fmtNum(medias[top] / media) + " veces más que un día normal.");
      }
    }
    if (s.entreno && D.sa.entreno && D.sa.entreno.kg && s.entreno.kg && r.hasta <= todayKey()) {
      const d = s.entreno.kg / D.sa.entreno.kg - 1;
      if (d >= 0.1) out.push("Moviste un " + pc(d) + "% más de kilos que " + r.ant + ". Eso es progreso de verdad.");
      else if (d <= -0.15) out.push("Moviste un " + pc(-d) + "% menos de kilos que " + r.ant + ". Fijate si faltaron sesiones o bajaste los pesos.");
    }
    if (s.nutri && s.nutri.dif && nc && nc.obj !== "mantener") {
      const bien = nc.obj === "musculo" ? s.nutri.dif > 0 : s.nutri.dif < 0;
      out.push(bien ? (s.nutri.dif > 0 ? "Subiste " : "Bajaste ") + fmtNum(Math.abs(s.nutri.dif)) + " kg: vas en la dirección de tu objetivo."
        : "El peso va al revés de tu objetivo (" + (s.nutri.dif > 0 ? "+" : "−") + fmtNum(Math.abs(s.nutri.dif)) + " kg). Revisalo con " + MARCA.split(" ")[0] + ".");
    }
    if (D.recs.length) out.push(D.recs.length === 1 ? "Rompiste tu récord en " + D.recs[0].n + "." : "Rompiste " + D.recs.length + " récords. La fuerza está subiendo.");
    return out.slice(0, 4);
  }

  /* Un solo objetivo para lo que viene: el pilar más flojo */
  function objetivo(D) {
    const s = D.s;
    const l = ["entreno", "habitos", "nutri", "plata"].filter((k) => s[k] && s[k].score != null).sort((a, b) => s[a].score - s[b].score);
    if (!l.length) return null;
    const k = l[0];
    if (s[k].score >= 0.9) return { k: k, t: "Mantené todo como está", s: "Vas arriba del 90% en todos los pilares. El objetivo es no aflojar." };
    const porSemana = state.days.filter((d) => d.kind === "train").length || 3;
    const tips = {
      entreno: ["Entrená " + porSemana + " días", "Agendá la hora como si fuera un turno médico. Si un día no podés, hacé 20 minutos: cuenta igual."],
      habitos: ["Hábitos al 80%, 5 días", "Empezá cada día por el hábito más fácil. Lo que se hace primero, se hace."],
      nutri: ["Proteína cumplida 5 de 7 días", "Sumá una fuente en cada comida: huevos al desayuno, un yogur proteico en la merienda."],
      plata: ["Anotá cada gasto el mismo día", "Y marcá \"cero gastos hormiga\" al menos 4 días. Lo que se anota, se controla."],
    };
    return { k: k, t: tips[k][0], s: tips[k][1] };
  }

  function renderResumen() {
    if (!RES_BODY) return;
    const D = resumenDatos(), r = D.r, s = D.s, sa = D.sa;
    const cortes = cortesRes(resModo, r);
    const modoTxt = { semana: "Semana", mes: "Mes", anio: "Año" };
    const rg = rango(s.puntaje);
    let h = '<header class="hoy-h"><button type="button" class="btn lnk res-volver" data-rs="volver">‹ Volver</button>' +
      '<p class="hoy-k">Tu resumen</p><h1 class="hoy-t">' + esc(r.nom.charAt(0).toUpperCase() + r.nom.slice(1)) + "</h1></header>" +
      '<div class="seg res-seg">' + ["semana", "mes", "anio"].map((m) =>
        '<button type="button" data-rs="modo" data-m="' + m + '" aria-pressed="' + (resModo === m) + '">' + modoTxt[m] + "</button>").join("") + "</div>" +
      '<div class="mes-nav res-nav"><button type="button" class="ib" data-rs="off" data-d="1" aria-label="Anterior">‹</button><span>' + esc(r.quien) + "</span>" +
      '<button type="button" class="ib" data-rs="off" data-d="-1" aria-label="Siguiente"' + (resOff === 0 ? " disabled" : "") + ">›</button></div>";

    /* Puntaje general, rango y los cuatro pilares */
    const mini = ["entreno", "habitos", "nutri"].concat(finOn() ? ["plata"] : []).map((k) => {
      const v = s[k] && s[k].score != null ? pc(s[k].score) : null;
      return '<div class="pil" style="--c:' + PILARES[k].c + '">' + anillo(v || 0, v == null ? "—" : '<i data-n="' + v + '" data-fin="' + v + '">' + v + "</i>", "", 62) + "<span>" + PILARES[k].n + "</span></div>";
    }).join("");
    h += '<section class="card rise hero res-hero" style="--c:' + (s.puntaje == null ? "#E9B75B" : rg.c) + '"><p class="card-k">Puntaje general</p>' +
      '<div class="hero-g">' + anillo(s.puntaje || 0, s.puntaje == null ? "—" : '<i data-n="' + s.puntaje + '" data-fin="' + s.puntaje + '">' + s.puntaje + "</i>", "de 100", 124) +
      '<div class="hero-x">' + (s.puntaje == null ? '<p class="card-t">Sin datos todavía</p>' : '<p class="rango">Rango</p><p class="card-t rango-n">' + rg.n + "</p>") +
      compara(s.puntaje, sa.puntaje, (d) => d + (d === 1 ? " punto" : " puntos"), r.ant) + "</div></div>" +
      '<div class="pils">' + mini + "</div>" +
      '<ol class="rangos">' + RANGOS.slice().reverse().map((x) => '<li style="--k:' + x[2] + '" class="' + (s.puntaje != null && x[1] === rg.n ? "on" : "") + '">' + x[1] + "</li>").join("") + "</ol></section>";

    /* Compartir: historia y reto */
    if (s.puntaje != null) {
      h += '<section class="card rise reto" style="--c:#FF6F4E"><p class="card-k">Compartí</p><p class="card-t">¿Quién te sigue el ritmo?</p>' +
        '<p class="card-s">Subí tu ' + ({ semana: "semana", mes: "mes", anio: "año" }[resModo]) + ' a una historia o retá a un amigo a superarte. La imagen no muestra montos de plata.</p>' +
        '<div class="res-acc"><button type="button" class="btn pri" data-rs="historia">Para historias</button>' +
        '<button type="button" class="btn alt" data-rs="reto">Retar a un amigo</button></div><p class="pan-n" id="res-n"></p></section>';
    }

    /* Lo que dicen tus datos y el objetivo */
    const dd = datosDicen(D), ob = objetivo(D);
    if (dd.length || ob) {
      h += '<section class="card rise insights" style="--c:#A98BFF"><p class="card-k">Lo que dicen tus datos</p>' +
        (dd.length ? '<ul class="ins">' + dd.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") +
        (ob ? '<div class="obj" style="--k:' + PILARES[ob.k].c + '"><p class="obj-k">Tu objetivo para ' + ({ semana: "la semana que viene", mes: "el mes que viene", anio: "lo que viene" }[resModo]) + "</p><p class=\"obj-t\">" + esc(ob.t) + '</p><p class="obj-s">' + esc(ob.s) + "</p></div>" : "") + "</section>";
    }

    /* Récords */
    if (D.recs.length) {
      h += '<section class="card rise recs" style="--c:#E9B75B"><p class="card-k">Récords</p><p class="card-t">' + D.recs.length + (D.recs.length === 1 ? " récord nuevo" : " récords nuevos") + "</p>" +
        '<ul class="pr-l">' + D.recs.slice(0, 8).map((x, i) => '<li><span class="pr-cup">🏆</span><span class="pr-x"><b>' + esc(x.n) + "</b><small>" + prTxt(x) + " · antes " + prTxt(x.antes) + " · " + fmtDay(x.d) + "</small></span>" +
          '<button type="button" class="btn sm alt" data-rs="pr" data-i="' + i + '">Compartir</button></li>').join("") + "</ul></section>";
    }

    /* Entreno */
    if (s.entreno) {
      const v = cortes.map((c) => Object.keys(D.ctx.ent).reduce((a, k) => a + (k >= c.desde && k <= c.hasta ? D.ctx.ent[k].kg : 0), 0));
      h += '<section class="card rise" style="--c:' + PILARES.entreno.c + '"><p class="card-k">Entreno</p>' +
        '<p class="card-t">' + s.entreno.dias + (s.entreno.dias === 1 ? " día" : " días") + ' <small class="res-de">de ' + s.entreno.espera + " esperados</small></p>" +
        '<div class="prog-k"><span><b>' + fmtKg(s.entreno.kg) + "</b> kg movidos</span><span><b>" + s.entreno.series + "</b> series</span></div>" +
        barrasRes(v, cortes, PILARES.entreno.c) + compara(s.entreno.dias, sa.entreno && sa.entreno.dias, (d) => d + (d === 1 ? " día" : " días"), r.ant) + "</section>";
    }
    /* Hábitos */
    if (s.habitos) {
      const v = cortes.map((c) => {
        const ds = diasEntre(c.desde, c.hasta < todayKey() ? c.hasta : todayKey()).map((k) => pctDia(D.ctx.sis, k)).filter((x) => x.n);
        return ds.length ? ds.reduce((a, x) => a + x.pct, 0) / ds.length : 0;
      });
      h += '<section class="card rise" style="--c:' + PILARES.habitos.c + '"><p class="card-k">Hábitos</p>' +
        '<p class="card-t">' + pc(s.habitos.pct) + '% <small class="res-de">cumplido</small></p>' +
        '<div class="prog-k"><span><b>' + s.habitos.buenos + "</b> días arriba del 80%</span><span><b>" + s.habitos.dias + "</b> días con misiones</span></div>" +
        barrasRes(v, cortes, PILARES.habitos.c) + compara(pc(s.habitos.pct), sa.habitos && pc(sa.habitos.pct), (d) => d + (d === 1 ? " punto" : " puntos"), r.ant) + "</section>";
    }
    /* Nutrición */
    if (s.nutri) {
      const l = protLog(), nc = nutriCfg(), meta = nc ? metas(nc).prot : 0;
      const v = cortes.map((c) => diasEntre(c.desde, c.hasta).filter((k) => meta && (l[k] || 0) >= meta).length);
      h += '<section class="card rise" style="--c:' + PILARES.nutri.c + '"><p class="card-k">Nutrición</p>' +
        (s.nutri.dias ? '<p class="card-t">' + s.nutri.ok + ' <small class="res-de">de ' + s.nutri.dias + " días con la proteína cumplida</small></p>" : "") +
        (s.nutri.peso ? '<div class="prog-k"><span><b>' + fmtNum(s.nutri.peso) + "</b> kg</span>" + (s.nutri.dif ? "<span><b>" + (s.nutri.dif > 0 ? "+" : "−") + fmtNum(Math.abs(s.nutri.dif)) + "</b> kg en el período</span>" : "") + "</div>" : "") +
        (meta ? barrasRes(v, cortes, PILARES.nutri.c) : "") + "</section>";
    }
    /* Plata */
    if (s.plata) {
      const v = cortes.map((c) => plataStats(c.desde, c.hasta).gasto);
      h += '<section class="card rise" style="--c:' + PILARES.plata.c + '"><p class="card-k">Finanzas</p>' +
        '<p class="card-t">' + money(s.plata.gasto) + ' <small class="res-de">gastado</small></p>' +
        '<div class="prog-k">' + (s.plata.ingreso ? "<span><b>" + money(s.plata.ahorro) + "</b> te quedó</span>" : "") +
        (s.plata.aportes ? "<span><b>" + money(s.plata.aportes) + "</b> a tus metas</span>" : "") +
        (s.plata.habPct != null ? "<span><b>" + pc(s.plata.habPct) + "%</b> hábitos de plata</span>" : "") + "</div>" +
        barrasRes(v, cortes, PILARES.plata.c) + compara(s.plata.gasto, sa.plata && sa.plata.gasto, money, r.ant, true) + "</section>";
    }
    if (!s.entreno && !s.habitos && !s.nutri && !s.plata) {
      h += '<section class="card rise"><p class="card-k">Nada por acá</p><p class="card-t">Todavía no hay datos</p>' +
        '<p class="card-s">Entrená, marcá tus misiones, anotá tu proteína y tus gastos: acá vas a ver cómo te fue en cada pilar.</p></section>';
    }

    RES_BODY.innerHTML = h;
    animar(RES_BODY);
  }

  /* ───── Imagen para historias (1080×1920) ─────
     Cada cliente que la postea lleva la marca puesta: es la publicidad que
     no hay que pagar. No muestra montos de plata, solo porcentajes. */
  function imagenResumen(D) {
    const r = D.r, s = D.s;
    const L = lienzoBase(), x = L.x, W = L.W;
    const ORO = "#E9B75B", TINTA = "#F3EDE4", GRIS = "#9C8AB8";
    const texto = (t, f, col, px, py, al) => { x.font = f; x.fillStyle = col; x.textAlign = al || "center"; x.fillText(t, px, py); };
    const bisel = (bx, by, bw, bh, col, corte) => {
      x.beginPath();
      x.moveTo(bx + corte, by); x.lineTo(bx + bw, by);
      x.lineTo(bx + bw, by + bh - corte); x.lineTo(bx + bw - corte, by + bh);
      x.lineTo(bx, by + bh); x.lineTo(bx, by + corte);
      x.closePath(); x.fillStyle = col; x.fill();
    };
    const rg = rango(s.puntaje);
    const aro = (cx, cy, rad, grosor, pct, col) => {
      x.lineCap = "round"; x.lineWidth = grosor;
      x.strokeStyle = "rgba(156,138,184,.22)"; x.beginPath(); x.arc(cx, cy, rad, 0, Math.PI * 2); x.stroke();
      if (pct > 0) { x.save(); x.shadowColor = col; x.shadowBlur = 40; x.strokeStyle = col; x.beginPath(); x.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, pct)); x.stroke(); x.restore(); }
    };

    texto({ semana: "MI SEMANA", mes: "MI MES", anio: "MI AÑO" }[resModo], "700 50px 'Chakra Petch', sans-serif", ORO, W / 2, 170);
    texto(nombre ? nombre.toUpperCase() : "EN MODO SISTEMA", "700 76px 'Chakra Petch', sans-serif", TINTA, W / 2, 262);
    texto(r.nom, "400 38px 'Archivo', sans-serif", GRIS, W / 2, 320);

    aro(W / 2, 590, 200, 34, (s.puntaje || 0) / 100, s.puntaje == null ? ORO : rg.c);
    texto(s.puntaje == null ? "—" : String(s.puntaje), "700 180px 'Chakra Petch', sans-serif", TINTA, W / 2, 645);
    texto("PUNTAJE", "600 32px 'Archivo', sans-serif", GRIS, W / 2, 700);
    if (s.puntaje != null) {
      x.font = "700 46px 'Chakra Petch', sans-serif";
      const t = "RANGO " + rg.n.toUpperCase(), tw = x.measureText(t).width + 70;
      bisel(W / 2 - tw / 2, 820, tw, 76, rg.c, 16);
      texto(t, "700 46px 'Chakra Petch', sans-serif", "#0B0715", W / 2, 874);
    }

    const tiles = [
      ["entreno", s.entreno ? String(s.entreno.dias) : "—", s.entreno ? (s.entreno.dias === 1 ? "día entrenado" : "días entrenados") : "sin datos",
        D.recs.length ? "🏆 " + D.recs.length + (D.recs.length === 1 ? " récord nuevo" : " récords nuevos") : s.entreno && s.entreno.kg ? fmtKg(s.entreno.kg) + " kg movidos" : ""],
      ["habitos", s.habitos ? pc(s.habitos.pct) + "%" : "—", "misiones cumplidas", s.habitos ? s.habitos.buenos + " días arriba del 80%" : ""],
      ["nutri", s.nutri && s.nutri.dias ? s.nutri.ok + "/" + s.nutri.dias : "—", "días con la proteína", s.nutri && s.nutri.dif ? (s.nutri.dif > 0 ? "+" : "−") + fmtNum(Math.abs(s.nutri.dif)) + " kg" : ""],
      finOn() ? ["plata", s.plata && s.plata.score != null ? pc(s.plata.score) + "%" : "—", "finanzas en orden", s.plata && s.plata.habPct != null ? "hábitos de plata " + pc(s.plata.habPct) + "%" : ""]
        : ["racha", String(rachaDias()), rachaDias() === 1 ? "día completo seguido" : "días completos seguidos", D.recs.length ? "" : "🔥 racha"],
    ];
    tiles.forEach((t, i) => {
      const bx = 90 + (i % 2) * 465, by = 960 + Math.floor(i / 2) * 320, bw = 435, bh = 290;
      const col = PILARES[t[0]].c;
      bisel(bx, by, bw, bh, "rgba(30,20,51,.92)", 26);
      x.fillStyle = col; x.fillRect(bx, by + 26, 8, bh - 26);
      texto(PILARES[t[0]].n.toUpperCase(), "600 30px 'Archivo', sans-serif", col, bx + 44, by + 66, "left");
      texto(t[1], "700 104px 'Chakra Petch', sans-serif", TINTA, bx + 40, by + 175, "left");
      texto(t[2], "400 30px 'Archivo', sans-serif", GRIS, bx + 44, by + 222, "left");
      if (t[3]) texto(t[3], "600 28px 'Archivo', sans-serif", TINTA, bx + 44, by + 262, "left");
    });
    firma(x, W);
    return L.c;
  }

  function textoReto(D) {
    const s = D.s;
    return D.r.quien.charAt(0).toUpperCase() + D.r.quien.slice(1) + " saqué " + s.puntaje + "/100 en " + (CFG.producto || "SISTEMA") +
      " (rango " + rango(s.puntaje).n + ") 💪 Entreno, hábitos y comida" + (finOn() ? ", y hasta la plata" : "") + ", todo medido. ¿Te animás a superarme? Arrancá acá: " + linkAmigos();
  }

  let resDesde = "hoy";
  if (RES_BODY) {
    RES_BODY.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-rs]");
      if (!b || b.disabled) return;
      const a = b.dataset.rs;
      const decir = (t) => { const n = document.getElementById("res-n"); if (n) n.textContent = t; };
      if (a === "volver") { if (window.__irA) window.__irA(resDesde || "hoy"); return; }
      if (a === "modo") { resModo = b.dataset.m; resOff = 0; sfx("toque"); return renderResumen(); }
      if (a === "off") { resOff = Math.max(0, resOff + Number(b.dataset.d)); sfx("toque"); return renderResumen(); }
      const D = resumenDatos();
      if (a === "historia") {
        sfx("toque");
        return compartirImagen(imagenResumen(D), "mi-" + { semana: "semana", mes: "mes", anio: "anio" }[resModo] + ".png",
          D.s.puntaje != null ? textoReto(D) : "", decir);
      }
      if (a === "reto") {
        sfx("toque");
        const t = textoReto(D);
        if (navigator.share) { navigator.share({ text: t }).catch(() => {}); return; }
        window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank", "noopener");
        return;
      }
      if (a === "pr" && D.recs[Number(b.dataset.i)]) { sfx("toque"); return compartirRecord(D.recs[Number(b.dataset.i)]); }
    });
  }

  function chipsHoy() {
    const n = rachaDias();
    const r = rangoRes("semana", 0), s = statsRes(r.desde, r.hasta, ctxRes());
    const rg = s.puntaje != null ? rango(s.puntaje) : null;
    return (n ? '<span class="hchip" style="--k:#FF6F4E">🔥 ' + n + (n === 1 ? " día" : " días") + "</span>" : "") +
      (rg ? '<button type="button" class="hchip" style="--k:' + rg.c + '" data-act="go" data-to="resumen">◆ ' + rg.n + "</button>" : "");
  }

  /* Hoy: los cuatro pilares de la semana, de un vistazo */
  /* Tu progreso: cada tarjeta aparece cuando tiene algo para mostrar.
     El primer día, Hoy es corto: solo lo que hay que hacer. */
  let progAbierto = false;
  if (HOY) HOY.addEventListener("toggle", (ev) => { if (ev.target.classList && ev.target.classList.contains("prog")) progAbierto = ev.target.open; }, true);
  function progresoHoy(lg, nc) {
    const dias = Object.keys(leer(KEY_DIAS, {})).length;
    const p = plataData();
    const h = (Object.keys(entrenoPorDia()).length ? cardSemana() : "") +
      (finOn() && (p.mov.length || p.metas.length || (p.cuentas || []).length) ? cardPlata() : "") +
      (nc && !nutriEdit ? cardNutri() : "") +
      (pesos().length ? cardPeso() : "") +
      (medidas().length || dias >= 7 ? cardMedidas() : "") +
      (lg.ok.length ? cardLogros(lg) : "") +
      cardHistorial() + cardPush(false);
    if (!h) return "";
    return '<details class="prog"' + (progAbierto ? " open" : "") + '><summary class="sec-h">Tu progreso <small>peso, medidas, logros, historial</small></summary>' + h + "</details>";
  }

  function cardPilares() {
    const r = rangoRes("semana", 0);
    const s = statsRes(r.desde, r.hasta, ctxRes());
    if (s.puntaje == null) return "";
    const ir = { entreno: "entreno", habitos: "sistema", nutri: "", plata: "plata" };
    const mini = ["entreno", "habitos", "nutri"].concat(finOn() ? ["plata"] : []).map((k) => {
      const v = s[k] && s[k].score != null ? Math.round(s[k].score * 100) : null;
      return '<button type="button" class="pil" style="--c:' + PILARES[k].c + '"' + (ir[k] ? ' data-act="go" data-to="' + ir[k] + '"' : "") + ">" +
        anillo(v || 0, v == null ? "—" : '<i data-n="' + v + '" data-fin="' + v + '">' + v + "</i>", "", 62) + "<span>" + PILARES[k].n + "</span></button>";
    }).join("");
    return '<section class="card rise pils-card"><div class="bv-top"><p class="card-k">Tu semana · entreno, hábitos, comida' + (finOn() ? " y finanzas" : "") + '</p>' +
      (s.puntaje != null ? '<p class="pils-tot"><b>' + s.puntaje + "</b>/100</p>" : "") + "</div>" +
      '<div class="pils">' + mini + "</div>" +
      '<button type="button" class="btn pri wide" data-act="go" data-to="resumen">Ver mi semana completa</button></section>';
  }

  /* Hoy: la plata del mes, chiquito */
  function cardPlata() {
    const p = plataData();
    const ym = todayKey().slice(0, 7);
    const [desde, hasta] = mesRango(ym);
    const s = plataStats(desde, hasta);
    const cs = cuentasDelMes(p, ym), falta = cs.filter((x) => !x.pago);
    const porPagar = falta.reduce((a, x) => a + x.m, 0);
    const prox = falta[0];
    const libre = s.ingreso - s.gasto - porPagar;
    return '<section class="card rise" style="--c:' + (falta.some((x) => x.dias < 0) ? "#FF6F4E" : "#5FD6E0") + '"><p class="card-k">Finanzas · ' + MESES[new Date().getMonth()] + "</p>" +
      (s.ingreso ? '<p class="card-t ' + (libre >= 0 ? "" : "mal") + '">' + money(libre) + '</p><p class="hero-s">' + (libre >= 0 ? "te queda libre este mes" : "te falta este mes") + "</p>"
        : '<p class="card-t">' + money(s.gasto) + '</p><p class="hero-s">gastado este mes</p>') +
      (falta.length ? '<p class="hero-kg"><b>' + money(porPagar) + "</b> por pagar · " + (prox ? esc(prox.c.n) + " " + venceTxt(prox).toLowerCase() : "") + "</p>" : cs.length ? '<p class="hero-kg">Cuentas del mes pagadas ✓</p>' : "") +
      '<button type="button" class="btn alt" data-act="go" data-to="plata">Ver mis finanzas</button></section>';
  }


  window.addEventListener("shell-tab", (ev) => {
    if (ev.detail === "plata") renderPlata();
    if (ev.detail === "resumen") renderResumen();
    else resDesde = ev.detail;
  });


  /* ═══════════ Tu día: todo lo de hoy en una sola lista ═══════════
     La app se abre para una cosa: saber qué falta hoy y tacharlo rápido.
     Cada fila se completa con un toque, sin ir a otra pantalla. */
  const KEY_AGUA = "rutina-cliente-agua";
  const KEY_DIAS = "rutina-cliente-dias";       /* % del día cumplido, para la racha */
  const KEY_DESC = "rutina-cliente-descanso";   /* días marcados como descanso */
  const KEY_ENVIO = "rutina-cliente-envios";    /* semanas ya cerradas (vistas en el resumen) */
  const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k) || "null") || def; } catch (e) { return def; } };
  const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } };
  const metaVasos = () => { const c = nutriCfg(); return c ? Math.max(6, Math.round(metas(c).agua / 0.25)) : 8; };
  const COMIDAS = [["Huevo", 6], ["Pollo 100 g", 31], ["Carne 100 g", 26], ["Atún (lata)", 25], ["Whey (scoop)", 24], ["Yogur proteico", 15], ["Queso 50 g", 12], ["Lentejas (taza)", 18]];

  function plataAgregar(tipo, m, cat, nota, fecha) {
    const p = plataData();
    const d = fecha || todayKey();
    p.mov.push({ id: uid(), d: d, t: tipo, m: Math.round(m * 100) / 100, cat: tipo === "g" ? cat : "", nota: (nota || "").trim().slice(0, 40) });
    /* anotar el gasto ya cumple el hábito de anotar */
    if (d === todayKey() && tipo === "g" && habitosPlata(p).some((x) => x.id === "anote")) {
      (p.habLog[d] || (p.habLog[d] = {})).anote = true;
    }
    plataGuardar(p);
  }
  function sumarAgua(n) {
    const l = leer(KEY_AGUA, {}), k = todayKey();
    l[k] = Math.max(0, (l[k] || 0) + n);
    escribir(KEY_AGUA, l);
    return l[k];
  }
  function sumarProt(g) {
    const l = protLog(), k = todayKey();
    l[k] = Math.max(0, (l[k] || 0) + g);
    try { localStorage.setItem(KEY_PROT, JSON.stringify(l)); } catch (err) { /* sin almacenamiento */ }
    return l[k];
  }

  function diaItems() {
    const k = todayKey(), it = [];
    const d = diaDeHoy();
    const desc = leer(KEY_DESC, {});
    if (d && flat(d).length) {
      const p = progress(d);
      const hoyRutina = dayById(TODAY);
      const tocaDescanso = !p.done && hoyRutina && hoyRutina.kind === "rest";
      if (desc[k] || tocaDescanso) {

      } else {
        it.push({ id: "ent", ic: "💪", t: d.day + " · " + d.title, s: p.done ? p.done + " de " + p.total + " ejercicios" : "Todavía no arrancaste",
          pct: p.total ? Math.min(1, p.done / p.total / 0.8) : 0, act: "entrenar", cta: d.id, btn: p.done ? "Seguir" : "Entrenar",

      it.push({ id: "prot", ic: "🥩", t: "Proteína", s: g + " de " + m.prot + " g", pct: Math.min(1, g / m.prot), q: "prot", btn: "+25 g", sheet: "prot" });
      const v = leer(KEY_AGUA, {})[k] || 0, mv = metaVasos();

    } else {

    }
    const s = sistemaData();
    if (s) {
      /* cada hábito de hoy es una fila: se tacha acá mismo, sin ir a otra pestaña */
      const log = (s.log || {})[k] || {};
      s.habits.filter((x) => toca(x, k, s)).sort((a, b) => ((a.time || "99") < (b.time || "99") ? -1 : 1)).forEach((x) => {
