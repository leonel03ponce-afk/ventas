      });
    } else {
      it.push({ id: "mis", ic: "⚡", t: "Elegí tus hábitos", s: "Suben de nivel y te avisan a su hora", pct: 0, go: "sistema", btn: "Armar", extra: true });
    }
    const p = plataData(), hl = (p.habLog || {})[k] || {};
    const movHoy = p.mov.filter((m) => m.d === k && m.t === "g");
    const anotado = movHoy.length > 0 || !!hl.anote || !!hl.nogaste;
    if (finOn()) cuentasDelMes(p, k.slice(0, 7)).filter((x) => !x.pago && x.dias <= 1).forEach((x) => {
      it.push({ id: "cta-" + x.c.id, ic: "🧾", t: "Pagar " + x.c.n, s: venceTxt(x) + (x.m ? " · " + money(x.m) : ""), pct: 0, act: "pagar", cta: x.c.id, btn: "Pagada" });
    });
    if (finOn()) it.push({ id: "plata", ic: "💰", t: "Finanzas", pct: anotado ? 1 : 0, q: "gasto", btn: "+ Gasto", alt: anotado ? "" : "nogaste", altT: "No gasté",
      s: movHoy.length ? movHoy.length + (movHoy.length === 1 ? " gasto · " : " gastos · ") + money(movHoy.reduce((a, m) => a + m.m, 0)) : hl.nogaste ? "Hoy no gastaste nada" : "Anotá lo que gastes" });
    const ps = pesos(), ult = ps[ps.length - 1];
    const diasPeso = ult ? Math.round((fechaDe(k) - fechaDe(ult.d)) / 86400000) : 99;
    if (diasPeso >= 7) it.push({ id: "peso", ic: "⚖️", t: "Pesate", s: ult ? "Hace " + diasPeso + " días que no te pesás" : "Una vez por semana alcanza", pct: 0, q: "peso", btn: "Anotar", extra: true });
    return it;
  }
  /* Los hábitos cuentan como un solo ítem (su promedio), para que tener
     muchos no tape lo demás */
  function pctDelDia(it) {
    const l = (it || diaItems()).filter((x) => !x.extra);
    const habs = l.filter((x) => x.grupo === "hab"), resto = l.filter((x) => x.grupo !== "hab");
    const vals = resto.map((x) => x.pct);
    if (habs.length) vals.push(habs.reduce((a, x) => a + x.pct, 0) / habs.length);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  }
  /* Tacha (o destacha) un hábito del Sistema desde Hoy */
  let sisSucio = false;
  function marcarHabito(id) {
    const d = sistemaData();
    if (!d) return null;
    const k = todayKey(), x = d.habits.filter((y) => String(y.id) === String(id))[0];
    if (!x) return null;
    const log = d.log || (d.log = {}), l = log[k] || (log[k] = {});
    if (x.type === "count") {
      const v = typeof l[x.id] === "number" ? l[x.id] : l[x.id] ? x.target || 1 : 0;
      l[x.id] = v >= (x.target || 1) ? 0 : v + 1;
    } else l[x.id] = !l[x.id];
    if (!l[x.id]) delete l[x.id];
    try { localStorage.setItem("sistema:v1", JSON.stringify(d)); } catch (err) { return null; }
    sisSucio = true;
    return { hecho: hecho(x, l), todos: d.habits.filter((y) => toca(y, k, d)).every((y) => hecho(y, l)) };
  }
  /* Guarda cómo va el día, para la racha y el resumen */
  function guardarDia() {
    const l = leer(KEY_DIAS, {});
    l[todayKey()] = Math.round(pctDelDia() * 100);
    escribir(KEY_DIAS, l);
    return l[todayKey()];
  }
  /* Días seguidos con el día cumplido (80% o más). Hoy suma si ya llegaste */
  function rachaDias() {
    const l = leer(KEY_DIAS, {});
    let n = 0, k = todayKey();
    if ((l[k] || 0) < 80) k = masDias(k, -1);
    for (let i = 0; i < 1000 && (l[k] || 0) >= 80; i++, k = masDias(k, -1)) n++;
    return n;
  }
  const RANGOS = [[92, "Leyenda", "#FF6F4E"], [80, "Diamante", "#5FD6E0"], [65, "Oro", "#E9B75B"], [50, "Acero", "#B8C4D9"], [30, "Bronce", "#D08B5B"], [0, "Hierro", "#9C8AB8"]];
  const rango = (p) => { const r = RANGOS.filter((x) => (p || 0) >= x[0])[0]; return { n: r[1], c: r[2] }; };

  let diaAntes = -1;

        '<span class="td-b">' + (x.alt ? '<button type="button" class="btn sm lnk" data-act="td-' + x.alt + '">' + esc(x.altT) + "</button>" : "") +
        (ok && !x.q ? "" : '<button type="button" class="btn sm ' + (ok ? "alt" : "pri") + '" ' + accion + ">" + esc(x.btn) + "</button>") + "</span></li>";
    };
    /* un hábito: toda la fila es el botón */
    const habFila = (x) => '<li class="td hb' + (x.hecho ? " ok" : "") + '" data-act="td-hab" data-id="' + esc(x.hab) + '">' +
      '<span class="td-hora">' + esc(x.hora) + '</span><span class="td-x"><b>' + esc(x.t) + "</b>" + (x.s ? "<small>" + esc(x.s) + "</small>" : "") + "</span>" +
      '<span class="td-ck" aria-hidden="true">' + (x.hecho ? CHECK : x.btn ? "+1" : "") + "</span></li>";
    const habs = it.filter((x) => x.grupo === "hab"), resto = it.filter((x) => x.grupo !== "hab");
    const hechos = habs.filter((x) => x.hecho).length;
    const msg = pct >= 100 ? "Día completo. Así se construye." : pct >= 80 ? "Ya cuenta para la racha. Cerralo al 100." : pct >= 40 ? "Vas bien. Lo que falta, de a uno." : "Arrancá por lo más fácil.";
    return '<section class="card rise hero tudia" style="--c:' + (pct >= 100 ? "#4BD489" : "#E9B75B") + '"><p class="card-k">Tu día</p>' +
      '<div class="hero-g">' + anillo(pct, '<i data-n="' + pct + '" data-fin="' + pct + '">' + pct + "</i><u>%</u>", "", 92) +
      '<div class="hero-x"><p class="card-t">' + (pct >= 100 ? "¡Completo!" : "Lo de hoy") + '</p><p class="hero-s">' + msg + "</p></div></div>" +
      '<ul class="tds">' + resto.map(fila).join("") + "</ul>" +
      (habs.length ? '<div class="td-sub"><span>Hábitos · ' + hechos + " de " + habs.length + '</span><button type="button" class="btn lnk" data-act="go" data-to="sistema">Editar ›</button></div>' +
        '<ul class="tds">' + habs.map(habFila).join("") + "</ul>" : "") +
      avisoRapido() + "</section>";
  }


  /* Al terminar una acción: si el día se completó, festejo grande */
  function chequearDia() {
    const ahora = guardarDia();
    if (diaAntes > -1 && diaAntes < 100 && ahora >= 100) {
      setTimeout(() => { festejo(true); sfx("listo"); }, 250);
      const r = rachaDias();
      showStatus(r > 1 ? "Día completo · " + r + " días seguidos 🔥" : "Día completo 🔥", 3200);
    }
    diaAntes = ahora;
  }

  /* El domingo y el lunes: cerrar la semana y mandársela al entrenador */
  function cardCierre() {
    const dow = new Date().getDay();
    if (dow !== 0 && dow !== 1) return "";
    const off = dow === 0 ? 0 : 1;
    const r = rangoRes("semana", off);
    if (leer(KEY_ENVIO, {})[r.desde]) return "";

  }

  /* ───── Récords personales: más peso, o mismas reps con más peso ───── */
  function recordsEntre(desde, hasta) {
    const vistos = {};
    state.days.forEach((d) => flat(d).forEach((it) => {
      const ses = (it.hist || []).filter((s) => s.d).slice().sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
      let top = null;
      ses.forEach((s) => {
        let mejor = null;
        s.sets.forEach((x) => {
          const p = num(x.p), r = num(x.r);
          if (!p || !r) return;
          const sc = p * 1000 + r;
          if (!mejor || sc > mejor.sc) mejor = { sc: sc, p: p, r: r };
        });
        if (!mejor) return;
        if (top && mejor.sc > top.sc && s.d >= desde && s.d <= hasta) {
          const ya = vistos[it.n];
          if (!ya || ya.d <= s.d) vistos[it.n] = { n: it.n, p: mejor.p, r: mejor.r, d: s.d, antes: top };
        }
        if (!top || mejor.sc > top.sc) top = mejor;
      });
    }));
    return Object.keys(vistos).map((k) => vistos[k]).sort((a, b) => (a.d < b.d ? 1 : -1));
  }
  const prTxt = (x) => fmtNum(x.p) + " kg × " + fmtNum(x.r);
  function cardRecordsHoy() {

  /* Texto con una sola línea por renglón para el lienzo */
  function partir(x, txt, ancho) {
    const pal = String(txt).split(" "), l = [];
    let cur = "";
    pal.forEach((w) => { const t = cur ? cur + " " + w : w; if (x.measureText(t).width > ancho && cur) { l.push(cur); cur = w; } else cur = t; });
    if (cur) l.push(cur);
    return l;
  }
  const sitioCorto = () => String(CFG.sitio || location.host).replace(/^https?:\/\//, "").replace(/\/$/, "");
  function lienzoBase() {
    const W = 1080, H = 1920, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.fillStyle = "#0B0715"; x.fillRect(0, 0, W, H);
    const brillo = (cx, cy, rad, col) => {
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, col); g.addColorStop(1, "rgba(11,7,21,0)");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    };
    brillo(160, 120, 900, "rgba(233,183,91,.22)");
    brillo(1000, 1250, 900, "rgba(169,139,255,.18)");
    brillo(200, 1800, 700, "rgba(95,214,224,.10)");
    return { c: c, x: x, W: W, H: H };
  }
  function firma(x, W) {
    const texto = (t, f, col, py) => { x.font = f; x.fillStyle = col; x.textAlign = "center"; x.fillText(t, W / 2, py); };
    x.fillStyle = "rgba(243,237,228,.14)"; x.fillRect(120, 1630, W - 240, 2);
    texto(String(CFG.producto || "SISTEMA") + " · " + MARCA, "700 50px 'Chakra Petch', sans-serif", "#F3EDE4", 1715);
    texto("Pedí tu rutina en " + sitioCorto(), "400 34px 'Archivo', sans-serif", "#9C8AB8", 1775);
  }
  function imagenRecord(pr) {

    texto("🏆", "160px sans-serif", "#E9B75B", 360);
    texto("NUEVO RÉCORD", "700 64px 'Chakra Petch', sans-serif", "#E9B75B", 480);
    if (nombre) texto(nombre.toUpperCase(), "600 40px 'Archivo', sans-serif", "#9C8AB8", 545);
    x.font = "700 82px 'Chakra Petch', sans-serif";

    firma(x, W);
    return L.c;
  }
  /* Comparte una imagen: menú del celular si hay, si no la descarga */
  function compartirImagen(lienzo, nom, texto, decir) {
    const listo = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    listo.then(() => lienzo.toBlob((blob) => {
      if (!blob) return decir("No se pudo armar la imagen.");
      const archivo = new File([blob], nom, { type: "image/png" });
      const datos = { files: [archivo], text: texto };
      if (navigator.canShare && navigator.canShare(datos) && navigator.share) {
        navigator.share(datos).then(() => decir("¡Compartida!")).catch(() => decir(""));
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      decir("Imagen descargada. Subila a tu historia.");
    }, "image/png"));
  }

  window.addEventListener("shell-tab", (ev) => {

  /* ═══════════ Avisos push de los hábitos diarios ═══════════
     El servidor (netlify/functions/push-habitos.mjs) avisa a la hora de
     cada misión si todavía no está hecha, y a la noche si falta alguna.
     Para saber qué falta, la app le cuenta cómo va el día cada vez que
     cambia algo. Solo hábitos: nada de rutina ni de plata. */
  const KEY_PUSH = "push:cfg";
  const KEY_PUSH_ULT = "push:ult";
  const hayPush = () => "serviceWorker" in navigator && "PushManager" in window && typeof Notification !== "undefined";
  const pushCfg = () => leer(KEY_PUSH, { on: false, cierre: "21:30", porHabito: true });
  let pushEdit = false, pushNota = "";

  function estadoHabitos() {
    const d = sistemaData();
    if (!d) return { habitos: [], hoy: { f: todayKey(), ok: [] } };
    const log = (d.log || {})[todayKey()] || {};
    return {
      habitos: d.habits.filter((h) => !h.paused).map((h) => ({ id: String(h.id), n: h.name || "Misión", t: h.time || "", d: h.days || [0, 1, 2, 3, 4, 5, 6], dep: !!h.dependsOn })),
      hoy: { f: todayKey(), ok: d.habits.filter((h) => hecho(h, log)).map((h) => String(h.id)) },
    };
  }
  function apiPush(cuerpo) {
    return fetch("/api/push", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(cuerpo), keepalive: true })
      .then((r) => r.json().catch(() => ({})).then((j) => (r.ok ? j : Promise.reject(j.error || "No se pudo conectar. Probá de nuevo."))));
  }
  const suscripcion = () => navigator.serviceWorker.ready.then((reg) => reg.pushManager.getSubscription());
  const zona = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } };

  async function activarPush(cierre, porHabito) {
    if (!hayPush()) throw "Este navegador no permite avisos.";
    if (esIOS() && !instalada()) throw "En iPhone, primero agregá la app a la pantalla de inicio (Compartir → Agregar a inicio) y abrila desde ahí.";
    if (!(await pedirAviso())) throw "No diste permiso. Activá las notificaciones para esta página en los ajustes del navegador.";
    const r = await fetch("/api/push").catch(() => null);
    if (!r || !r.ok) throw "No se pudo conectar. Probá de nuevo con internet.";
    const clave = (await r.json()).clave;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: deb64u(clave) });
    const e = estadoHabitos();
    await apiPush({ accion: "alta", sub: sub.toJSON(), zona: zona(), cierre: cierre, porHabito: porHabito, habitos: e.habitos, hoy: e.hoy });
    escribir(KEY_PUSH, { on: true, cierre: cierre, porHabito: porHabito });
    try { localStorage.setItem(KEY_PUSH_ULT, JSON.stringify(e)); } catch (err) { /* sin almacenamiento */ }
  }
  async function apagarPush() {
    try {
      const sub = await suscripcion();
      if (sub) { await apiPush({ accion: "baja", endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe().catch(() => {}); }
    } catch (err) { /* igual lo apagamos acá */ }
    escribir(KEY_PUSH, Object.assign(pushCfg(), { on: false }));
  }
  /* Le cuenta al servidor cómo va el día, solo si cambió algo */
  function sincronizarPush(extra) {
    const c = pushCfg();
    if (!c.on || !hayPush()) return Promise.resolve();
    const e = estadoHabitos(), s = JSON.stringify(e);
    let ult = "";
    try { ult = localStorage.getItem(KEY_PUSH_ULT) || ""; } catch (err) { /* sin almacenamiento */ }
    if (!extra && s === ult) return Promise.resolve();
    return suscripcion().then((sub) => {
      if (!sub) { escribir(KEY_PUSH, Object.assign(c, { on: false })); return; }
      return apiPush(Object.assign({ accion: "estado", endpoint: sub.endpoint, zona: zona(), habitos: e.habitos, hoy: e.hoy }, extra || {}))
        .then(() => { try { localStorage.setItem(KEY_PUSH_ULT, s); } catch (err) { /* sin almacenamiento */ } });
    }).catch(() => {});
  }

  /* Una línea al pie de Tu día, en vez de una tarjeta grande */
  function avisoRapido() {
    const c = pushCfg();
    if (!sistemaData() || !hayPush() || c.on || c.no) return "";
    const ios = esIOS() && !instalada();
    return '<div class="td-aviso"><span>🔔 ' + (ios ? "Agregá la app a tu pantalla de inicio y te avisamos a la hora de cada hábito." : "¿Te avisamos a la hora de cada hábito si no lo hiciste?") + "</span>" +
      (ios ? "" : '<button type="button" class="btn sm pri" data-act="push-rapido">Sí, avisame</button>') +
      '<button type="button" class="btn sm lnk" data-act="push-test">Probar</button>' +
      '<button type="button" class="btn sm lnk" data-act="push-no" aria-label="No, gracias">No</button></div><p class="pan-n" id="push-n">' + esc(pushNota) + "</p>";
  }
  /* Prueba paso a paso: dice exactamente en qué parte falla */
  async function probarAvisos() {
    const pasos = [];
    const pintar = () => {
      const n = document.getElementById("push-n");
      if (n) n.innerHTML = '<ul class="diag">' + pasos.map((p) => '<li class="' + p[0] + '"><b>' + (p[0] === "ok" ? "✓" : p[0] === "mal" ? "✗" : "…") + "</b> " + p[1] + "</li>").join("") + "</ul>";
    };
    const paso = (estado, txt) => { pasos.push([estado, txt]); pintar(); };
    const corregir = (estado, txt) => { pasos[pasos.length - 1] = [estado, txt]; pintar(); };
    if (!hayPush()) {
      paso("mal", esIOS() && !instalada() ? "En iPhone los avisos solo andan con la app agregada a la pantalla de inicio (Compartir → Agregar a inicio) y abierta desde ese ícono." : "Este navegador no permite avisos. Probá con Chrome (Android o computadora) o Safari en iPhone con la app instalada.");
      return;
    }
    paso("", "Permiso del navegador…");
    if (!(await pedirAviso())) { corregir("mal", "El navegador tiene los avisos bloqueados para esta página. Tocá el candado (o los 3 puntos) → Configuración del sitio → Notificaciones → Permitir."); return; }
    corregir("ok", "Permiso del navegador: dado.");
    let reg = null;
    try { reg = await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(() => r(null), 6000))]); } catch (e) { reg = null; }
    if (!reg) { paso("mal", "La app todavía no terminó de instalarse en este navegador. Cerrala, volvé a abrirla y probá de nuevo."); return; }
    try {
      await reg.showNotification("Prueba de " + (CFG.producto || "SISTEMA"), { body: "Si ves esto, tu teléfono muestra los avisos de la app.", icon: "icono-192.png", badge: "icono-192.png", tag: "prueba-local" });
      paso("ok", "Aviso de prueba mostrado en este dispositivo. Si no lo viste, el problema está en el teléfono o la compu: revisá que las notificaciones del navegador estén activadas en los ajustes del sistema y que no esté en No molestar.");
    } catch (e) { paso("mal", "El dispositivo no dejó mostrar el aviso (" + (e && e.message || "error") + ")."); return; }
    paso("", "Conexión con el servidor de avisos…");
    let clave = "";
    try {
      const r = await fetch("/api/push", { cache: "no-store" });
      if (!r.ok) throw new Error("código " + r.status);
      clave = (await r.json()).clave;
      corregir("ok", "Servidor de avisos: funcionando.");
    } catch (e) { corregir("mal", "El servidor de avisos no responde (" + (e && e.message || "sin conexión") + "). Si dice 404, las funciones de Netlify no están publicadas: hay que conectar el sitio con GitHub (ver COBRO-AUTOMATICO.md)."); return; }
    paso("", "Suscripción de este dispositivo…");
    try {
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: deb64u(clave) });
      const c = pushCfg(), e = estadoHabitos();
      await apiPush({ accion: "alta", sub: sub.toJSON(), zona: zona(), cierre: c.cierre || "21:30", porHabito: c.porHabito !== false, habitos: e.habitos, hoy: e.hoy });
      escribir(KEY_PUSH, { on: true, cierre: c.cierre || "21:30", porHabito: c.porHabito !== false });
      corregir("ok", "Este dispositivo quedó anotado para recibir avisos.");
      paso("", "Mandando un aviso desde el servidor…");
      await apiPush({ accion: "prueba", endpoint: sub.endpoint });
      corregir("ok", "Aviso enviado desde el servidor: tiene que llegarte en unos segundos, aunque cierres la app.");
      /* lo que anotó el servidor: si la revisión automática corre y qué avisos tenés hoy */
      const info = await apiPush({ accion: "info", endpoint: sub.endpoint });
      const hace = (iso) => { const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); return m < 1 ? "recién" : m < 60 ? "hace " + m + " min" : m < 1440 ? "hace " + Math.round(m / 60) + " h" : "hace " + Math.round(m / 1440) + " días"; };
      if (!info.cron) paso("mal", "La revisión automática del servidor (la que manda los avisos a la hora de cada hábito) nunca corrió. En Netlify → Logs → Functions tiene que aparecer «push-habitos» corriendo cada 15 minutos. Si no aparece, el sitio no está publicado desde GitHub en producción.");
      else if (Date.now() - new Date(info.cron.at).getTime() > 40 * 60000) paso("mal", "La revisión automática corrió por última vez " + hace(info.cron.at) + ": Netlify dejó de ejecutarla. Mirá Logs → Functions → push-habitos.");
      else paso("ok", "Revisión automática funcionando (última: " + hace(info.cron.at) + ").");
      const ahoraMin = new Date().getHours() * 60 + new Date().getMinutes();
      const prox = (info.habitos || []).filter((x) => minutosDe(x.t) > ahoraMin).sort((a, c) => (a.t < c.t ? -1 : 1)).slice(0, 3);
      if (!(info.habitos || []).length) paso("mal", "Tus hábitos no tienen horario: poné la hora de cada uno en la pestaña Hábitos (tocá el hábito → hora).");
      else paso("ok", prox.length ? "Próximos avisos de hoy: " + prox.map((x) => x.n + " " + x.t).join(", ") + (info.cierre ? " · repaso " + info.cierre : "") + "." : "Por hoy no quedan avisos" + (info.cierre ? " (repaso a las " + info.cierre + " si te falta algo)" : "") + ".");
      if (info.ultimo) paso("ok", "Último aviso automático: «" + info.ultimo.title + "», " + hace(info.ultimo.at) + ".");
      if (info.fallo) paso("mal", "Un aviso automático falló " + hace(info.fallo.at) + " («" + info.fallo.title + "»). Si se repite, desactivá y volvé a activar los avisos.");
      paso("ok", "Si llegan pero no suenan, el sonido lo maneja el teléfono: en Android, Ajustes → Apps → Chrome → Notificaciones → buscá este sitio → Sonido. En iPhone, Ajustes → Notificaciones → " + (CFG.producto || "SISTEMA") + " → Sonidos. Y revisá que no esté en No molestar.");
      const n = document.getElementById("push-n");
      if (n) n.insertAdjacentHTML("beforeend", '<p class="diag-b"><button type="button" class="btn sm pri" data-act="push-auto">Probar aviso automático</button><span>Lo manda el servidor solo, en menos de 15 minutos, aunque cierres la app. Así sabés si los avisos de tus hábitos van a llegar.</span></p>');
    } catch (err) { corregir("mal", typeof err === "string" ? err : "No se pudo anotar este dispositivo (" + (err && err.message || "error") + ")."); }
  }

  /* Respaldo dentro del teléfono: si la app quedó abierta o en segundo plano,
     ella misma avisa a la hora del hábito. Usa la misma etiqueta que el
     servidor, así si llegan los dos se ve uno solo. */
  const KEY_PUSH_LOCAL = "push:local";
  function avisoLocal() {
    const c = pushCfg();

    const k = todayKey(), t = new Date(), ahora = t.getHours() * 60 + t.getMinutes();
    const ya = leer(KEY_PUSH_LOCAL, {});
    if (ya.f !== k) { ya.f = k; ya.ids = []; }
    const log = (d.log || {})[k] || {};
    const pend = d.habits.filter((x) => toca(x, k, d) && !x.dependsOn && !hecho(x, log));
    const mostrar = (titulo, cuerpo, etiqueta, marca) => {
      ya.ids.push(marca); escribir(KEY_PUSH_LOCAL, ya);
      suscripcion().then((sub) => { if (sub) apiPush({ accion: "estado", endpoint: sub.endpoint, fecha: k, marcar: ya.ids.filter((x) => x === "cierre" || x.indexOf("h:") === 0) }).catch(() => {}); }).catch(() => {});
      navigator.serviceWorker.ready.then((reg) => reg.showNotification(titulo, { body: cuerpo, icon: "icono-192.png", badge: "icono-192.png", tag: etiqueta, renotify: true, silent: false, vibrate: [180, 90, 180], data: { url: "./#sistema" } })).catch(() => {});
    };
    if (c.porHabito !== false) {
      const ahoraHab = pend.filter((x) => { const m = minutosDe(x.time); return m >= 0 && m <= ahora && ahora - m < 15 && ya.ids.indexOf("h:" + x.id) < 0; });
      if (ahoraHab.length) {
        const desde = minutosDe(ahoraHab[0].time) - (minutosDe(ahoraHab[0].time) % 15);
        ahoraHab.forEach((x) => ya.ids.push("h:" + x.id));
        const resto = pend.length - ahoraHab.length;
        mostrar("⚡ Hora de: " + ahoraHab.map((x) => x.name).join(", "), resto ? "Después te " + (resto === 1 ? "queda 1 hábito más" : "quedan " + resto + " hábitos más") + " hoy." : "Es el último hábito de hoy. Cerrá el día.", "habito-" + desde, "h-lote");
        return;
      }
    }
    const ci = minutosDe(c.cierre);
    if (ci >= 0 && ci <= ahora && ahora - ci < 15 && pend.length && ya.ids.indexOf("cierre") < 0) {
      mostrar("Te " + (pend.length === 1 ? "falta 1 hábito" : "faltan " + pend.length + " hábitos"), "Falta: " + pend.slice(0, 4).map((x) => x.name).join(", ") + ". Todavía estás a tiempo de salvar la racha 🔥", "cierre", "cierre");
    }
  }

  /* las series de hoy para un ejercicio: lo ya anotado, o lo sugerido */
  function seriesGo(x) {
    const it = x.it, hoy = (it.hist || []).filter((s) => s.d === todayKey())[0];

    const ant = prev ? prev.sets.filter(hasVal) : [];
    const se = parseInt(it.se, 10);
    const n = Math.min(12, Math.max(isNaN(se) ? 0 : se, ant.length, hoy ? hoy.sets.length : 0, 1));
    const out = [];
    for (let k = 0; k < n; k++) {
      const ya = hoy && hoy.sets[k] && hasVal(hoy.sets[k]) ? hoy.sets[k] : null;
      if (ya) { out.push({ r: String(ya.r || ""), p: String(ya.p || ""), ok: true }); continue; }
      const a = ant[k] || ant[ant.length - 1];
      out.push({ r: o && o.r ? String(o.r) : a ? String(a.r || "") : String(parseInt(it.re, 10) || ""), p: o && o.p ? fmtNum(o.p) : a ? String(a.p || "") : "", ok: false });

  function guardarSerieGo(x, k, set) {
    const it = x.it;

    if (!s) { s = { d: todayKey(), sets: [] }; it.hist.push(s); }
    while (s.sets.length <= k) s.sets.push({ r: "", p: "" });
    s.sets[k] = set ? { r: set.r, p: set.p } : { r: "", p: "" };
    try { saveState(state); } catch (err) { showStatus("No se pudo guardar en este navegador", 3000); }
  }

    if (i < 0) i = 0;
    go = { dia: dayId, lista: lista, sets: sets, i: i, inicio: Date.now(), fin: false };

  GO.addEventListener("click", (ev) => {

    if (a === "sig") { sfx("toque"); return irGo(go.i + 1); }

    if (a === "mas") { const u = sets[sets.length - 1] || { r: "", p: "" }; sets.push({ r: u.r, p: u.p, ok: false }); return renderGo(); }
    if (a === "d+") { if (tm) { tm.endAt += 30000; tm.total += 30; tm.left += 30; } return renderGo(); }

    { n: "Abductores en máquina", g: "gluteo", eq: 3 },
    { n: "Curl de bíceps con mancuernas", g: "biceps", eq: 1 },
    { n: "Curl martillo", g: "biceps", eq: 1 },
    { n: "Curl en polea", g: "biceps", eq: 3 },
    { n: "Curl inclinado", g: "biceps", eq: 1 },
    { n: "Tríceps en polea", g: "triceps", eq: 3 },
    { n: "Extensión de tríceps sobre la cabeza", g: "triceps", eq: 1, ev: ["codo"] },
    { n: "Press cerrado con mancuernas", g: "triceps", eq: 1, c: 1 },
    { n: "Fondos entre bancos", g: "triceps", eq: 0, ev: ["hombro", "codo"] },
    { n: "Gemelo de pie", g: "gemelo", eq: 1 },
    { n: "Gemelo sentado", g: "gemelo", eq: 3 },
    { n: "Gemelo a una pierna", g: "gemelo", eq: 0 },
    { n: "Plancha", g: "core", eq: 0 },
    { n: "Rueda abdominal", g: "core", eq: 1, ev: ["espalda"] },
    { n: "Elevación de piernas colgado", g: "core", eq: 3 },
    { n: "Dead bug", g: "core", eq: 0 },
    { n: "Pallof press en polea", g: "core", eq: 3 },
    { n: "Plancha lateral", g: "core", eq: 0 },
    { n: "Hollow body", g: "core", eq: 0 },
    { n: "Leñador en polea", g: "core", eq: 3 },
    { n: "Rotación de tronco con banda", g: "core", eq: 0 },
    { n: "Curl de muñeca", g: "antebrazo", eq: 1 },
    { n: "Pronación y supinación con mancuerna", g: "antebrazo", eq: 1 },
    { n: "Agarre con disco o toalla", g: "antebrazo", eq: 1 },
    { n: "Curl inverso", g: "antebrazo", eq: 1, ev: ["codo"] },
    { n: "Cuello con banda", g: "cuello", eq: 0 },
    { n: "Tibial anterior", g: "gemelo", eq: 0 },
    { n: "Isquios excéntrico (nórdico)", g: "isquios", eq: 0 },
    { n: "Face pull con banda", g: "hombro", eq: 0 },
    { n: "Saltos a la cuerda", g: "cardio", eq: 0 }
  ];

  /* Qué suma cada deporte o foco elegido */
  const FOCOS = {
    "Boxeo": ["Leñador en polea", "Rotación de tronco con banda", "Cuello con banda", "Face pull con banda", "Saltos a la cuerda"],
    "Pulseadas": ["Curl de muñeca", "Pronación y supinación con mancuerna", "Agarre con disco o toalla", "Curl inverso", "Curl martillo"],
    "Fútbol": ["Isquios excéntrico (nórdico)", "Gemelo a una pierna", "Tibial anterior", "Rotación de tronco con banda"],
    "Running": ["Gemelo a una pierna", "Tibial anterior", "Isquios excéntrico (nórdico)", "Plancha lateral"],
    "Core y abdominales": ["Plancha", "Hollow body", "Rueda abdominal", "Elevación de piernas colgado"],
    "Brazos": ["Curl martillo", "Tríceps en polea", "Curl inclinado", "Press cerrado con mancuernas"],
    "Glúteos": ["Hip thrust con barra", "Patada de glúteo en polea", "Abductores en máquina", "Puente de glúteo"],
    "Espalda y postura": ["Face pull con banda", "Pájaros / deltoide posterior", "Remo con pecho apoyado", "Plancha"]
  };
  const CARDIOS = {
    "No, solo pesas": "",
    "10 min suave al final": "10 min de caminata o bici suave",
    "20 min al final": "20 min de cardio moderado",
    "Lo hago aparte": ""
  };

  const SPLITS = {
    2: [["Cuerpo completo A", ["cuadriceps", "pecho", "espalda", "isquios", "hombro", "core", "triceps"]],
        ["Cuerpo completo B", ["isquios", "espalda", "pecho", "gluteo", "biceps", "core", "gemelo"]]],
    3: [["Cuerpo completo A", ["cuadriceps", "pecho", "espalda", "hombro", "core", "triceps", "gemelo"]],
        ["Cuerpo completo B", ["isquios", "espalda", "pecho", "biceps", "core", "gluteo", "hombro"]],
        ["Cuerpo completo C", ["gluteo", "pecho", "espalda", "cuadriceps", "hombro", "triceps", "core"]]],
    4: [["Tren superior A", ["pecho", "espalda", "hombro", "espalda", "triceps", "biceps", "core"]],
        ["Tren inferior A", ["cuadriceps", "isquios", "gluteo", "cuadriceps", "gemelo", "core", "isquios"]],
        ["Tren superior B", ["espalda", "pecho", "hombro", "pecho", "biceps", "triceps", "core"]],
        ["Tren inferior B", ["isquios", "gluteo", "cuadriceps", "isquios", "gemelo", "core", "gluteo"]]],
    5: [["Tren superior A", ["pecho", "espalda", "hombro", "espalda", "triceps", "biceps", "core"]],
        ["Tren inferior A", ["cuadriceps", "isquios", "gluteo", "cuadriceps", "gemelo", "core", "isquios"]],
        ["Tren superior B", ["espalda", "pecho", "hombro", "pecho", "biceps", "triceps", "core"]],
        ["Tren inferior B", ["isquios", "gluteo", "cuadriceps", "isquios", "gemelo", "core", "gluteo"]],
        ["Hombros y brazos", ["hombro", "biceps", "triceps", "hombro", "biceps", "triceps", "core"]]],
    6: [["Empuje A", ["pecho", "hombro", "pecho", "triceps", "hombro", "triceps", "core"]],
        ["Tirón A", ["espalda", "espalda", "hombro", "biceps", "biceps", "core", "espalda"]],
        ["Piernas A", ["cuadriceps", "isquios", "gluteo", "cuadriceps", "gemelo", "core", "isquios"]],
        ["Empuje B", ["hombro", "pecho", "pecho", "triceps", "hombro", "triceps", "core"]],
        ["Tirón B", ["espalda", "espalda", "biceps", "biceps", "hombro", "core", "espalda"]],
        ["Piernas B", ["isquios", "gluteo", "cuadriceps", "isquios", "gemelo", "core", "gluteo"]]]
  };

  const OBJ = {
    "Ganar músculo": { se: [3, 4], re: "8-12", reC: "6-10", r: '90"', rC: "2'" },
    "Ganar fuerza": { se: [4, 5], re: "6-8", reC: "4-6", r: "2'", rC: "3'" },
    "Bajar grasa": { se: [3, 3], re: "12-15", reC: "10-12", r: '60"', rC: '90"' },
    "Salud y energía": { se: [2, 3], re: "10-15", reC: "8-12", r: '75"', rC: '90"' }
  };
  const EQNIV = { "Gimnasio completo": 3, "Gimnasio básico": 2, "En casa con mancuernas": 1, "En casa sin equipo": 0 };
  const CUIDADOS = [["hombro", "Hombro"], ["rodilla", "Rodilla"], ["espalda", "Espalda baja"], ["codo", "Codo o muñeca"]];
  const PASOS = [
    { f: "objetivo", t: "¿Qué querés lograr?", o: ["Ganar músculo", "Ganar fuerza", "Bajar grasa", "Salud y energía"] },
    { f: "nivel", t: "¿Hace cuánto entrenás?", o: ["Arranco ahora", "Menos de 1 año", "1 a 3 años", "Más de 3 años"] },
    { f: "dias", t: "¿Cuántos días por semana podés?", o: ["2", "3", "4", "5", "6"], suf: " días" },
    { f: "tiempo", t: "¿Cuánto tiempo tenés por sesión?", o: ["30 a 45 min", "45 a 60 min", "60 a 90 min"] },
    { f: "lugar", t: "¿Dónde vas a entrenar?", o: ["Gimnasio completo", "Gimnasio básico", "En casa con mancuernas", "En casa sin equipo"] },
    { f: "cuidados", t: "¿Algo que cuidar?", multi: true, o: CUIDADOS.map((c) => c[1]).concat(["Nada, estoy entero"]) },
    { f: "foco", t: "¿Hacés algún deporte o querés reforzar algo?", multi: true, o: ["Boxeo", "Pulseadas", "Fútbol", "Running", "Core y abdominales", "Brazos", "Glúteos", "Espalda y postura", "Nada en especial"] },
    { f: "cardio", t: "¿Sumamos cardio?", o: ["No, solo pesas", "10 min suave al final", "20 min al final", "Lo hago aparte"] }
  ];

  const KEY_ARMADO = "rutina-cliente-armado";
  let armado = {};
  try { armado = JSON.parse(localStorage.getItem(KEY_ARMADO) || "{}") || {}; } catch (err) { armado = {}; }
  let paso = 0;
  let planGen = null;
  let variante = 0;
  const armarEl = document.getElementById("armar-body");

  function guardarArmado() {
    try { localStorage.setItem(KEY_ARMADO, JSON.stringify(armado)); } catch (err) { /* sin almacenamiento */ }
  }

  function generar() {
    const dias = Math.max(2, Math.min(6, parseInt(armado.dias, 10) || 3));
    const obj = OBJ[armado.objetivo] || OBJ["Ganar músculo"];
    const nivel = armado.nivel || "1 a 3 años";
    const nivelIdx = ["Arranco ahora", "Menos de 1 año", "1 a 3 años", "Más de 3 años"].indexOf(nivel);
    const eq = EQNIV[armado.lugar] != null ? EQNIV[armado.lugar] : 3;
    const evitar = CUIDADOS.filter((c) => (armado.cuidados || []).indexOf(c[1]) > -1).map((c) => c[0]);
    const cuantos = armado.tiempo === "30 a 45 min" ? 4 : armado.tiempo === "60 a 90 min" ? 7 : 5;
    const series = nivelIdx <= 0 ? obj.se[0] : nivelIdx >= 3 ? obj.se[1] : obj.se[0] + (obj.se[1] > obj.se[0] ? 1 : 0);

    const pool = EJ.filter((e) => e.eq <= eq && !(e.ev || []).some((x) => evitar.indexOf(x) > -1));
    const usados = {};
    const elegir = (g, dia) => {
      const opciones = pool.filter((e) => e.g === g);
      if (!opciones.length) return null;
      const nuevos = opciones.filter((e) => !usados["g|" + e.n]);
      const libres = opciones.filter((e) => !usados[dia + "|" + e.n]);
      const lista = nuevos.length ? nuevos : libres.length ? libres : opciones;
      const orden = lista.slice().sort((a, b) => (b.c || 0) - (a.c || 0));
      const e = orden[(variante + dia + (usados["__n" + g] || 0)) % orden.length];
      usados[dia + "|" + e.n] = 1;
      usados["g|" + e.n] = 1;
      usados["__n" + g] = (usados["__n" + g] || 0) + 1;
      return e;
    };

    const focos = (armado.foco || []).filter((f) => FOCOS[f]);
    const extras = [];
    focos.forEach((f) => FOCOS[f].forEach((n) => {
      const e = pool.filter((x) => x.n === n)[0];
      if (e && extras.indexOf(e) < 0) extras.push(e);
    }));

    const plantilla = SPLITS[dias];
    return plantilla.map((d, i) => {
      const slots = d[1].slice(0, cuantos);
      const items = [];
      const suma = (e, accesorio) => {
        if (!e || items.some((x) => x.n === e.n)) return;
        const comp = !!e.c && !accesorio;
        items.push({
          n: e.n,
          se: String(comp ? series : Math.max(2, series - (obj.se[1] > obj.se[0] ? 1 : 0))),
          re: comp ? obj.reC : obj.re,
          r: comp ? obj.rC : obj.r,
          hist: []
        });
      };
      slots.forEach((g) => suma(elegir(g, i)));
      /* Lo del deporte o el foco va al final, como accesorio */
      if (extras.length) {
        suma(extras[(i * 2) % extras.length], true);
        if (extras.length > 1) suma(extras[(i * 2 + 1) % extras.length], true);
      }
      const p0 = items[0] ? EJ.filter((x) => x.n === items[0].n)[0] : null;
      const primero = p0 && p0.c && p0.eq >= 1 ? p0.n : "";
      const calor = [
        { n: "Movilidad de articulaciones", re: "5 min", sq: "cadera, hombros y tobillos", hist: [] },
        { n: "Cardio suave para entrar en calor", re: "5 min", sq: "caminata, bici o cuerda", hist: [] }
      ];
      if (primero) {
        calor.push({ n: "Aproximación en " + primero.toLowerCase(), se: "2", re: "6-8", sq: "al 50% y al 70%, sin fallar", hist: [] });
      }
      return { titulo: d[0], items: items, calor: calor };
    });
  }

  function planAEstado(p) {
    const card = CARDIOS[armado.cardio] != null ? CARDIOS[armado.cardio] : "";
    return { v: 1, days: p.map((d, i) => ({
      id: "d" + (i + 1), kind: "train", tab: "D" + (i + 1), day: "Día " + (i + 1), title: d.titulo,
      c: COLORS[i % COLORS.length], on: "#0B0715",
      activation: (d.calor || []).map((x) => ({ n: x.n, se: x.se, re: x.re, sq: x.sq, hist: [] })),
      blocks: d.items.map((x) => ({ n: x.n, se: x.se, re: x.re, r: x.r, hist: [] })),
      cardio: card
    })) };
  }

  function opcionHtml(p, valor) {
    const sel = p.multi
      ? (armado[p.f] || []).indexOf(valor) > -1
      : String(armado[p.f] || "") === valor;
    return '<button type="button" class="op' + (sel ? " on" : "") + '" data-act="op" data-f="' + p.f + '" data-v="' + esc(valor) + '">' +
      esc(valor + (p.suf && /^\d+$/.test(valor) ? p.suf : "")) + "</button>";
  }

  function armarHtml() {
    if (planGen) return planGenHtml();
    const p = PASOS[paso];
    const listo = p.multi ? true : !!armado[p.f];
    let h = '<header class="hoy-h"><p class="hoy-k">Armar tu rutina</p><h1 class="hoy-t">' + esc(p.t) + "</h1>" +
      '<p class="hoy-d">Paso ' + (paso + 1) + " de " + PASOS.length + "</p></header>";
    h += '<div class="ops">' + p.o.map((o) => opcionHtml(p, o)).join("") + "</div>";
    h += '<div class="pan-b">' + (paso > 0 ? '<button type="button" class="btn alt" data-act="atras">Volver</button>' : "") +
      '<button type="button" class="btn pri"' + (listo ? "" : " disabled") + ' data-act="sigue">' + (paso === PASOS.length - 1 ? "Ver mi rutina" : "Seguir") + "</button></div>";
    h += '<p class="legal">Esto es una guía general de entrenamiento, no una indicación médica. Si tenés una lesión o una condición de salud, consultá con un profesional antes de arrancar.</p>';
    return h;
  }

  function planGenHtml() {
    const dias = planGen.length;
    let h = '<header class="hoy-h"><p class="hoy-k">Tu rutina</p><h1 class="hoy-t">' + esc(armado.objetivo || "Tu planGen") + "</h1>" +
      '<p class="hoy-d">' + dias + " días por semana · " + esc(armado.lugar || "") + "</p></header>";
    planGen.forEach((d, i) => {
      h += '<section class="card" style="--c:' + COLORS[i % COLORS.length] + '"><p class="card-k">Día ' + (i + 1) + "</p>" +
        '<p class="card-t">' + esc(d.titulo) + "</p>" +
        '<p class="card-s">Entrada en calor: ' + esc((d.calor || []).map((c) => c.n.toLowerCase()).join(" · ")) + "</p>" +
        "<ol class=\"plan\">" +
        d.items.map((x) => '<li><span class="pl-n">' + esc(x.n) + '</span><span class="pl-s">' + esc(x.se + "×" + x.re) + "</span></li>").join("") +
        "</ol></section>";
    });
    h += '<div class="pan-b"><button type="button" class="btn pri" data-act="usar">Empezar a entrenar</button>' +
      '<button type="button" class="btn alt" data-act="otra">Otra versión</button>' +
      '<button type="button" class="btn alt" data-act="reset">Cambiar respuestas</button></div>';
    h += '<a class="btn alt wide" href="' + esc(waUrl("Hola " + MARCA + "! " + (nombre ? "Soy " + nombre + ". " : "") +
      "Armé mi rutina: " + (armado.objetivo || "") + ", " + (armado.dias || "") + " días, " + (armado.lugar || "") +
      ((armado.cuidados || []).length ? ", cuidando " + armado.cuidados.join(" y ") : "") + ". ¿La revisamos?")) +
      '" target="_blank" rel="noopener">Que la revise ' + esc(MARCA) + "</a>";
    h += '<p class="legal">Esto es una guía general de entrenamiento, no una indicación médica. Si tenés una lesión o una condición de salud, consultá con un profesional antes de arrancar.</p>';
    return h;
  }

  /* Otros ejercicios del mismo grupo que le sirven igual */
  function alternativas(nombre) {
    const actual = EJ.filter((e) => e.n === nombre)[0];
    if (!actual) return [];
    const eq = EQNIV[armado.lugar] != null ? EQNIV[armado.lugar] : 3;
    const evitar = CUIDADOS.filter((c) => (armado.cuidados || []).indexOf(c[1]) > -1).map((c) => c[0]);
    return EJ.filter((e) => e.g === actual.g && e.n !== nombre && e.eq <= eq && !(e.ev || []).some((x) => evitar.indexOf(x) > -1))
      .map((e) => e.n).slice(0, 8);
  }

  function renderArmar() {
    if (armarEl) armarEl.innerHTML = armarHtml();
  }

  if (armarEl) {
    armarEl.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-act]");
      if (!b) return;
      const act = b.dataset.act;
      if (act === "op") {
        sfx("toque");
        const f = b.dataset.f, v = b.dataset.v;
        const p = PASOS[paso];
        if (p.multi) {
          const actuales = armado[f] || [];
          if (v.indexOf("Nada") === 0) armado[f] = actuales.indexOf(v) > -1 ? [] : [v];
          else {
            const sin = actuales.filter((x) => x.indexOf("Nada") !== 0);
            armado[f] = sin.indexOf(v) > -1 ? sin.filter((x) => x !== v) : sin.concat([v]);
          }
        } else {
          armado[f] = v;
        }
        guardarArmado();
        renderArmar();
        return;
      }
      if (act === "atras") { paso = Math.max(0, paso - 1); renderArmar(); window.scrollTo(0, 0); return; }
      if (act === "sigue") {
        if (paso === PASOS.length - 1) { variante = 0; planGen = generar(); sfx("record"); }
        else { paso++; sfx("listo"); }
        renderArmar();
        window.scrollTo(0, 0);
        return;
      }
      if (act === "otra") { variante++; planGen = generar(); renderArmar(); window.scrollTo(0, 0); return; }
      if (act === "reset") { planGen = null; paso = 0; renderArmar(); window.scrollTo(0, 0); return; }
      if (act === "usar") {
        state = planAEstado(planGen);
        try { saveState(state); } catch (err) { /* sin almacenamiento */ }
        edit = null;
        dropDraft();
        mount();
        select(state.days[0].id, {});
        refreshTabs();
        renderFoot();
        renderHoy();
        if (window.__irA) window.__irA("entreno");
        sfx("dia");
        showStatus("Tu rutina está lista", 2600);
      }
    });
    renderArmar();
  }

  programarRecordatorio();

})();
</script>
<script>
(function () {
  var nav = document.getElementById("shellnav");
  var panes = { hoy: document.getElementById("pane-hoy"), armar: document.getElementById("pane-armar"), entreno: document.getElementById("pane-entreno"), sistema: document.getElementById("pane-sistema"), plata: document.getElementById("pane-plata"), resumen: document.getElementById("pane-resumen") };
  var KEY = "shell:tab";
  function show(which) {
    Object.keys(panes).forEach(function (k) { panes[k].hidden = k !== which; });
    var luz = which === "armar" ? "entreno" : which;   /* Armar vive dentro de Entreno */
    [].forEach.call(nav.querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.go === luz)); });
    try { localStorage.setItem(KEY, which); } catch (e) {}
    window.dispatchEvent(new CustomEvent("shell-tab", { detail: which }));
    window.scrollTo(0, 0);
  }
  window.__irA = show;
  document.getElementById("pane-armar").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-go-back]");
    if (b) show(b.dataset.goBack);
  });
  nav.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-go]");
    if (b) show(b.dataset.go);
  });
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href="#sistema"]');
    if (!a) return;
    ev.preventDefault();
    show("sistema");
  }, true);
  window.addEventListener("hashchange", function () { if (location.hash === "#sistema") show("sistema"); });
  /* tocar un aviso de hábitos abre directo el Sistema */
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", function (ev) { if (ev.data && ev.data.ir && panes[ev.data.ir]) show(ev.data.ir); });
  show(location.hash === "#sistema" ? "sistema" : "hoy");
})();
</script>
<script>
(function () {
  "use strict";

  var CFG = (window.CONFIG || {}).acceso || {};
  var SECRETO = CFG.secreto || "cambiame";
  var ADMIN = String(CFG.admin || "ADMIN-0000").toUpperCase().replace(/[^A-Z0-9]/g, "");
  var BLOQUEADOS = CFG.bloqueados || [];
  /* códigos dados de baja desde el servidor (reembolsos): ver final del archivo */
  var BLOQ_COD = [];
  try { BLOQ_COD = JSON.parse(localStorage.getItem("acceso:bloq") || "[]") || []; } catch (e) {}
  var LIBRE = CFG.libre === true;
  var AB = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var KEY = "acceso:v1";
  var KEY_SERIE = "acceso:serie";
  var KEY_EMITIDOS = "acceso:emitidos";
  var MARCA = (window.CONFIG || {}).marca || "tu entrenador";
  var WA = (window.CONFIG || {}).whatsapp || "";
  var gate = document.getElementById("gate");
  var vista = "codigo";
  var generado = null;
  var PLANES = (window.CONFIG || {}).planes || [];
  var REC = (window.CONFIG || {}).recomendados || {};
  var SITIO = (window.CONFIG || {}).sitio || (location.origin + location.pathname);
  var DIAS_PRUEBA = parseInt(CFG.prueba, 10) || 0;
  var PRUEBA_WA = CFG.pruebaPorWhatsApp === true && !!WA;
  var PALABRA = String(CFG.palabraPrueba || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  var KEY_PRUEBA = "acceso:prueba";
  var KEY_REF = "acceso:ref";
  var KEY_MIREF = "acceso:miref";
  var KEY_CLIENTES = "acceso:clientes";
  var DIA = 86400000;
  var desdeApp = false;

  /* Quién lo recomendó: llega en el link (?ref=nombre) y queda guardado
     para sumarlo al mensaje de compra. Gana el primero que lo trajo. */
  (function () {
    var m = /[?&]ref=([^&#]+)/i.exec(location.search || "");
    if (!m) return;
    try {
      var r = decodeURIComponent(m[1]).replace(/[^\w\-áéíóúñÁÉÍÓÚÑ]/g, "").slice(0, 30);
      if (r && !localStorage.getItem(KEY_REF)) localStorage.setItem(KEY_REF, r);
    } catch (e) {}
  })();
  function refGuardado() { try { return localStorage.getItem(KEY_REF) || ""; } catch (e) { return ""; } }

  function plata(n) { return "$" + Math.round(n).toLocaleString("es-AR"); }
  function nombreCorto() { return String(MARCA).split(" ")[0]; }
  function precioMeses(meses) {
    var p = PLANES.filter(function (x) { return x.meses === meses; })[0];
    if (p) return p.precio;
    var men = PLANES.filter(function (x) { return x.meses === 1; })[0];
    return men && meses > 0 ? men.precio * meses : 0;
  }
  function msgPrueba() {
    var ref = refGuardado();
    return "Hola " + nombreCorto() + "! Quiero probar " + ((window.CONFIG || {}).producto || "la app") + " " + DIAS_PRUEBA + " días gratis." + (ref ? "\nMe recomendó: " + ref : "");
  }
  function empezarPrueba() {
    try { localStorage.setItem(KEY_PRUEBA, String(Date.now())); } catch (e) {}
    var tiene = "";
    try { tiene = localStorage.getItem("rutina-cliente-nombre") || ""; } catch (e) {}
    if (tiene) { abrir(true); return; }
    vista = "nombre"; pintar();
  }
  function msgCompra(plan) {
    var ref = refGuardado();
    var quien = "";
    try { quien = localStorage.getItem("rutina-cliente-nombre") || ""; } catch (e) {}
    return "Hola " + nombreCorto() + "! " + (quien ? "Soy " + quien + ". " : "") +
      (plan ? "Quiero el plan " + plan.nombre + " (" + plata(plan.precio) + ")." : "Quiero mi acceso a la app.") +
      (ref ? "\nMe recomendó: " + ref : "");
  }

  /* Prueba gratis: arranca una sola vez por teléfono */
  function pruebaInicio() { try { return parseInt(localStorage.getItem(KEY_PRUEBA) || "0", 10) || 0; } catch (e) { return 0; } }
  function pruebaQuedan() {
    var ini = pruebaInicio();
    if (!ini || !DIAS_PRUEBA) return 0;
    return Math.max(0, Math.ceil((ini + DIAS_PRUEBA * DIA - Date.now()) / DIA));
  }

  function firma(txt) {
    var h = 2166136261, i;
    for (i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 13; h = Math.imul(h, 1274126177); h ^= h >>> 16;
    var n = h >>> 0, out = "", k;
    for (k = 0; k < 4; k++) { out += AB.charAt(n % 32); n = Math.floor(n / 32); }
    return out;
  }
  function dos(n) { return AB.charAt(n % 32) + AB.charAt(Math.floor(n / 32) % 32); }
  function leerDos(s) { return AB.indexOf(s.charAt(0)) + AB.indexOf(s.charAt(1)) * 32; }
  function limpio(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function fecha(d) { return d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear(); }
  function vencimiento(meses) { return new Date(2026, meses + 1, 0, 23, 59, 59); }

  function arma(serial, meses) {
    var pay = dos(serial) + dos(meses);
    return pay + firma(SECRETO + pay);
  }
  function linda(c) { return c.slice(0, 4) + "-" + c.slice(4); }

  function valida(code) {
    var c = limpio(code);
    if (c.length !== 8) return { error: "Ese código no tiene el formato correcto." };
    var pay = c.slice(0, 4), chk = c.slice(4);
    if (firma(SECRETO + pay) !== chk) return { error: "Ese código no es válido." };
    var serial = pay.slice(0, 2);
    if (BLOQUEADOS.indexOf(serial) > -1 || BLOQ_COD.indexOf(c) > -1) return { error: "Ese código fue dado de baja. Si es un error, escribime." };
    var meses = leerDos(pay.slice(2));
    var vence = meses >= 1000 ? null : vencimiento(meses);
    if (vence && vence < new Date()) return { error: "Tu acceso venció el " + fecha(vence) + ". Escribime y lo renovamos.", vencido: true };
    return { ok: true, code: c, serial: serial, vence: vence };
  }

  function guardado() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return o && o.code ? o : null;
    } catch (e) { return null; }
  }
  function guardar(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  function abrir(primera) {
    document.body.classList.remove("bloqueado");
    if (gate) gate.hidden = true;
    if (window.__accRefrescar) window.__accRefrescar();
    if (!primera) return;
    try {
      if (!localStorage.getItem("rutina-cliente") && window.__irA) window.__irA("armar");
    } catch (e) {}
  }

  function waLink(txt) {
    var base = String(WA).split("?")[0];
    return base ? base + "?text=" + encodeURIComponent(txt) : "";
  }

  function emitidos() {
    try { return JSON.parse(localStorage.getItem(KEY_EMITIDOS) || "[]") || []; } catch (e) { return []; }
  }

  function pintar(msg, tipo) {
    if (!gate) return;
    var nom = (window.CONFIG || {}).producto || MARCA;
    var h = '<div class="g-box">';
    if (vista === "planes") {
      h += '<p class="g-k">' + nom + '</p><h1 class="g-t">Elegí tu plan</h1>' +
        (msg ? '<p class="g-msg">' + msg + "</p>" : "") +
        '<p class="g-s">Rutina armada, registro serie por serie, hábitos con experiencia y niveles, y ' + MARCA + ' a un WhatsApp de distancia.</p>' +
        '<div class="g-planes">' + PLANES.map(function (p, i) {
          var link = p.pago || waLink(msgCompra(p));
          return '<a class="g-plan' + (p.destacado ? " top" : "") + '" href="' + link + '" target="_blank" rel="noopener" data-plan="' + i + '">' +
            (p.destacado ? '<span class="g-tag">' + p.destacado + "</span>" : "") +
            '<span class="g-pn">' + p.nombre + '</span><span class="g-pp">' + plata(p.precio) + '</span>' +
            '<span class="g-pd">' + (p.detalle || "") + "</span></a>";
        }).join("") + "</div>" +
        '<p class="g-s chica">Todos incluyen tu rutina personalizada armada por ' + MARCA + '.</p>' +
        (PLANES.some(function (p) { return p.pago; }) ? '<p class="g-s chica">1. Pagás con Mercado Pago · 2. Me mandás el comprobante · 3. Te llega tu código por WhatsApp.</p>' +
          '<a class="g-btn chico" href="' + waLink(msgCompra(null).replace("Quiero mi acceso a la app.", "Ya pagué. Te mando el comprobante para recibir mi código.")) + '" target="_blank" rel="noopener">Ya pagué · mandar comprobante</a>' :
          '<p class="g-s chica">Tocá un plan y coordinamos el pago por WhatsApp. Apenas se acredita te paso tu código.</p>') +
        '<div class="g-row"><button type="button" class="g-btn chico" id="g-tengo">Ya tengo un código</button>' +
        (desdeApp ? '<button type="button" class="g-btn chico" id="g-app">Volver a la app</button>' : "") + "</div>";
    } else if (vista === "admin") {
      var lista = emitidos();
      h += '<p class="g-k">Panel privado</p><h1 class="g-t">Códigos</h1>' +
        '<p class="g-s">Generá uno por cliente. El código entra solo en el teléfono donde lo pongan, pero si se reenvía, funciona: por eso conviene uno distinto por persona y con vencimiento.</p>' +
        '<label class="g-l">Cliente<input id="g-nom" placeholder="Nombre y apellido" autocomplete="off"></label>' +
        '<label class="g-l">Acceso<select id="g-mes"><option value="3">3 meses</option><option value="12">1 año</option><option value="0">Para siempre</option><option value="1">1 mes</option><option value="6">6 meses</option></select></label>' +
        '<label class="g-l">Lo trajo (opcional)<input id="g-vend" placeholder="Quién lo recomendó" autocomplete="off"></label>' +
        '<p class="g-s chica" style="text-align:left">Primer pago: ' + (REC.comision || 0) + '% para quien lo trajo. Si es una renovación, poné el mismo nombre de cliente: se acuerda quién lo trajo y le suma el ' + (REC.renovacion || 0) + '%.</p>' +
        '<button type="button" class="g-btn" id="g-gen">Generar código</button>';
      if (generado) {
        h += '<div class="g-out"><p class="g-code">' + linda(generado.code) + "</p>" +
          '<p class="g-s">' + (generado.nombre ? generado.nombre + " · " : "") + (generado.vence ? "vence el " + fecha(generado.vence) : "sin vencimiento") + "</p>" +
          '<div class="g-row"><button type="button" class="g-btn chico" id="g-copiar">Copiar</button>' +
          (WA ? '<a class="g-btn chico" id="g-mandar" href="' + waLink("Hola " + (generado.nombre || "") + "! Tu acceso: " + linda(generado.code) + "\n" + location.origin + location.pathname + "\nPonelo cuando te lo pida y ya queda activado en tu teléfono.") + '" target="_blank" rel="noopener">Mandar por WhatsApp</a>' : "") +
          "</div></div>";
      }
      if (lista.length) {
        h += '<p class="g-k" style="margin-top:22px">Emitidos</p><ul class="g-list">' +
          lista.slice(-12).reverse().map(function (x) {
            return "<li><b>" + linda(x.code) + "</b> " + (x.nombre ? "· " + x.nombre + " " : "") + (x.vence ? "· hasta " + x.vence : "· sin vencimiento") +
              (x.vend ? " · vía " + x.vend : "") + "</li>";
          }).join("") + "</ul>";
        var deuda = {};
        lista.forEach(function (x) { if (x.vend && x.com) deuda[x.vend] = (deuda[x.vend] || 0) + x.com; });
        var vends = Object.keys(deuda);
        if (vends.length) {
          h += '<p class="g-k" style="margin-top:22px">Comisiones a pagar (' + (REC.comision || 0) + '% primer pago · ' + (REC.renovacion || 0) + '% renovaciones)</p><ul class="g-list">' +
            vends.map(function (v) { return "<li><b>" + v + "</b> · " + plata(deuda[v]) + "</li>"; }).join("") + "</ul>" +
            '<button type="button" class="g-btn chico" id="g-pague">Ya las pagué · poner en cero</button>';
        }
      }
      h += '<div class="g-row"><button type="button" class="g-btn chico" id="g-entrar">Entrar a la app</button>' +
        '<button type="button" class="g-btn chico" id="g-volver">Salir del panel</button></div>';
    } else if (vista === "nombre") {
      h += '<p class="g-k">' + nom + '</p><h1 class="g-t">Bienvenido</h1>' +
        '<p class="g-s">¿Cómo te llamás? Lo uso para tu tablero y para cuando me escribas.</p>' +
        '<input id="g-nombre" placeholder="Tu nombre" autocomplete="given-name" autocapitalize="words">' +
        '<button type="button" class="g-btn" id="g-listo">Empezar</button>';
    } else {
      h += '<p class="g-k">' + nom + '</p><h1 class="g-t">Tu acceso</h1>' +
        '<p class="g-s">Poné el código que te pasé. Queda activado en este teléfono y no te lo vuelve a pedir.</p>' +
        '<input id="g-code" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12">' +
        '<button type="button" class="g-btn" id="g-go">Entrar</button>' +
        '<p class="g-msg' + (tipo === "ok" ? " ok" : "") + '">' + (msg || "") + "</p>";
      if (DIAS_PRUEBA && !pruebaInicio()) {
        h += '<div class="g-o"><span>o</span></div>' +
          (PRUEBA_WA
            ? '<a class="g-btn alt" id="g-pedir" href="' + waLink(msgPrueba()) + '" target="_blank" rel="noopener">Probar gratis ' + DIAS_PRUEBA + ' días</a>' +
              '<p class="g-s chica">Escribime y te paso la palabra para activarla. Ponela arriba, donde va el código.</p>'
            : '<button type="button" class="g-btn alt" id="g-prueba">Probar gratis ' + DIAS_PRUEBA + ' días</button>' +
              '<p class="g-s chica">Sin tarjeta y sin cuenta. Si te sirve, después elegís un plan.</p>');
      }
      h += PLANES.length ? '<button type="button" class="g-link boton" id="g-planes">No tengo código · Ver planes</button>' :
        (WA ? '<a class="g-link" href="' + waLink(msgCompra(null)) + '" target="_blank" rel="noopener">No tengo código</a>' : "");
    }
    h += "</div>";
    gate.innerHTML = h;
    var inp = document.getElementById("g-code");
    if (inp && !msg) inp.focus();
  }

  function intentar() {
    var inp = document.getElementById("g-code");
    var txt = limpio(inp ? inp.value : "");
    if (txt && txt === ADMIN) { vista = "admin"; pintar(); return; }
    if (txt && DIAS_PRUEBA && PALABRA && txt === PALABRA) {
      if (pruebaInicio()) { pintar(pruebaQuedan() > 0 ? "Tu prueba ya está activa." : "Ya usaste la prueba en este teléfono. Elegí un plan para seguir."); return; }
      return empezarPrueba();
    }
    var r = valida(txt);
    if (r.ok) {
      guardar({ code: r.code, at: Date.now() });
      var yaTiene = "";
      try { yaTiene = localStorage.getItem("rutina-cliente-nombre") || ""; } catch (e) {}
      if (yaTiene) { pintar("Listo, activado.", "ok"); setTimeout(function () { abrir(true); }, 350); return; }
      vista = "nombre";
      pintar();
      return;
    }
    pintar(r.error);
  }

  if (gate) {
    gate.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t.id) return;
      if (t.id === "g-go") return intentar();
      if (t.id === "g-pague") {
        try {
          localStorage.setItem(KEY_EMITIDOS, JSON.stringify(emitidos().map(function (x) { x.com = 0; return x; })));
        } catch (e) {}
        pintar();
        return;
      }
      if (t.id === "g-planes") { vista = "planes"; pintar(); gate.scrollTop = 0; return; }
      if (t.id === "g-tengo") { vista = "codigo"; pintar(); return; }
      if (t.id === "g-app") { desdeApp = false; vista = "codigo"; abrir(false); return; }
      if (t.id === "g-prueba") return empezarPrueba();
      if (t.id === "g-listo") {
        var el = document.getElementById("g-nombre");
        var v = (el && el.value || "").trim().slice(0, 24);
        if (v) { try { localStorage.setItem("rutina-cliente-nombre", v); } catch (e) {} }
        abrir(true);
        return;
      }
      if (t.id === "g-volver") { vista = "codigo"; generado = null; pintar(); return; }
      if (t.id === "g-entrar") { guardar({ code: "ADMIN", at: Date.now(), admin: 1 }); abrir(false); return; }
      if (t.id === "g-copiar") {
        var c = linda(generado.code);
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c);
        t.textContent = "Copiado";
        return;
      }
      if (t.id === "g-gen") {
        var serie = 1;
        try { serie = parseInt(localStorage.getItem(KEY_SERIE) || "1", 10) || 1; } catch (e) {}
        var meses = parseInt((document.getElementById("g-mes") || {}).value || "3", 10);
        var hoy = new Date();
        var idx = meses === 0 ? 1023 : (hoy.getFullYear() - 2026) * 12 + hoy.getMonth() + meses;
        var code = arma(serie, idx);
        var nom = (document.getElementById("g-nom") || {}).value || "";
        var vend = ((document.getElementById("g-vend") || {}).value || "").trim().slice(0, 30);
        /* Comisión recurrente: cada cliente queda atado a quien lo trajo,
           y en cada renovación se le vuelve a sumar */
        var clave = nom.trim().toLowerCase();
        var clientes = {};
        try { clientes = JSON.parse(localStorage.getItem(KEY_CLIENTES) || "{}") || {}; } catch (e) {}
        var yaVino = clave && clientes[clave];
        if (!vend && yaVino) vend = clientes[clave];
        if (vend && clave && !yaVino) { clientes[clave] = vend; try { localStorage.setItem(KEY_CLIENTES, JSON.stringify(clientes)); } catch (e) {} }
        var pctCom = yaVino ? (REC.renovacion || 0) : (REC.comision || 0);
        var com = vend ? Math.round(precioMeses(meses) * pctCom / 100) : 0;
        generado = { code: code, nombre: nom.trim(), vence: meses === 0 ? null : vencimiento(idx) };
        try {
          localStorage.setItem(KEY_SERIE, String(serie + 1));
          var l = emitidos();
          l.push({ code: code, nombre: nom.trim(), vence: meses === 0 ? "" : fecha(vencimiento(idx)), vend: vend, com: com });
          localStorage.setItem(KEY_EMITIDOS, JSON.stringify(l.slice(-60)));
        } catch (e) {}
        pintar();
      }
    });
    gate.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.id === "g-code") { ev.preventDefault(); intentar(); }
      if (ev.key === "Enter" && ev.target.id === "g-nombre") { ev.preventDefault(); document.getElementById("g-listo").click(); }
    });
  }

  /* Volver al panel desde cualquier teléfono, aunque ya hayas entrado:
     brian-ponce.netlify.app/?panel  (o #panel). Sin esto, una vez que
     el acceso queda guardado la pantalla de la clave no vuelve a salir. */
  function pidePanel() {
    var q = String(location.search || "") + String(location.hash || "");
    return /[?&#]panel\b/i.test(q);
  }

  /* Botón "Generar código" dentro de Ajustes, solo si entraste como admin */
  function botonPanel() {
    if (!gate) return;
    document.addEventListener("click", function (ev) {
      var b = ev.target.closest && ev.target.closest('[data-act="panel"]');
      if (!b) return;
      ev.preventDefault();
      vista = "admin";
      generado = null;
      document.body.classList.add("bloqueado");
      gate.hidden = false;
      pintar("");
      window.scrollTo(0, 0);
    });
  }

  /* Viene de gracias.html con ./?codigo=XXXX-XXXX: se activa solo.
     Si ya tenía un código que dura más, se queda con ese. */
  var codigoNuevo = false;
  (function () {
    var m = /[?&]codigo=([A-Za-z0-9\-]+)/.exec(location.search || "");
    if (!m) return;
    try {
      var u = new URL(location.href); u.searchParams.delete("codigo");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
    var r = valida(m[1]);
    if (!r.ok) return;
    var prev = guardado();
    if (prev && prev.admin) return;
    var pv = prev && prev.code ? valida(prev.code) : null;
    if (pv && pv.ok && (!pv.vence || (r.vence && r.vence <= pv.vence))) return;
    guardar({ code: r.code, at: Date.now() });
    codigoNuevo = true;
  })();

  /* Lista de códigos dados de baja (reembolsos). Solo existe si el sitio
     tiene el cobro automático; si no, la respuesta es 404 y no pasa nada.
     Se aplica la próxima vez que se abre la app. */
  var ultBloq = 0;
  try { ultBloq = parseInt(localStorage.getItem("acceso:bloq-t") || "0", 10) || 0; } catch (e) {}
  if (/^https?:$/.test(location.protocol) && window.fetch && Date.now() - ultBloq > 6 * 36e5) {   /* cada 6 horas como mucho */
    try { localStorage.setItem("acceso:bloq-t", String(Date.now())); } catch (e) {}
    fetch("/api/bloqueados", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && d.codigos) try { localStorage.setItem("acceso:bloq", JSON.stringify(d.codigos)); } catch (e) {}
    }).catch(function () {});
  }

  var g = guardado();
  if (!LIBRE && pidePanel()) {
    /* el link con ?panel siempre lleva a la clave, aun con acceso guardado */
    document.body.classList.add("bloqueado");
    gate.hidden = false;
    vista = "codigo";
    pintar("");
    botonPanel();
    return;
  }
  if (g && g.admin) { document.body.classList.add("soy-admin"); botonPanel(); }
  if (LIBRE) {
    abrir(false);
  } else if (g && (g.admin || valida(g.code).ok)) {
    var tieneNombre = "";
    try { tieneNombre = localStorage.getItem("rutina-cliente-nombre") || ""; } catch (e) {}
    if (codigoNuevo && !tieneNombre) {
      document.body.classList.add("bloqueado");
      gate.hidden = false;
      vista = "nombre";
      pintar();
    } else abrir(codigoNuevo);
  } else if (pruebaQuedan() > 0) {
    abrir(false);
  } else {
    document.body.classList.add("bloqueado");
    if (gate) gate.hidden = false;
    var motivo = g ? (valida(g.code).error || "") : "";
    if (!motivo && pruebaInicio()) { motivo = "Terminó tu prueba gratis. Elegí un plan para seguir."; vista = "planes"; }
    pintar(motivo);
  }

  /* ───── Dentro de la app: aviso de acceso y "Recomendá y ganá" ─────
     Se suman a la pantalla Hoy cada vez que se vuelve a dibujar. */
  function abrirPlanes() {
    desdeApp = true;
    vista = "planes";
    document.body.classList.add("bloqueado");
    gate.hidden = false;
    pintar("");
    gate.scrollTop = 0;
  }
  function avisoAcceso() {
    if (LIBRE) return "";
    var gg = guardado();
    if (gg && gg.admin) return "";
    var v = gg && gg.code ? valida(gg.code) : null;
    if (v && v.ok) {
      if (!v.vence) return "";
      var dias = Math.ceil((v.vence - Date.now()) / DIA);
      if (dias > 7) return "";
      return '<section class="card acc-av"><p class="card-k">Tu acceso</p><p class="card-t">Vence ' + (dias <= 1 ? "mañana" : "en " + dias + " días") + '</p>' +
        '<p class="card-s">Renovalo antes del ' + fecha(v.vence) + ' y no perdés la racha ni tu historial.</p>' +
        '<button type="button" class="btn pri" data-acc="planes">Renovar</button></section>';
    }
    var q = pruebaQuedan();
    if (q > 0) {
      return '<section class="card acc-av"><p class="card-k">Prueba gratis</p><p class="card-t">' + (q === 1 ? "Último día" : "Te quedan " + q + " días") + '</p>' +
        '<p class="card-s">Todo lo que anotes queda guardado cuando elijas tu plan.</p>' +
        '<button type="button" class="btn pri" data-acc="planes">Ver planes</button></section>';
    }
    return "";
  }
  function miRef() {
    var r = "";
    try { r = localStorage.getItem(KEY_MIREF) || ""; } catch (e) {}
    if (r) return r;
    var n = "";
    try { n = localStorage.getItem("rutina-cliente-nombre") || ""; } catch (e) {}
    n = n.normalize ? n.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : n;
    n = n.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 14);
    if (!n) return "";
    r = n + "-" + AB.charAt(Math.floor(Math.random() * 32)).toLowerCase() + AB.charAt(Math.floor(Math.random() * 32)).toLowerCase();
    try { localStorage.setItem(KEY_MIREF, r); } catch (e) {}
    return r;
  }
  function linkRef() { var r = miRef(); return r ? SITIO.split("?")[0].split("#")[0].replace(/[^/]*$/, "") + "planes.html?ref=" + encodeURIComponent(r) : ""; }
  window.__linkRef = linkRef;
  function textoRef() { return "Estoy entrenando con " + (window.CONFIG || {}).producto + " de " + MARCA + ": rutina, hábitos y niveles en el celu. Mirala acá: " + linkRef(); }
  function cardRef() {
    if (!REC.activo || !PLANES.length || !linkRef()) return "";
    var base = PLANES.filter(function (x) { return x.meses > 0; })[0] || PLANES[0];
    var gana = Math.round(base.precio * (REC.comision || 0) / 100);
    return '<section class="card acc-ref"><p class="card-k">Recomendá y ganá</p><p class="card-t">' + (REC.comision || 0) + '% para vos</p>' +
      '<p class="card-s">Compartí tu link. Por cada persona que se suma te llevás el ' + (REC.comision || 0) + '% de su primer pago (desde ' + plata(gana) + ')' +
      (REC.renovacion ? " y el " + REC.renovacion + "% cada vez que renueva." : ".") + ' Que te mande el comprobante con el botón verde de la página.</p>' +
      '<p class="acc-link">' + linkRef().replace(/^https?:\/\//, "") + '</p>' +
      '<div class="pan-b"><button type="button" class="btn pri" data-acc="compartir">Compartir mi link</button> <button type="button" class="btn alt" data-acc="copiar">Copiar</button></div></section>';
  }
  var HOYB = document.getElementById("hoy-body");
  if (HOYB) {
    var sumar = function () {
      if (HOYB.querySelector("[data-acc-hecho]")) return;
      var marca = document.createElement("i");
      marca.setAttribute("data-acc-hecho", "");
      marca.hidden = true;
      HOYB.appendChild(marca);
      var cab = HOYB.querySelector(".hoy-h");
      var av = avisoAcceso();
      if (av && cab) cab.insertAdjacentHTML("afterend", av);
      var secs = HOYB.querySelectorAll("section.card");
      var ultima = secs[secs.length - 1];
      var rc = cardRef();
      if (rc && ultima) ultima.insertAdjacentHTML("beforebegin", rc);
    };
    new MutationObserver(sumar).observe(HOYB, { childList: true });
    sumar();
    window.__accRefrescar = function () {
      Array.prototype.forEach.call(HOYB.querySelectorAll(".acc-av, .acc-ref, [data-acc-hecho]"), function (n) { n.remove(); });
      sumar();
    };
    HOYB.addEventListener("click", function (ev) {
      var b = ev.target.closest && ev.target.closest("[data-acc]");
      if (!b) return;
      var a = b.getAttribute("data-acc");
      if (a === "planes") return abrirPlanes();
      if (a === "copiar") {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(linkRef());
        b.textContent = "Copiado";
        return;
      }
      if (a === "compartir") {
        if (navigator.share) { navigator.share({ text: textoRef() }).catch(function () {}); return; }
        window.open("https://wa.me/?text=" + encodeURIComponent(textoRef()), "_blank", "noopener");
      }
    });
  }
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} });
}
</script>
