<style id="shell">
:root { --shell-h: 52px; --acento: #E9B75B; }
html, body { margin: 0; padding: 0; background: #0B0715; }
body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
#pane-hoy, #pane-armar, #pane-entreno, #pane-sistema, #pane-plata, #pane-resumen { min-height: calc(100vh - 52px); min-height: calc(100dvh - 52px); }
#pane-hoy[hidden], #pane-armar[hidden], #pane-entreno[hidden], #pane-sistema[hidden], #pane-plata[hidden], #pane-resumen[hidden] { display: none; }
#shellnav { position: sticky; top: 0; z-index: 9999; display: flex; gap: 6px; padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: rgba(11, 7, 21, .94); backdrop-filter: blur(10px); border-bottom: 1px solid #241A3A; }
#shellnav button { position: relative; overflow: hidden; flex: 1 1 0; min-height: 44px; padding: 0 6px; border: 1px solid #332248; background: transparent; color: #9C8AB8; font: 600 12px/1 Archivo, system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; -webkit-tap-highlight-color: transparent; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: color .18s ease, background-color .18s ease, transform .12s ease; }
#shellnav button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #0B0715; }
#shellnav button:active { transform: scale(.96); }
body.bloqueado { overflow: hidden; }
/* El bundle de Sistema mide su alto con 100vh, que en iPhone cuenta la barra
   del navegador y deja un sobrante que se scrollea. dvh mide el alto real. */
#pane-sistema [style*="100vh"] { min-height: 100dvh !important; }
body.bloqueado #shellnav, body.bloqueado #pane-hoy, body.bloqueado #pane-armar, body.bloqueado #pane-entreno, body.bloqueado #pane-sistema, body.bloqueado #pane-plata, body.bloqueado #pane-resumen { display: none !important; }
#gate { position: fixed; inset: 0; z-index: 99999; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: #0B0715; color: #F3EDE4; font-family: Archivo, system-ui, -apple-system, sans-serif; }
#gate[hidden] { display: none; }
#gate *, #gate *::before, #gate *::after { box-sizing: border-box; }
.g-box { width: 100%; max-width: 420px; padding: 24px 20px 26px; background: #150E24; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); animation: g-in .45s cubic-bezier(.2,.7,.3,1); }
@keyframes g-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.g-k { margin: 0; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #645279; }
.g-t { margin: 10px 0 0; font: 700 38px/1 "Chakra Petch", system-ui, sans-serif; }
.g-s { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #9C8AB8; }
#gate input, #gate select { display: block; width: 100%; height: 50px; margin-top: 16px; padding: 0 12px; font: 700 20px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .08em; text-align: center; color: #F3EDE4; background: #1E1433; border: 1px solid #332248; border-radius: 0; -webkit-appearance: none; appearance: none; }
#gate select { font-size: 16px; letter-spacing: normal; text-align: left; }
#gate input:focus, #gate select:focus { outline: none; border-color: var(--acento, #E9B75B); }
.g-l { display: block; margin-top: 14px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #645279; }
.g-l input, .g-l select { margin-top: 6px; }
#gate .g-l input { font: 400 17px/1 Archivo, system-ui, sans-serif; letter-spacing: normal; text-align: left; }
.g-btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 16px; padding: 0 16px; font: 600 15px/1 Archivo, system-ui, sans-serif; color: #0B0715; background: var(--acento, #E9B75B); border: 0; border-radius: 0; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); cursor: pointer; text-decoration: none; transition: transform .12s ease; }
.g-btn:active { transform: scale(.98); }
.g-btn.chico { min-height: 40px; font-size: 13px; background: #1E1433; color: #F3EDE4; border: 1px solid #332248; }
.g-row { display: flex; gap: 8px; }
.g-row .g-btn { flex: 1 1 0; }
.g-msg { margin: 12px 0 0; min-height: 18px; font-size: 13px; line-height: 1.4; color: #FF6F4E; }
.g-msg.ok { color: #4BD489; }
.g-link { display: inline-block; margin-top: 16px; font-size: 13px; color: #9C8AB8; }
.g-out { margin-top: 18px; padding: 14px; background: #1E1433; animation: g-in .3s ease-out; }
.g-code { margin: 0; font: 700 30px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .1em; color: var(--acento, #E9B75B); }
.g-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.7; color: #9C8AB8; }
.g-list b { color: #F3EDE4; letter-spacing: .06em; }
.g-s.chica { font-size: 12px; text-align: center; }
.g-o { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: #645279; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.g-o::before, .g-o::after { content: ""; flex: 1; height: 1px; background: #332248; }
.g-btn.alt { margin-top: 14px; background: transparent; color: var(--acento, #E9B75B); box-shadow: inset 0 0 0 1px var(--acento, #E9B75B); }
button.g-link.boton { display: block; width: 100%; margin-top: 20px; padding: 6px; background: none; border: 0; font: inherit; font-size: 13px; color: #9C8AB8; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.g-planes { display: grid; gap: 10px; margin-top: 18px; }
.g-plan { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 12px; padding: 16px; background: #1E1433; border: 1px solid #332248; color: #F3EDE4; text-decoration: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: transform .15s ease; }
.g-plan:active { transform: scale(.98); }
.g-plan.top { border-color: var(--acento, #E9B75B); background: linear-gradient(135deg, rgba(233,183,91,.16), #1E1433 60%); padding-top: 32px; }
.g-tag { position: absolute; top: 0; left: 0; padding: 4px 10px 4px 14px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0B0715; background: var(--acento, #E9B75B); }
.g-pn { font: 700 20px/1.1 "Chakra Petch", system-ui, sans-serif; }
.g-pp { font: 700 22px/1 "Chakra Petch", system-ui, sans-serif; color: var(--acento, #E9B75B); }
.g-pd { grid-column: 1 / -1; font-size: 12px; color: #9C8AB8; }
.rt .acc-link { margin: 12px 0 0; padding: 10px 12px; background: rgba(255,255,255,.04); font: 600 13px/1.3 "Chakra Petch", system-ui, sans-serif; letter-spacing: .02em; color: var(--acento, #E9B75B); word-break: break-all; }
.rt .acc-av { --c: var(--acento, #E9B75B); }
.rt .acc-ref { --c: #4BD489; }
.rt .nu-q { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.rt .nu-g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.rt .nu-g div { padding: 10px 6px; background: rgba(255,255,255,.04); text-align: center; }
.rt .nu-g b { display: block; font: 700 17px/1.1 "Chakra Petch", sans-serif; color: #F3EDE4; }
.rt .nu-g span { display: block; margin-top: 4px; font-size: 10.5px; color: #9C8AB8; }
.rt .nu-n { font-size: 12px; }
.rt select.in { -webkit-appearance: none; appearance: none; }
.rt .med { margin: 12px 0 0; padding: 0; list-style: none; }
.rt .med li { display: grid; grid-template-columns: 1fr auto 56px; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 14px; color: #9C8AB8; }
.rt .med b { font: 700 16px/1 "Chakra Petch", sans-serif; color: #F3EDE4; }
.rt .med em { font-style: normal; font-size: 12px; text-align: right; color: #9C8AB8; }
.rt .med em.ok { color: #4BD489; }
.rt .med-f { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

.rt .hchip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 11px; border: 1px solid color-mix(in srgb, var(--k) 55%, transparent); background: color-mix(in srgb, var(--k) 16%, transparent); color: var(--k); font: 700 13px/1 var(--display); letter-spacing: .03em; clip-path: var(--bevel-sm); cursor: pointer; }
.rt .sec-h { margin: 34px 0 -2px; font: 700 13px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }

.rt .td-b { display: flex; align-items: center; gap: 2px; }
.rt .card .td-b .btn { margin-top: 0; }
.rt .td-b .btn.sm { min-height: 36px; padding: 0 11px; font-size: 13px; }
.rt .td-b .btn.lnk { color: var(--muted); padding: 0 6px; }
.rt .td.extra { opacity: .85; }
.rt .td.extra .td-x b { color: var(--muted); }
.rt .cierre .card-t { font-size: 34px; }

/* ════ Récords ════ */
.rt .pr-l { margin-top: 10px; }

.rt .card .pr-l .btn { margin-top: 0; }

/* ════ Resumen: rango, ánimo, datos ════ */
.rt .rango { font: 400 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted2); }

.rt .rangos li { padding: 7px 0 0; border-top: 3px solid color-mix(in srgb, var(--k) 35%, transparent); font: 600 9.5px/1 var(--sans); letter-spacing: .02em; text-align: center; color: var(--muted2); overflow: hidden; text-overflow: ellipsis; }

/* ════ Botón + y hoja de anotar ════ */
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; place-items: center; width: 60px; height: 60px; padding: 0; border: 0; color: #0B0715; background: linear-gradient(135deg, #F5D08A, #E9B75B 50%, #FF8F5E); box-shadow: 0 10px 30px rgba(233,183,91,.4), 0 0 0 1px rgba(255,255,255,.2) inset; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .15s ease; }
.fab[hidden] { display: none; }
.fab:active { transform: scale(.92); }
.fab svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }

.rt.sheet { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: flex-end; justify-content: center; background: rgba(5,3,10,0); transition: background-color .22s ease; }

.rt .sh-in { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: #150E24; border-top: 1px solid var(--line2); clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%, 0 18px); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.3,1); }

.rt .sh-top { display: flex; align-items: center; justify-content: space-between; }

.rt .sh-tabs { --c: #E9B75B; }
.rt .sh-tabs button { font-size: 12.5px; }
.rt .sh-b { padding-top: 4px; }
.rt .sh-nota { margin-top: 10px; }
.rt .sh-acc { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; margin-top: 14px; }

.rt .sh-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; }
.rt .sh-big { margin-top: 12px; font-size: 15px; color: var(--muted); }

.rt .sh-l { margin-top: 14px; }
.rt .vasos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.rt .vasos i { width: 28px; height: 36px; border: 2px solid rgba(95,214,224,.4); border-top: 0; clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); background: rgba(95,214,224,.06); }
.rt .vasos i.si { background: linear-gradient(180deg, #8EE8F0, #5FD6E0); border-color: #5FD6E0; }
/* ════ Arranque de la primera vez ════ */
html.arr-abierto, html.arr-abierto body { overflow: hidden; }
body.bloqueado .arr { display: none !important; }
.rt.arr { position: fixed; inset: 0; z-index: 10001; overflow: auto; background: #0B0715; opacity: 0; transition: opacity .25s ease; }
.rt.arr[hidden] { display: none; }
.rt.arr.on { opacity: 1; }
.rt.arr::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(80% 50% at 0% 0%, rgba(233,183,91,.2), transparent 70%), radial-gradient(70% 45% at 100% 100%, rgba(169,139,255,.16), transparent 70%); }
.rt .arr-in { position: relative; max-width: 480px; min-height: 100%; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
.rt .arr-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; flex-direction: row-reverse; }

.rt .arr-pr { display: flex; gap: 6px; }

.rt .arr-c { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 18px 0 8px; animation: rt-rise .35s cubic-bezier(.2,.7,.3,1); }
.rt .arr-k { font: 600 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.rt .arr-t { margin-top: 14px; font: 700 42px/1.02 var(--display); background: linear-gradient(100deg, #F3EDE4 35%, #F5D08A 70%, #FF8F5E); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 4px; }
.rt .arr-s { margin-top: 10px; font: 400 17px/1.45 var(--sans); color: var(--muted); }
.rt .arr-c .fld { margin-top: 26px; }
.rt .arr-big { height: 60px; font: 700 26px/1 var(--display); }
.rt .arr-go { width: 100%; min-height: 56px; margin-top: 28px; font-size: 17px; }
.rt .arr-skip { display: block; margin: 10px auto 0; color: var(--muted); font-size: 14px; }
.rt .arr-como { margin-top: 26px; }
.rt .arr-como li { display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.rt .arr-como li:first-child { border-top: 0; }
.rt .arr-como span { grid-row: span 2; display: grid; place-items: center; width: 52px; height: 52px; font-size: 26px; background: rgba(255,255,255,.05); clip-path: var(--bevel-sm); }

.rt .arr-box .btn { margin-top: 12px; }
.rt .arr-ok { color: #4BD489 !important; font-weight: 600; }
.rt .arr-n { margin-top: 12px; min-height: 18px; font-size: 14px; color: var(--coral); }
/* ════ Entreno más calmo: el día como tarjeta, no como cartel ════ */
.rt .block { margin: 16px 0 0; padding: 18px 18px 18px 20px; color: var(--ink); background: linear-gradient(150deg, color-mix(in srgb, var(--c) 26%, #150E24), rgba(21,14,36,.95) 70%); border-left: 4px solid var(--c); clip-path: var(--bevel); }
.rt .block::after { display: none; }

.sx * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.sx button, .sx .nosel { -webkit-user-select: none; user-select: none; }
.sx input, .sx textarea, .sx select { font-size: 16px; }
.sx { overscroll-behavior-y: contain; }
.sx { font-variant-numeric: tabular-nums; }
.sx button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
.sx input, .sx textarea, .sx select { font-family: inherit; }
.sx input:focus-visible, .sx button:focus-visible, .sx textarea:focus-visible, .sx select:focus-visible {
  outline: 2px solid ${s.gold}; outline-offset: 2px;
}
.sx .tap:active { filter: brightness(1.25); }
.sx ::-webkit-scrollbar { height: 5px; width: 5px; }
.sx ::-webkit-scrollbar-thumb { background: ${s.line}; }
.bevel { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
.bevel-sm { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
@keyframes fly { 0% { opacity: 0; transform: translateY(6px) scale(.85); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px) scale(1); } }
@keyframes pop { 0% { transform: scale(.6) rotate(-12deg); } 65% { transform: scale(1.18) rotate(4deg); } 100% { transform: scale(1); } }
@keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes shine { from { background-position: -220% 0; } to { background-position: 220% 0; } }
.fly { animation: fly 1.1s ease-out forwards; }
.pop { animation: pop .3s cubic-bezier(.2,1.5,.4,1); }
.glow { animation: glow 2.4s ease-in-out infinite; }
.rise { animation: rise .35s ease-out; }
.shine {
  background-image: linear-gradient(100deg, transparent 38%, rgba(255,255,255,.22) 50%, transparent 62%);
  background-size: 220% 100%; animation: shine 2.6s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {

<script>
(function () {
  "use strict";

  const PANE = document.getElementById("pane-entreno");
  const HOY = document.getElementById("hoy-body");
  const CFG = window.CONFIG || {};
  const MARCA = CFG.marca || "tu entrenador";
  const TEL = CFG.tel || "11 7115-8427";
  if (CFG.acento) PANE.style.setProperty("--gold", CFG.acento);

  /* La rutina se guarda en este celular: sin cuentas, sin servidor */
  const KEY_STATE = "rutina-cliente";
  let BASE = { v: 1, days: [] };
  try { BASE = JSON.parse(document.getElementById("rt-data").textContent); } catch (err) { /* datos rotos */ }

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY_STATE);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && o.days && o.days.length) return o;
      }
    } catch (err) { /* sin almacenamiento */ }
    return JSON.parse(JSON.stringify(BASE));
  }
  function saveState(st) { localStorage.setItem(KEY_STATE, JSON.stringify(st)); }

  let state = loadState();
  const dayById = (id) => state.days.find((d) => d.id === id);

  /* ---------- Utilidades ---------- */
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pad2 = (n) => (n < 10 ? "0" : "") + n;
  const LETTERS = "ABCDEFGH";
  const pk = (k, day, list, i, j) => [k, day, list == null ? "" : list, i == null ? "" : i, j == null ? "" : j].join(":");
  const presc = (it) => (it.se && it.re ? it.se + "×" + it.re : it.se || it.re || "");
  const hasVal = (z) => !!(z && (z.r || z.p));
  const WEEKDAYS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

  function todayKey() {
    const t = new Date();
    return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
  }
  function fmtDay(k) {
    if (!k) return "anterior";
    if (k === todayKey()) return "hoy";
    const p = k.split("-").map(Number);
    return p[2] + "/" + p[1] + (p[0] !== new Date().getFullYear() ? "/" + String(p[0]).slice(-2) : "");
  }
  function longDay(k) {
    const p = k.split("-").map(Number);
    return WEEKDAYS[new Date(p[0], p[1] - 1, p[2]).getDay()] + " " + p[2] + "/" + p[1];
  }

  const CHECK = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CLOCK = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2.5M9.5 3h5"/></svg>';
  const XIC = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
  const PEN = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';

  /* Series hechas hoy, progreso del día y mejor marca */
  const num = (v) => { const n = parseFloat(String(v).replace(",", ".").replace(/[^\d.]/g, "")); return isNaN(n) ? null : n; };
  const todaySets = (it) => {
    const s = (it.hist || []).find((z) => z.d === todayKey());
    return s ? s.sets.filter(hasVal) : [];
  };
  const flat = (d) => (d.blocks || d.items || []).reduce((acc, b) => acc.concat(b.type ? b.items : [b]), []);
  function progress(d) {
    const list = flat(d);
    return { done: list.filter((it) => todaySets(it).length).length, total: list.length };
  }
  function best(it) {
    let top = null;
    (it.hist || []).forEach((s) => s.sets.forEach((x) => {
      const p = num(x.p), r = num(x.r);
      if (p == null && r == null) return;
      const score = (p == null ? 0 : p) * 1000 + (r == null ? 0 : r);
      if (!top || score > top.score) top = { score: score, set: x, d: s.d };
    }));
    return top;
  }
  function restSecs(it, gr) {
    const s = String((gr && gr.r) || it.r || "").trim();
    const m = s.match(/(\d+)\s*(?:[-–]\s*\d+\s*)?(['\u2032]|"|\u2033|min|seg|s)?/i);
    if (!m) return 90;
    const n = Number(m[1]);
    const u = (m[2] || "").toLowerCase();
    const mins = u === "'" || u === "\u2032" || u === "min";
    return Math.max(10, Math.min(900, mins ? n * 60 : n));
  }
  const mmss = (s) => Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);

  const fmtNum = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");
  const fmtKilo = (n) => (Math.round(n * 100) / 100).toString().replace(".", ",");
  const fmtKg = (n) => Math.round(n).toLocaleString("es-AR");
  const volumen = (sets) => (sets || []).reduce((n, x) => { const r = num(x.r), p = num(x.p); return n + (r && p ? r * p : 0); }, 0);
  const volDia = (d) => flat(d).reduce((n, it) => n + volumen(todaySets(it)), 0);
  const seriesDia = (d) => flat(d).reduce((n, it) => n + todaySets(it).length, 0);

  function semana() {
    const ws = weekStart();
    let kg = 0, series = 0;
    const dias = {}, porDia = {};
    state.days.forEach((d) => flat(d).forEach((it) => (it.hist || []).forEach((s) => {
      if (!s.d || s.d < ws) return;
      const hechas = s.sets.filter(hasVal);
      if (!hechas.length) return;
      const v = volumen(hechas);
      kg += v;
      series += hechas.length;
      dias[s.d] = true;
      porDia[s.d] = (porDia[s.d] || 0) + v;
    })));
    return { kg: kg, series: series, dias: dias, porDia: porDia };
  }

  /* Datos de la pestaña Sistema, solo de lectura */
  function sistemaData() {
    try {
      const raw = localStorage.getItem("sistema:v1");
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && d.habits && d.habits.length ? d : null;
    } catch (err) {
      return null;
    }
  }
  function hecho(h, log) {
    const v = log[h.id];
    if (h.type === "count") return typeof v === "number" ? v >= (h.target || 1) : !!v;
    return !!v;
  }
  /* Misma cuenta que el panel de Sistema: los hábitos en pausa no cuentan,
     y uno que depende de otro solo toca si el otro tocaba y se hizo */
  function toca(h, k, d) {
    if (h.paused) return false;
    const p = k.split("-").map(Number);
    const dow = new Date(p[0], p[1] - 1, p[2]).getDay();
    if (h.dependsOn) {
      const padre = d.habits.find((x) => x.id === h.dependsOn);
      return !!padre && toca(padre, k, d) && hecho(padre, (d.log || {})[k] || {});
    }
    return !h.days || h.days.indexOf(dow) > -1;
  }
  function avance(h, log) {
    const v = log[h.id];
    if (h.type === "count") return Math.min(1, (typeof v === "number" ? v : v ? h.target || 1 : 0) / (h.target || 1));
    return v ? 1 : 0;
  }
  function pctDia(d, k) {
    const log = (d.log || {})[k] || {};
    let tot = 0, hech = 0, n = 0;
    d.habits.forEach((h) => { if (!toca(h, k, d)) return; n++; tot += h.w || 1; hech += avance(h, log) * (h.w || 1); });
    return { n: n, pct: tot ? hech / tot : 0 };
  }
  function misionesHoy(d) {
    const k = todayKey();
    const log = (d.log || {})[k] || {};
    const hs = d.habits.filter((h) => toca(h, k, d));
    let done = 0, xp = 0;
    hs.forEach((h) => { if (hecho(h, log)) { done++; xp += h.w === 2 ? 20 : 10; } });
    return { total: hs.length, done: done, xp: xp };
  }
  /* Días seguidos cumpliendo el 80%, desde ayer para atrás. Un día flojo
     suelto se perdona; dos seguidos cortan la racha. */
  function rachaHabitos(d) {
    const log = d.log || {};
    const t = new Date();
    let n = 0, flojo = false;
    for (let i = 1; i < 400; i++) {
      const day = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
      const k = day.getFullYear() + "-" + pad2(day.getMonth() + 1) + "-" + pad2(day.getDate());
      if (!log[k]) break;
      const r = pctDia(d, k);
      if (!r.n) continue;
      if (r.pct >= 0.8) { n++; flojo = false; }
      else if (flojo) break;
      else flojo = true;
    }
    return n;
  }

  /* Racha de entrenamiento: semanas seguidas, de lunes a domingo, en las
     que entrenaste al menos una vez. Contamos por semana y no por día
     porque descansar está dentro del plan: faltar un martes no es romper
     nada, dejar de ir una semana entera sí. */
  function rachaEntreno() {
    const dias = {};
    state.days.forEach((d) => flat(d).forEach((it) => (it.hist || []).forEach((s) => {
      if (s.d && s.sets.some(hasVal)) dias[s.d] = true;
    })));
    const claves = Object.keys(dias);
    if (!claves.length) return { semanas: 0, estaSemana: false };

    const lunesDe = (f) => {
      const t = new Date(f.getFullYear(), f.getMonth(), f.getDate());
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));            /* lunes = 0 */
      return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
    };
    const semanas = {};
    claves.forEach((k) => {
      const p = k.split("-").map(Number);
      semanas[lunesDe(new Date(p[0], p[1] - 1, p[2]))] = true;
    });

    const hoy = new Date();
    const estaSemana = !!semanas[lunesDe(hoy)];
    let n = 0;
    for (let i = 0; i < 260; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - i * 7);
      if (semanas[lunesDe(d)]) n++;
      else if (i > 0) break;                /* la semana en curso todavía cuenta */
      else if (i === 0) continue;
    }
    return { semanas: n, estaSemana: estaSemana };
  }

  /* ---------- Vista ---------- */
  const restHtml = (r) => '<span class="rest">' + CLOCK + '<span class="sr">Descanso </span>' + esc(r) + "</span>";

  function setHtml(x) {
    const reps = x.r ? "<b>" + esc(x.r) + "</b> " + (x.r === "1" ? "repe" : "repes") : "";
    const kg = x.p ? "<b>" + esc(x.p) + "</b> kg" : "";
    return reps && kg ? reps + " de " + kg : reps || kg;
  }

  function seriesHtml(sets) {
    return '<ol class="sl">' + sets.filter(hasVal).map((x, k) =>
      '<li><span class="sn">Serie ' + (k + 1) + '</span><span class="sv">' + setHtml(x) + "</span></li>").join("") + "</ol>";
  }

  /* una sola línea: la lista entera de series ocupaba media pantalla por ejercicio */
  function logHtml(it) {
    const s = latestSession(it.hist, false);
    if (s) {
      const hoy = s.d === todayKey();
      const resumen = s.sets.filter(hasVal).map((x) => (x.p ? fmtNum(num(x.p)) + " kg × " : "") + (x.r || "")).join(" · ");
      return '<div class="log"><p class="lg-1' + (hoy ? " lg-ok" : "") + '">' + (hoy ? CHECK + "Hoy: " : "Última vez (" + esc(fmtDay(s.d)) + "): ") + "<b>" + esc(resumen) + "</b></p></div>";
    }
    return '<div class="log only-edit"><span class="addlog">+ Anotar series</span></div>';
  }

  function innerHtml(it, withLog) {
    const p = presc(it);
    let h = '<p class="nm">' + esc(it.n) + "</p>";
    h += '<div class="sets">' + (p ? "<b>" + esc(p) + "</b>" : "") + (it.sq ? "<small>" + esc(it.sq) + "</small>" : "") + "</div>";
    const bits = [];
    if (it.r) bits.push(restHtml(it.r));
    if (it.note) bits.push("<span>" + esc(it.note) + "</span>");
    if (bits.length) h += '<div class="sub">' + bits.join("") + "</div>";
    if (withLog) h += objetivoHtml(it) + logHtml(it);
    return h;
  }

  function hitHtml(label, k, day, list, i, j) {
    return '<button type="button" class="hit" data-act="edit" data-k="' + k + '" data-day="' + day + '" data-list="' + (list || "") +
      '" data-i="' + (i == null ? "" : i) + '" data-j="' + (j == null ? "" : j) + '" aria-label="' + esc("Editar: " + label) + '"></button>';
  }

  function rowHtml(d, list, it, i, withLog) {
    if (isEd("ex", d.id, list, i, null)) return '<li class="edli">' + editorHtml() + "</li>";
    const ok = withLog && todaySets(it).length;
    return '<li class="row' + (ok ? " hecho" : "") + '" data-p="' + pk("ex", d.id, list, i, null) + '">' + hitHtml(it.n, "ex", d.id, list, i, null) +
      '<span class="n">' + (ok ? CHECK : i + 1) + "</span>" + innerHtml(it, withLog) + "</li>";
  }

  function blockHtml(d, b, i) {
    if (!b.type) return rowHtml(d, "blocks", b, i, true);
    const ss = b.type === "ss";
    const head = ss ? '<div class="ghead"><span class="glbl">Superserie</span>' + (b.r ? restHtml(b.r) : "") + "</div>" : "";
    const mems = b.items.map((it, j) => {
      if (isEd("ex", d.id, "blocks", i, j)) return '<div class="mem edm">' + editorHtml() + "</div>";
      return '<div class="mem' + (todaySets(it).length ? " hecho" : "") + '" data-p="' + pk("ex", d.id, "blocks", i, j) + '">' + hitHtml(it.n, "ex", d.id, "blocks", i, j) +
        (ss ? '<span class="lt">' + LETTERS.charAt(j) + "</span>" : "") + innerHtml(it, true) + "</div>";
    }).join("");
    const editingHere = !!edit && edit.k === "ex" && edit.day === d.id && edit.list === "blocks" && edit.i === i && edit.j != null;
    return '<li class="grp ' + (ss ? "ss" : "pair") + (editingHere ? " editing" : "") + '"><span class="n">' + (i + 1) + "</span>" + head +
      '<span class="rail" aria-hidden="true"></span><div class="mems">' + mems + "</div></li>";
  }

  function actHtml(d) {
    if (!d.activation || !d.activation.length) return "";
    return '<section class="blk"><h3 class="sec">Activación</h3><ul class="act">' + d.activation.map((it, i) => {
      if (isEd("ex", d.id, "activation", i, null)) return '<li class="edli">' + editorHtml() + "</li>";
      return '<li data-p="' + pk("ex", d.id, "activation", i, null) + '">' + hitHtml(it.n, "ex", d.id, "activation", i, null) +
        '<span class="dot" aria-hidden="true"></span>' + innerHtml(it, !!(it.hist && it.hist.length)) + "</li>";
    }).join("") + "</ul></section>";
  }

  function addHtml(d, list) {
    if (edit && edit.k === "new" && edit.day === d.id && edit.list === list) return editorHtml();
    return '<div class="addwrap only-edit"><button type="button" class="btn alt addex" data-act="new" data-day="' + d.id + '" data-list="' + list + '">+ Agregar ejercicio</button></div>';
  }

  function cardioHtml(d) {
    const head = '<h3 class="sec">Cardio</h3>';
    if (isEd("cardio", d.id, null, null, null)) return '<section class="blk">' + head + editorHtml() + "</section>";
    const t = d.cardio || "";
    const m = t.match(/^(\d+(?:\s*[-–]\s*\d+)?\s*min)\s+(.+)$/i);
    const inside = !t ? '<span class="ph">Sin cardio. Tocá para agregar.</span>'
      : m ? "<b>" + esc(m[1]) + "</b><span>" + esc(m[2]) + "</span>" : "<span>" + esc(t) + "</span>";
    return '<section class="blk' + (t ? "" : " only-edit") + '">' + head + '<div class="cvw" data-p="' + pk("cardio", d.id) + '">' +
      hitHtml("Cardio", "cardio", d.id, null, null, null) + '<p class="cv">' + inside + "</p></div></section>";
  }

  function optHtml(d) {
    if (isEd("opt", d.id, null, null, null)) return '<div class="blk">' + editorHtml() + "</div>";
    const t = d.optional || "";
    return '<aside class="opt' + (t ? "" : " only-edit") + '" data-p="' + pk("opt", d.id) + '">' + hitHtml("Opcional", "opt", d.id, null, null, null) +
      "<h3>Opcional</h3><p>" + (t ? esc(t) : '<span class="ph">Tocá para escribir una variante.</span>') + "</p></aside>";
  }

  function planHtml(d) {
    return d.plan.map((p, i) => {
      const head = p.h ? '<h3 class="sec">' + esc(p.h) + "</h3>" : "";
      if (isEd("plan", d.id, "plan", i, null)) return '<section class="blk wk">' + head + editorHtml() + "</section>";
      return '<section class="blk wk">' + head + '<div class="cvw" data-p="' + pk("plan", d.id, "plan", i) + '">' +
        hitHtml(p.h || "Pasos", "plan", d.id, "plan", i, null) + '<p class="cv">' + (p.big ? "<b>" + esc(p.big) + "</b>" : "") +
        "<span>" + (p.t ? esc(p.t) : '<span class="ph">Tocá para escribir.</span>') + "</span></p></div></section>";
    }).join("");
  }

  const HINTS = {
    train: "Tocá un ejercicio para anotar las repes y los kilos de cada serie, o para editarlo.",
    rest: "Tocá un bloque para editarlo.",
    mob: "Tocá un ejercicio para editarlo."
  };

  function progHtml(d) {
    if (d.kind !== "train") return "";
    const p = progress(d);
    const isToday = d.id === TODAY || !dayById(TODAY);
    if (!p.total || (!p.done && !isToday)) return "";
    const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
    const kg = volDia(d), ser = seriesDia(d);
    return '<div class="prog"><div class="prog-h"><p class="prog-t">' + (p.done === p.total ? "¡Día completo!" : "Hoy") + "</p>" +
      '<p class="prog-n">' + p.done + " de " + p.total + " ejercicios</p></div>" +
      '<div class="prog-bar"><span style="width:' + pct + '%"></span></div>' +
      (p.done ? '<div class="prog-k"><span><b>' + ser + "</b> series</span><span><b>" + fmtKg(kg) + "</b> kg movidos</span></div>" : "") +
      (p.done ? '<button type="button" class="btn sm alt prog-s" data-act="share" data-day="' + d.id + '">Mandar la sesión por WhatsApp</button>' : "") +
      "</div>";
  }

  function bodyHtml(d) {
    let h = progHtml(d) + '<p class="hint">' + HINTS[d.kind] + "</p>";
    if (d.kind === "train") {
      h += actHtml(d);
      h += '<section class="blk"><ol class="rows">' + d.blocks.map((b, i) => blockHtml(d, b, i)).join("") + "</ol>" + addHtml(d, "blocks") + "</section>";
      h += cardioHtml(d);
      if ("optional" in d) h += optHtml(d);
    } else if (d.kind === "rest") {
      h += planHtml(d);
    } else {
      h += '<section class="blk"><ol class="rows">' + d.items.map((it, i) => rowHtml(d, "items", it, i, false)).join("") + "</ol>" + addHtml(d, "items") + "</section>";
    }
    return h;
  }

  /* ---------- Edición ---------- */
  let canEdit = false;
  let edit = null;

  function isEd(k, day, list, i, j) {
    return !!edit && edit.k === k && edit.day === day &&
      (edit.list || null) === (list || null) &&
      (edit.i == null ? null : edit.i) === (i == null ? null : i) &&
      (edit.j == null ? null : edit.j) === (j == null ? null : j);
  }
  const dirty = () => !!edit && JSON.stringify(edit.draft) !== edit.orig;

  function normEx(x) {
    x = x || {};
    const o = {};
    ["n", "se", "re", "sq", "r", "note"].forEach((f) => { o[f] = x[f] == null ? "" : String(x[f]); });
    o.hist = (x.hist || []).map((s) => ({
      d: s.d || null,
      sets: (s.sets || []).map((z) => ({ r: z.r == null ? "" : String(z.r), p: z.p == null ? "" : String(z.p) }))
    }));
    return o;
  }

  function cleanEx(x) {
    const o = {};
    ["n", "se", "re", "sq", "r", "note"].forEach((f) => { const v = String(x[f] == null ? "" : x[f]).trim(); if (v) o[f] = v; });
    o.hist = (x.hist || []).map((s) => ({
      d: s.d || null,
      sets: (s.sets || []).map((z) => ({
        r: String(z.r || "").trim().replace(/\s*(repes?|reps?)\.?$/i, "").trim(),
        p: String(z.p || "").trim().replace(/\s*(kgs?|kilos?|k)\.?$/i, "").trim()
      })).filter(hasVal)
    })).filter((s) => s.sets.length);
    return o;
  }

  /* La sesión más reciente con datos; skipToday la deja afuera */
  function latestSession(hist, skipToday) {
    let out = null;
    (hist || []).forEach((s) => {
      if (!s.sets || !s.sets.some(hasVal)) return;
      if (skipToday && s.d === todayKey()) return;
      if (!out || (s.d || "") > (out.d || "")) out = s;
    });
    return out;
  }
  const lastPrev = (hist, tk) => latestSession(hist, true);

  /* Hoy arranca con tantas series como pide el ejercicio (o como hiciste la última vez) */
  function ensureToday(x) {
    const tk = todayKey();
    let s = x.hist.find((z) => z.d === tk);
    if (!s) { s = { d: tk, sets: [] }; x.hist.push(s); }
    const prev = lastPrev(x.hist, tk);
    const se = parseInt(x.se, 10);
    const n = Math.min(12, Math.max(isNaN(se) ? 0 : se, prev ? prev.sets.filter(hasVal).length : 0, 1));
    while (s.sets.length < n) s.sets.push({ r: "", p: "" });
  }

  function inp(f, v, extra) {
    return '<input class="in" data-f="' + f + '" value="' + esc(v) + '" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"' + (extra || "") + ">";
  }
  function fld(label, control, cls) {
    return '<label class="fld' + (cls ? " " + cls : "") + '"><span class="fl">' + label + "</span>" + control + "</label>";
  }

  /* Qué apuntar hoy según lo que hizo la última vez (doble progresión):
     primero se suman repes con el mismo peso; cuando todas las series
     llegan al tope del rango, se sube el peso y se vuelve al piso. */
  function objetivoHoy(x) {
    const prev = lastPrev(x.hist || [], todayKey());
    if (!prev) return null;
    const sets = prev.sets.filter(hasVal);
    if (!sets.length) return null;
    const re = String(x.re || "");
    if (/\d\s*(s|seg|min|'|"|″|′)/i.test(re)) return null;          /* ejercicios por tiempo */
    const ns = (re.match(/\d+/g) || []).map(Number);
    const lo = ns.length ? ns[0] : 0, hi = ns.length ? ns[ns.length - 1] : 0;
    const pesos = sets.map((z) => num(z.p) || 0);
    const w = Math.max.apply(null, pesos);
    if (!w) {
      const r = Math.max.apply(null, sets.map((z) => num(z.r) || 0));
      if (!r) return null;
      if (hi && r >= hi) return { tipo: "sube", r: hi, txt: "Llegaste a " + hi + " repes: sumá peso (mancuernas o una mochila) o hacelas más lentas." };
      return { tipo: "reps", r: r + 1, txt: "La última vez hiciste " + r + " repes. Hoy apuntá a " + (r + 1) + "." };
    }
    const enW = sets.filter((z) => (num(z.p) || 0) === w).map((z) => num(z.r) || 0);
    const peor = Math.min.apply(null, enW);
    if (hi && enW.every((r) => r >= hi)) {
      const sube = w + (w < 10 ? 1 : w < 30 ? 2 : w < 80 ? 2.5 : 5);
      return { tipo: "sube", p: sube, r: lo || peor, txt: "Hiciste " + hi + " repes con " + fmtNum(w) + " kg en todas las series: subí a " + fmtNum(sube) + " kg y volvé a " + (lo || peor) + " repes." };
    }
    if (lo && peor < lo) return { tipo: "mantiene", p: w, r: lo, txt: "Te quedaste en " + peor + " repes, abajo del rango. Mantené " + fmtNum(w) + " kg hasta llegar a " + lo + " en todas las series." };
    const r = hi ? Math.min(hi, peor + 1) : peor + 1;
    return { tipo: "reps", p: w, r: r, txt: "Mismo peso, una repe más: " + fmtNum(w) + " kg × " + r + ". Cuando llegues a " + (hi || r) + " en todas, subís." };
  }
  function sugerencia(x) {
    const o = objetivoHoy(x);
    return o ? o.txt : "";
  }
  /* Lo que se ve en la lista, sin abrir el ejercicio */
  function objetivoHtml(it) {
    if (todaySets(it).length) return "";
    const o = objetivoHoy(it);
    if (!o) return "";
    return '<p class="obj-hoy ' + o.tipo + '">' + (o.tipo === "sube" ? "▲ " : "") + "Hoy: " +
      (o.p ? "<b>" + fmtNum(o.p) + " kg</b> × " : "") + "<b>" + o.r + "</b> repes" + (o.tipo === "sube" ? " · subí de peso" : "") + "</p>";
  }

  function summaryTxt(x) {
    const p = presc(x);
    const rest = "groupR" in x ? x.groupR : x.r;
    let s = p ? p + (x.sq ? " " + x.sq : "") : x.sq || "";
    if (rest) s += (s ? " · " : "") + "descanso " + rest;
    return s || "Sin series ni descanso definidos";
  }

  function rowsHtml(idx, prev) {
    const s = edit.draft.hist[idx];
    const o = prev ? objetivoHoy(edit.draft) : null;
    return s.sets.map((x, k) => {
      const ult = prev && prev.sets.filter(hasVal)[k];
      const ph = o ? { r: String(o.r || (ult && ult.r) || ""), p: o.p ? fmtNum(o.p) : (ult && ult.p) || "" } : ult;
      const pesoNum = num(x.p);
      const mostrarDiscos = edit.discos === idx + ":" + k;
      return '<div class="set' + (mostrarDiscos ? " abierta" : "") + '"><span class="sn">Serie ' + (k + 1) + "</span>" +
        '<input class="in" data-s="' + idx + '" data-k="' + k + '" data-f="r" value="' + esc(x.r) + '" inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="' + esc(ph && ph.r ? ph.r : "") + '" aria-label="Serie ' + (k + 1) + ', repes">' +
        '<span class="u" aria-hidden="true">repes de</span>' +
        '<input class="in" data-s="' + idx + '" data-k="' + k + '" data-f="p" value="' + esc(x.p) + '" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="' + esc(ph && ph.p ? ph.p : "") + '" aria-label="Serie ' + (k + 1) + ', kilos">' +
        '<span class="u" aria-hidden="true">kg</span>' +
        '<button type="button" class="ib" data-act="delset" data-s="' + idx + '" data-k="' + k + '" aria-label="Quitar serie ' + (k + 1) + '">' + XIC + "</button>" +
        '<button type="button" class="verd" data-act="discos" data-s="' + idx + '" data-k="' + k + '">' +
          (mostrarDiscos ? "Ocultar discos" : "¿Qué discos pongo?") + "</button>" +
        (mostrarDiscos ? discosHtml(pesoNum) : "") + "</div>";
    }).join("");
  }

  function pastHtml(idx, isLast) {
    const s = edit.draft.hist[idx];
    const open = !!edit.openSes[idx];
    const label = isLast ? (s.d ? "Última vez · " + fmtDay(s.d) : "Última vez") : (s.d ? fmtDay(s.d) : "Sin fecha");
    let h = '<div class="ses"><div class="ses-h"><p class="ses-t">' + esc(label) + '</p><span class="ses-a">' +
      (open ? "" : '<button type="button" class="btn sm lnk" data-act="opens" data-s="' + idx + '">Editar</button>') +
      '<button type="button" class="btn sm dng" data-act="delses" data-s="' + idx + '">Borrar</button></span></div>';
    if (open) {
      h += rowsHtml(idx, null) + '<div class="tb-b"><button type="button" class="btn sm alt" data-act="addset" data-s="' + idx + '">+ Serie</button></div>';
    } else {
      h += s.sets.some(hasVal) ? seriesHtml(s.sets) : '<p class="reg-e">Sin series anotadas.</p>';
    }
    return h + "</div>";
  }

  function regHtml() {
    const x = edit.draft, tk = todayKey();
    const ti = x.hist.findIndex((s) => s.d === tk);
    const prev = lastPrev(x.hist, tk);
    const tip = sugerencia(edit.draft);
    let h = '<div class="reg">' + (tip ? '<p class="tip">' + esc(tip) + "</p>" : "") + prHtml() + '<div class="today">';
    if (ti > -1) {
      h += '<div class="tb-h"><p class="tb-t">Hoy</p><span class="tb-d">' + esc(longDay(tk)) + "</span></div>" + rowsHtml(ti, prev) +
        '<div class="tb-b"><button type="button" class="btn sm pri" data-act="rest">' + CLOCK + "Descanso " + mmss(edit.rest) + "</button>" +
        '<button type="button" class="btn sm alt" data-act="addset" data-s="' + ti + '">+ Serie</button>' +
        (objetivoHoy(edit.draft) ? '<button type="button" class="btn sm alt" data-act="usar-obj">Usar lo sugerido</button>' : "") +
        (prev ? '<button type="button" class="btn sm alt" data-act="copy">Copiar última vez</button>' : "") + "</div>";
    } else {
      h += '<button type="button" class="btn pri" data-act="today">+ Anotar hoy</button>';
    }
    h += "</div>";
    const past = [];
    x.hist.forEach((s, q) => { if (s.d !== tk) past.push(q); });
    past.sort((a, c) => ((x.hist[c].d || "") > (x.hist[a].d || "") ? 1 : -1));
    const shown = edit.showAll ? past : past.slice(0, 1);
    shown.forEach((idx, n) => { h += pastHtml(idx, n === 0); });
    const more = past.length - shown.length;
    if (more > 0) h += '<button type="button" class="btn sm alt more" data-act="more">Ver ' + more + (more === 1 ? " sesión más" : " sesiones más") + "</button>";
    return h + "</div>";
  }

  /* ───── Calculadora de discos ───── */
  const KEY_BARRA = "rutina-cliente-barra";
  const DISCOS = [25, 20, 15, 10, 5, 2.5, 1.25];
  const COLOR_DISCO = { 25: "#FF6F4E", 20: "#7C9CFF", 15: "#E9B75B", 10: "#4BD489", 5: "#F3EDE4", 2.5: "#9C8AB8", 1.25: "#645279" };
  function barraKg() {
    try { const v = parseFloat(localStorage.getItem(KEY_BARRA)); return isNaN(v) ? 20 : v; } catch (e) { return 20; }
  }
  function discosPara(total) {
    const barra = barraKg();
    if (total <= barra) return { barra: barra, lado: [], resto: 0, exacto: total === barra };
    let porLado = (total - barra) / 2;
    const lado = [];
    DISCOS.forEach((d) => {
      while (porLado >= d - 1e-9) { lado.push(d); porLado -= d; }
    });
    return { barra: barra, lado: lado, resto: Math.round(porLado * 100) / 100, exacto: porLado < 0.01 };
  }
  function discosHtml(total) {
    const r = discosPara(total);
    if (!r.lado.length) {
      return '<div class="disc"><p class="disc-t">Barra sola · ' + fmtKilo(r.barra) + " kg</p></div>";
    }
    const grupos = [];
    r.lado.forEach((d) => {
      const u = grupos[grupos.length - 1];
      if (u && u.d === d) u.n++; else grupos.push({ d: d, n: 1 });
    });
    return '<div class="disc"><p class="disc-t">Por lado · barra de ' + fmtKilo(r.barra) + " kg</p>" +
      '<div class="disc-r">' + grupos.map((g) =>
        '<span class="pl" style="--pc:' + (COLOR_DISCO[g.d] || "#9C8AB8") + '">' +
        (g.n > 1 ? '<b>' + g.n + "×</b>" : "") + fmtKilo(g.d) + "</span>").join("") + "</div>" +
      (r.exacto ? "" : '<p class="disc-n">Te faltan ' + fmtKilo(r.resto * 2) + " kg para el total exacto.</p>") +
      "</div>";
  }

  /* 1RM estimado (Epley) */
  function unRM(reps, peso) {
    const r = num(reps), p = num(peso);
    if (!r || !p || r > 12) return 0;
    return Math.round(p * (1 + r / 30) * 10) / 10;
  }
  function mejor1RM(x) {
    let top = 0, set = null;
    (x.hist || []).forEach((s) => s.sets.forEach((z) => {
      const e = unRM(z.r, z.p);
      if (e > top) { top = e; set = z; }
    }));
    return { v: top, set: set };
  }

  /* Mejor marca y evolución de las últimas sesiones */
  function prHtml() {
    const x = edit.draft;
    const b = best(x);
    if (!b) return "";
    const pts = (x.hist || []).map((s) => {
      let top = 0;
      s.sets.forEach((z) => { const p = num(z.p); if (p != null && p > top) top = p; });
      return top;
    }).filter((v) => v > 0).slice(-8);
    let spark = "";
    if (pts.length > 1) {
      const max = Math.max.apply(null, pts), min = Math.min.apply(null, pts);
      const rango = max - min || 1;
      const xy = pts.map((v, i) => [(i / (pts.length - 1)) * 96 + 2, 30 - ((v - min) / rango) * 24]);
      const linea = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = linea + " L98 34 L2 34 Z";
      const ult = xy[xy.length - 1];
      const sube = pts[pts.length - 1] >= pts[0];
      spark = '<div class="spark' + (sube ? " sube" : " baja") + '" role="img" aria-label="Evolución del peso en las últimas sesiones">' +
        '<svg viewBox="0 0 100 36" preserveAspectRatio="none"><path class="sp-a" d="' + area + '"/>' +
        '<path class="sp-l" d="' + linea + '"/><circle class="sp-p" cx="' + ult[0].toFixed(1) + '" cy="' + ult[1].toFixed(1) + '" r="2.6"/></svg></div>';
    }
    const dif = pts.length > 1 ? pts[pts.length - 1] - pts[0] : 0;
    const rm = mejor1RM(x);
    return '<div class="pr"><div class="pr-x"><p class="pr-t">Tu mejor marca</p><p class="pr-v">' + setHtml(b.set) + "</p>" +
      (dif ? '<p class="pr-d ' + (dif > 0 ? "up" : "down") + '">' + (dif > 0 ? "▲ +" : "▼ ") + fmtNum(Math.abs(dif)) + " kg desde que arrancaste</p>" : "") +
      (rm.v ? '<p class="pr-rm">Tu máximo estimado: <b>' + fmtNum(rm.v) + "</b> kg a 1 repetición</p>" : "") +
      "</div>" + spark + "</div>";
  }

  function cfgHtml() {
    const e = edit, x = e.draft;
    let h = '<div class="cfg">' + fld("Nombre", inp("n", x.n, ' placeholder="Nombre del ejercicio" autocapitalize="sentences"'));
    h += '<div class="srx">' + fld("Series", inp("se", x.se, ' inputmode="numeric" placeholder="–"'), "num") +
      '<span class="x" aria-hidden="true">×</span>' + fld("Repes", inp("re", x.re, ' placeholder="–"'), "num") + "</div>";
    h += '<div class="two">' +
      ("groupR" in x ? fld("Descanso superserie", inp("groupR", x.groupR, ' placeholder="ej. 90&quot;"'))
        : fld("Descanso", inp("r", x.r, ' placeholder="ej. 90&quot;"'))) +
      fld("Aclaración", inp("sq", x.sq, ' placeholder="ej. por lado"')) + "</div>";
    h += fld("Nota", inp("note", x.note, ' placeholder="ej. última rest-pause"'));
    if (e.k === "ex" || e.k === "new") {
      const alts = alternativas(x.n);
      if (alts.length) {
        if (e.swap) {
          h += '<div class="alts"><p class="fl">Elegí el reemplazo</p>' +
            alts.map((a) => '<button type="button" class="op chico" data-act="swap-a" data-n="' + esc(a) + '">' + esc(a) + "</button>").join("") +
            '<button type="button" class="btn sm alt" data-act="swap-no">Dejar el que está</button></div>';
        } else {
          h += '<button type="button" class="btn sm alt swapb" data-act="swap">Cambiar por otro ejercicio</button>';
        }
      }
    }
    if (e.k === "ex") {
      h += e.confirmDel
        ? '<div class="cfm-w"><p class="cfm">¿Eliminar este ejercicio' + (e.reg ? " con todo su registro" : "") + "?</p>" +
          '<div class="btns"><button type="button" class="btn sm alt" data-act="nodel">No</button><button type="button" class="btn sm dngfill" data-act="yesdel">Sí, eliminar</button></div></div>'
        : '<button type="button" class="btn sm dng delx" data-act="del"' + (e.busy ? " disabled" : "") + ">Eliminar ejercicio</button>";
    }
    return h + "</div>";
  }

  function editorHtml() {
    const e = edit, x = e.draft, dis = e.busy ? " disabled" : "";
    let h = '<div class="ed" id="rt-ed" tabindex="-1" role="group" aria-label="' + esc("Editar " + (e.title || e.ctx)) + '">';
    if (e.k === "ex" || e.k === "new") {
      h += '<div class="ed-hd"><p class="ed-k">' + esc(e.ctx) + '</p><p class="ed-t">' + esc(e.k === "new" ? "Nuevo ejercicio" : e.title) + "</p>";
      if (e.k === "ex" && !e.cfg) {
        h += '<div class="ed-sm"><span>' + esc(summaryTxt(x)) + '</span><button type="button" class="btn sm alt" data-act="cfg"' + dis + ">" + PEN + "Editar</button></div>";
      }
      h += "</div>";
      if (e.cfg) h += cfgHtml();
      if (e.reg) h += regHtml();
    } else {
      h += '<p class="ed-t">' + esc(e.ctx) + "</p>";
      if (e.k === "cardio") {
        h += fld("Cardio", inp("cardio", x.cardio, ' placeholder="ej. 20 min bici moderada"'));
      } else if (e.k === "opt") {
        h += fld("Variante opcional", '<textarea class="in" data-f="optional" rows="3">' + esc(x.optional) + "</textarea>");
      } else if (e.k === "plan") {
        h += '<div class="two">' + fld("Cantidad", inp("big", x.big, ' placeholder="ej. 10.000"')) + fld("Detalle", inp("t", x.t, ' placeholder="ej. pasos diarios"')) + "</div>";
      }
    }
    h += '<div class="ed-f"><div class="btns"><button type="button" class="btn alt" data-act="cancel"' + dis + ">Cancelar</button>" +
      '<button type="button" class="btn pri" data-act="save"' + dis + ">" + (e.busy ? "Guardando…" : "Guardar") + "</button></div>" +
      (e.info ? '<p class="info">' + esc(e.info) + "</p>" : "") +
      '<p class="msg" role="alert">' + esc(e.msg) + "</p></div></div>";
    return h;
  }

  /* Borrador local: si la página se recarga en medio de la serie, no se pierde lo anotado */
  const DKEY = "rutina-borrador";
  function backupDraft() {
    if (!edit) return;
    try {
      localStorage.setItem(DKEY, JSON.stringify({ k: edit.k, day: edit.day, list: edit.list, i: edit.i, j: edit.j, title: edit.title, cfg: edit.cfg, draft: edit.draft, at: Date.now() }));
    } catch (err) { /* sin almacenamiento */ }
  }
  function dropDraft() {
    try { localStorage.removeItem(DKEY); } catch (err) { /* sin almacenamiento */ }
  }
  function takeDraft() {
    try {
      const raw = localStorage.getItem(DKEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || !o.draft || Date.now() - o.at > 12 * 3600 * 1000) { dropDraft(); return null; }
      return o;
    } catch (err) {
      return null;
    }
  }
  function afterChange() {
    if (dirty()) backupDraft(); else dropDraft();
  }

  function renderBody(id) {
    const d = dayById(id), el = document.getElementById("rtb-" + id);
    if (!d || !el) return;
    el.innerHTML = bodyHtml(d);
    if (!quieto()) {
      const filas = el.querySelectorAll(".rows > li, .prog, .act > li");
      filas.forEach((f, i) => {
        if (f.querySelector("#rt-ed")) return;
        f.style.animation = "rt-rise .38s cubic-bezier(.2,.7,.3,1) backwards";
        f.style.animationDelay = Math.min(i * 35, 330) + "ms";
      });
    }
  }
  function rerenderEditor() {
    const el = document.getElementById("rt-ed");
    if (el) el.outerHTML = editorHtml();
    else if (edit) renderBody(edit.day);
  }
  function focusEd() {
    const el = document.getElementById("rt-ed");
    if (el) el.focus({ preventScroll: true });
  }
  function focusIn(sel) {
    const el = document.querySelector("#rt-ed " + sel);
    if (el) el.focus();
  }
  function revealEditor() {
    const el = document.getElementById("rt-ed");
    if (el) animar(el);
    if (!el) return;
    const strip = PANE.querySelector(".strip");
    el.style.scrollMarginTop = ((strip ? strip.offsetHeight : 0) + 12) + "px";
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
    el.focus({ preventScroll: true });
  }

  function closeOpenEditor() {
    if (!edit) return true;
    if (edit.busy) return false;
    if (dirty()) {
      if (currentTab() !== edit.day) select(edit.day, {});
      edit.msg = "Guardá o cancelá estos cambios antes de editar otra cosa.";
      rerenderEditor();
      revealEditor();
      return false;
    }
    const prev = edit.day;
    edit = null;
    dropDraft();
    renderBody(prev);
    return true;
  }

  function ctxLabel(d, p) {
    if (p.k === "cardio") return "Cardio";
    if (p.k === "opt") return "Opcional";
    if (p.k === "plan") return d.plan[p.i].h || "Pasos";
    if (p.list === "activation") return "Activación";
    const b = d[p.list][p.i];
    if (p.j != null && b.type === "ss") return "Superserie " + (p.i + 1) + " · " + LETTERS.charAt(p.j);
    return "Ejercicio " + (p.i + 1);
  }

  function newEdit(fields) {
    return Object.assign({ list: null, i: null, j: null, title: "", reg: false, rest: 90, cfg: false, openSes: {}, showAll: false, confirmDel: false, busy: false, msg: "", info: "" }, fields, { orig: JSON.stringify(fields.draft) });
  }

  function openEdit(p, silent) {
    if (!canEdit || !closeOpenEditor()) return false;
    const d = dayById(p.day);
    if (!d) return false;
    let draft, reg = false, title = "", rest = 90;
    if (p.k === "ex") {
      const b = d[p.list] && d[p.list][p.i];
      if (!b) return false;
      const item = p.j != null ? b.items && b.items[p.j] : b;
      if (!item || item.type) return false;
      draft = normEx(item);
      if (p.j != null && b.type === "ss") draft.groupR = b.r || "";
      reg = d.kind !== "mob";
      if (reg) ensureToday(draft);
      title = item.n;
      rest = restSecs(item, p.j != null ? b : null);
    } else if (p.k === "cardio" && d.kind === "train") {
      draft = { cardio: d.cardio || "" };
    } else if (p.k === "opt" && "optional" in d) {
      draft = { optional: d.optional || "" };
    } else if (p.k === "plan" && d.plan && d.plan[p.i]) {
      draft = { big: d.plan[p.i].big || "", t: d.plan[p.i].t || "" };
    } else {
      return false;
    }
    edit = newEdit({ k: p.k, day: p.day, list: p.list || null, i: p.i, j: p.j, title: title, draft: draft, reg: reg, rest: rest, ctx: ctxLabel(d, p) });
    if (!silent) sfx("toque");
    renderBody(p.day);
    if (!silent) revealEditor();
    return true;
  }

  function openNew(day, list, silent) {
    if (!canEdit || !closeOpenEditor()) return false;
    const d = dayById(day);
    if (!d || !Array.isArray(d[list])) return false;
    edit = newEdit({ k: "new", day: day, list: list, draft: normEx({}), cfg: true, ctx: "Ejercicio " + (d[list].length + 1) });
    renderBody(day);
    if (!silent) { revealEditor(); focusIn('[data-f="n"]'); }
    return true;
  }

  function restoreDraft() {
    const o = takeDraft();
    if (!o) return;
    let ok = false;
    if (o.k === "new") {
      ok = openNew(o.day, o.list, true);
    } else {
      if (o.k === "ex") {
        const d = dayById(o.day);
        const b = d && d[o.list] && d[o.list][o.i];
        const item = b && (o.j != null ? b.items && b.items[o.j] : b);
        if (!item || item.n !== o.title) { dropDraft(); return; }
      }
      ok = openEdit({ k: o.k, day: o.day, list: o.list, i: o.i, j: o.j }, true);
    }
    if (!ok || !edit) { dropDraft(); return; }
    edit.draft = o.draft;
    edit.cfg = o.k === "new" || !!o.cfg;
    if (!dirty()) { closeEdit(); return; }
    edit.info = "Recuperé lo que estabas anotando. Tocá Guardar para no perderlo.";
    select(o.day, {});
    renderBody(o.day);
    revealEditor();
  }

  function closeEdit() {
    const e = edit;
    if (!e || e.busy) return;
    edit = null;
    dropDraft();
    renderBody(e.day);
    const back = e.k === "new"
      ? document.querySelector("#rtb-" + e.day + " .addex")
      : daysEl.querySelector('[data-p="' + pk(e.k, e.day, e.list, e.i, e.j) + '"] .hit');
    if (back) back.focus({ preventScroll: true });
  }

  function applyDraft(st, e) {
    const d = st.days.find((x) => x.id === e.day);
    const dr = clone(e.draft);
    if (e.k === "new") {
      d[e.list].push(cleanEx(dr));
      return pk("ex", e.day, e.list, d[e.list].length - 1, null);
    }
    if (e.k === "ex") {
      const list = d[e.list];
      if (e.j != null) {
        const g = list[e.i];
        if (g.type === "ss" && "groupR" in dr) {
          const gr = String(dr.groupR).trim();
          if (gr) g.r = gr; else delete g.r;
        }
        g.items[e.j] = cleanEx(dr);
      } else {
        list[e.i] = cleanEx(dr);
      }
      return pk("ex", e.day, e.list, e.i, e.j);
    }
    if (e.k === "cardio") d.cardio = String(dr.cardio).trim();
    if (e.k === "opt") d.optional = String(dr.optional).trim();
    if (e.k === "plan") { const it = d.plan[e.i]; it.big = String(dr.big).trim(); it.t = String(dr.t).trim(); }
    return pk(e.k, e.day, e.list, e.i, e.j);
  }

  function save() {
    const e = edit;
    if (!e || e.busy) return;
    if ((e.k === "ex" || e.k === "new") && !e.draft.n.trim()) {
      e.msg = "Poné el nombre del ejercicio.";
      rerenderEditor();
      focusIn('[data-f="n"]');
      sfx("error");
      return;
    }
    if (e.k !== "new" && !dirty()) { closeEdit(); return; }
    const antes = e.k === "ex" ? best(itemAt(state, e)) : null;
    const next = clone(state);
    const where = applyDraft(next, e);
    let msg = "Guardado";
    if (antes !== undefined) {
      const desp = e.k === "ex" ? best(itemAt(next, e)) : null;
      if (desp && (!antes || desp.score > antes.score) && desp.d === todayKey()) {
        msg = "¡Récord! " + String(setHtml(desp.set)).replace(/<[^>]+>/g, "");
      }
    }
    commit(next, msg, where);
  }

  function itemAt(st, e) {
    const d = st.days.find((x) => x.id === e.day);
    const b = d && d[e.list] && d[e.list][e.i];
    if (!b) return null;
    return e.j != null ? b.items && b.items[e.j] : b;
  }

  function removeItem() {
    const e = edit;
    if (!e || e.busy || e.k !== "ex") return;
    const next = clone(state);
    const list = next.days.find((d) => d.id === e.day)[e.list];
    if (e.j != null) {
      const g = list[e.i];
      g.items.splice(e.j, 1);
      if (g.items.length === 1) {
        const only = g.items[0];
        if (g.r && !only.r) only.r = g.r;
        list[e.i] = only;
      } else if (!g.items.length) {
        list.splice(e.i, 1);
      }
    } else {
      list.splice(e.i, 1);
    }
    commit(next, "Ejercicio eliminado", null);
  }

  async function commit(next, okMsg, flashAt) {
    const e = edit;
    e.busy = true;
    e.msg = "";
    e.confirmDel = false;
    rerenderEditor();
    const res = await persist(next);
    if (edit !== e) return;
    if (res.ok) {
      const antesDia = e.k === "ex" || e.k === "new" ? progress(dayById(e.day) || { blocks: [] }) : null;
      state = next;
      edit = null;
      dropDraft();
      renderBody(e.day);
      refreshTabs();
      renderHoy();
      let sonado = false;
      if (antesDia) {
        const ahora = progress(dayById(e.day) || { blocks: [] });
        const cerro = ahora.total && ahora.done === ahora.total && antesDia.done < ahora.total;
        if (cerro) { festejo(true); okMsg = "¡Día completo!"; sfx("dia"); sonado = true; }
        else if (String(okMsg).indexOf("Récord") === 0) { festejo(false); sfx("record"); sonado = true; }
      }
      if (!sonado) sfx(okMsg === "Ejercicio eliminado" ? "quitar" : "guardar");
      if (flashAt) flash(flashAt);
      showStatus(okMsg);
    } else if (res.readOnly) {
      edit = null;
      setCanEdit(false);
      renderBody(e.day);
      showStatus("Solo lectura: acá no se pueden guardar cambios.", 4000);
    } else if (!res.reloading) {
      e.busy = false;
      e.msg = res.msg;
      rerenderEditor();
      backupDraft();
      sfx("error");
    }
  }

  /* ---------- Guardado ---------- */
  async function persist(next) {
    try {
      saveState(next);
      return { ok: true };
    } catch (err) {
      return { ok: false, msg: "No se pudo guardar en este navegador. Puede ser el modo incógnito o falta de espacio." };
    }
  }

  function setCanEdit(v) {
    canEdit = v;
    PANE.classList.toggle("can-edit", v);
  }

  let statusTimer, statusClear;
  function showStatus(text, ms) {
    const el = document.getElementById("rt-status");
    if (!el) return;
    el.firstElementChild.textContent = text;
    el.classList.add("on");
    clearTimeout(statusTimer);
    clearTimeout(statusClear);
    statusTimer = setTimeout(() => {
      el.classList.remove("on");
      statusClear = setTimeout(() => { el.firstElementChild.textContent = ""; }, 300);
    }, ms || 1800);
  }

  function flash(p) {
    const el = daysEl.querySelector('[data-p="' + p + '"]');
    if (!el) return;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1500);
  }

  /* ---------- Armado inicial ---------- */
  const TODAY = ["finde", "lun", "mar", "mie", "jue", "vie", "finde"][new Date().getDay()];
  const tabsEl = document.getElementById("rt-tabs");
  const daysEl = document.getElementById("rt-days");
  const vars = (d) => "--c:" + d.c + ";--on:" + d.on;

  /* ¿Entrenó este día en la semana en curso? */
  function weekStart() {
    const t = new Date();
    const back = (t.getDay() + 6) % 7;
    const m = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back);
    return m.getFullYear() + "-" + pad2(m.getMonth() + 1) + "-" + pad2(m.getDate());
  }
  function trainedThisWeek(d) {
    const ws = weekStart();
    return flat(d).some((it) => (it.hist || []).some((s) => s.d && s.d >= ws && s.sets.some(hasVal)));
  }

  /* Marca de día entrenado en la tira de la semana */
  function refreshTabs() {
    state.days.forEach((d) => {
      const t = document.getElementById("rtt-" + d.id);
      if (!t) return;
      const sp = t.querySelector(".hoy");
      if (!sp) return;
      const isToday = d.id === TODAY;
      const ok = d.kind === "train" && trainedThisWeek(d);
      sp.textContent = isToday ? "hoy" : ok ? "✓" : "";
      sp.classList.toggle("hoy-ok", ok && !isToday);
    });
  }

  function mount() {
    const ws = weekStart();
    tabsEl.innerHTML = state.days.map((d) => {
      const isToday = d.id === TODAY;
      const ok = d.kind === "train" && trainedThisWeek(d);
      const label = d.day + ", " + d.title + (isToday ? ", hoy" : "");
      return '<button type="button" class="tab' + (d.kind === "rest" ? " tab-rest" : "") + '" role="tab" id="rtt-' + d.id + '" aria-controls="rtp-' + d.id +
        '" aria-selected="false" tabindex="-1" aria-label="' + esc(label) + '" style="' + vars(d) + '">' +
        '<span class="sw" aria-hidden="true"></span><span class="lb" aria-hidden="true">' + esc(d.tab) + '</span><span class="hoy' + (ok && !isToday ? " hoy-ok" : "") + '" aria-hidden="true">' + (isToday ? "hoy" : ok ? "✓" : "") + "</span></button>";
    }).join("");

    daysEl.innerHTML = state.days.map((d) =>
      '<section class="day" id="rtp-' + d.id + '" role="tabpanel" aria-labelledby="rtt-' + d.id + '" style="' + vars(d) + '" hidden>' +
        '<header class="block"><h2 class="big" data-lines="' + (d.lines || 1) + '">' + esc(d.day) + "</h2>" +
        '<p class="session">' + esc(d.title) + "</p>" + (d.focus ? '<p class="focus">' + esc(d.focus) + "</p>" : "") + "</header>" +
        '<div class="go-wrap" id="rtgo-' + d.id + '">' + textoGoBoton(d) + "</div>" +
        '<div class="dbody" id="rtb-' + d.id + '">' + bodyHtml(d) + "</div>" +
      "</section>"
    ).join("");
  }
  mount();

  /* El nombre del día ocupa todo el ancho del bloque */
  const LH = 0.84;
  function fit(el) {
    if (!el.getClientRects().length) return;
    const lines = Number(el.getAttribute("data-lines")) || 1;
    let size = 132;
    const apply = () => { el.style.fontSize = size + "px"; };
    const over = () => el.scrollWidth > el.clientWidth + 1 || el.getBoundingClientRect().height > size * LH * lines + 6;
    apply();
    let guard = 0;
    while (over() && size > 34 && guard < 120) { size -= 2; apply(); guard++; }
  }
  const fitVisible = () => PANE.querySelectorAll(".day:not([hidden]) .big").forEach(fit);

  function currentTab() {
    const t = tabsEl.querySelector('[aria-selected="true"]');
    return t ? t.id.slice(4) : TODAY;
  }

  function select(id, opts) {
    opts = opts || {};
    state.days.forEach((d) => {
      const on = d.id === id;
      const t = document.getElementById("rtt-" + d.id);
      const p = document.getElementById("rtp-" + d.id);
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      p.hidden = !on;
      if (on && opts.animate) {
        p.classList.remove("enter");
        void p.offsetWidth;
        p.classList.add("enter");
      }
    });
    if (opts.focus) document.getElementById("rtt-" + id).focus();
    if (opts.animate && window.scrollY > 0) window.scrollTo(0, 0);
    fitVisible();
  }

  tabsEl.addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) select(t.id.slice(4), { animate: true });
  });

  tabsEl.addEventListener("keydown", (e) => {
    const moves = { ArrowRight: 1, ArrowLeft: -1, Home: "first", End: "last" };
    if (!(e.key in moves)) return;
    e.preventDefault();
    const days = state.days;
    const cur = days.findIndex((d) => d.id === currentTab());
    let next;
    if (moves[e.key] === "first") next = 0;
    else if (moves[e.key] === "last") next = days.length - 1;
    else next = (cur + moves[e.key] + days.length) % days.length;
    select(days[next].id, { focus: true, animate: true });
  });

  daysEl.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || !daysEl.contains(b)) return;
    const act = b.dataset.act;
    if (act === "edit") {
      return openEdit({
        k: b.dataset.k, day: b.dataset.day, list: b.dataset.list || null,
        i: b.dataset.i === "" ? null : Number(b.dataset.i),
        j: b.dataset.j === "" ? null : Number(b.dataset.j)
      });
    }
    if (act === "new") return openNew(b.dataset.day, b.dataset.list);
    if (act === "share") return shareDay(b.dataset.day);
    if (act === "rest") { if (edit) tmStart(edit.rest, edit.title); return; }
    if (!edit || edit.busy) return;
    const hist = edit.draft.hist || [];
    switch (act) {
      case "cancel": closeEdit(); break;
      case "save": save(); break;
      case "cfg": edit.cfg = true; rerenderEditor(); break;
      case "swap": edit.swap = true; rerenderEditor(); break;
      case "discos": {
        const clave = b.dataset.s + ":" + b.dataset.k;
        if (edit.discos === clave) { edit.discos = null; rerenderEditor(); break; }
        const campo = document.querySelector('#rt-ed .in[data-s="' + b.dataset.s + '"][data-k="' + b.dataset.k + '"][data-f="p"]');
        const v = num(campo ? campo.value : "");
        if (!v) { edit.msg = "Poné primero cuántos kilos vas a levantar."; rerenderEditor(); sfx("error"); break; }
        const s2 = edit.draft.hist[Number(b.dataset.s)];
        if (s2 && s2.sets[Number(b.dataset.k)]) s2.sets[Number(b.dataset.k)].p = campo.value;
        edit.discos = clave;
        rerenderEditor();
        break;
      }
      case "swap-no": edit.swap = false; rerenderEditor(); break;
      case "swap-a":
        edit.draft.n = b.dataset.n;
        edit.draft.hist = [];
        if (edit.reg) ensureToday(edit.draft);
        edit.swap = false;
        edit.title = b.dataset.n;
        rerenderEditor();
        afterChange();
        break;
      case "del": edit.confirmDel = true; rerenderEditor(); break;
      case "nodel": edit.confirmDel = false; rerenderEditor(); break;
      case "yesdel": removeItem(); break;
      case "more": edit.showAll = true; rerenderEditor(); break;
      case "opens": edit.openSes[b.dataset.s] = true; rerenderEditor(); break;
      case "today":
        ensureToday(edit.draft);
        rerenderEditor();
        focusIn('[data-s="' + hist.findIndex((s) => s.d === todayKey()) + '"][data-k="0"][data-f="r"]');
        afterChange();
        break;
      case "usar-obj": {
        const tk = todayKey(), ti = hist.findIndex((s) => s.d === tk), o = objetivoHoy(edit.draft);
        if (ti < 0 || !o) break;
        hist[ti].sets.forEach((z) => {
          if (!z.r) z.r = String(o.r);
          if (!z.p && o.p) z.p = fmtNum(o.p);
        });
        rerenderEditor();
        afterChange();
        break;
      }
      case "copy": {
        const tk = todayKey(), ti = hist.findIndex((s) => s.d === tk), prev = lastPrev(hist, tk);
        if (ti < 0 || !prev) break;
        const s = hist[ti];

          if (!s.sets[k].p) s.sets[k].p = z.p;
        });
        rerenderEditor();
        afterChange();
        break;
      }
      case "addset": {
        const s = hist[Number(b.dataset.s)];
        if (!s) break;
        s.sets.push({ r: "", p: "" });
        rerenderEditor();
        focusIn('[data-s="' + b.dataset.s + '"][data-k="' + (s.sets.length - 1) + '"][data-f="r"]');
        afterChange();
        break;
      }
      case "delset": {
        const s = hist[Number(b.dataset.s)];
        if (!s) break;
        s.sets.splice(Number(b.dataset.k), 1);
        sfx("quitar");
        rerenderEditor();
        focusEd();
        afterChange();
        break;
      }
      case "delses":
        hist.splice(Number(b.dataset.s), 1);
        edit.openSes = {};

        focusEd();
        afterChange();

  /* Importar la rutina armada en la pestaña Armar */
  const COLORS = ["#7C9CFF", "#4BD489", "#FF6F4E", "#A98BFF", "#E9B75B", "#5FD6E0"];
  function restTxt(s) {
    if (!s) return "";
    const m = String(s).match(/(\d+)\s*(min|seg)/i);
    if (!m) return String(s).trim();
    return /min/i.test(m[2]) ? m[1] + "'" : m[1] + '"';
  }
  function parsePlan(txt) {
    const days = [];
    let cur = null;
    String(txt || "").split(/\r?\n/).forEach((ln) => {
      const dm = ln.match(/^\s*D[ÍI]A\s+(\d+)\s*[—–-]\s*(.+?)\s*$/i);
      if (dm) { cur = { n: Number(dm[1]), title: dm[2], items: [] }; days.push(cur); return; }
      const em = ln.match(/^\s+(.+?)\s+[—–-]\s+(\d+)\s+series?\s+de\s+(\d+)(?:\s*a\s*(\d+))?(?:\s*\(pausa\s+([^)]+)\))?/i);
      if (em && cur) cur.items.push({ n: em[1].trim(), se: em[2], re: em[4] ? em[3] + "-" + em[4] : em[3], r: restTxt(em[5]) });
    });
    return days.filter((d) => d.items.length);
  }
  function planToState(days) {
    return { v: 1, days: days.map((d, i) => {
      const t = d.title.charAt(0).toUpperCase() + d.title.slice(1).toLowerCase();
      return { id: "d" + d.n, kind: "train", tab: "D" + d.n, day: "Día " + d.n, title: t,
        c: COLORS[i % COLORS.length], on: "#0B0715",
        blocks: d.items.map((it) => ({ n: it.n, se: it.se, re: it.re, r: it.r, hist: [] })), cardio: "" };
    }) };
  }
  function importHtml() {
    const listo = typeof window.__ultimaRutina === "string" ? parsePlan(window.__ultimaRutina) : [];
    let h = '<div class="pan" id="rt-pan"><p class="pan-t">Traer tu rutina</p>' +
      '<p class="pan-s">Armala en la pestaña Armar, tocá "Guardar mi rutina" y volvé acá. También podés pegar el texto a mano.</p>';
    if (listo.length) {
      h += '<div class="ses"><p class="ses-t">Rutina lista</p><p class="prev">' + listo.length + " días · " +
        listo.reduce((n, d) => n + d.items.length, 0) + " ejercicios: " + esc(listo.map((d) => d.title.toLowerCase()).join(", ")) + "</p></div>";
    }

    return h;
  }
  function applyPlan(txt) {

    if (act === "rut-link" || act === "rut-copiar") {
      const para = ((document.getElementById("rt-para") || {}).value || "").trim().slice(0, 30);
      const win = act === "rut-link" ? window.open("about:blank", "_blank") : null;
      linkRutina(para).then((url) => {
        const txt = (para ? "Hola " + para + "! " : "") + "Te armé tu rutina personalizada. Abrí este link y tocá \"Cargar mi rutina\":\n" + url;
        if (win) { win.location.href = "https://wa.me/?text=" + encodeURIComponent(txt); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => note("Link copiado. Pegalo en el chat del cliente."), () => note(url));
